<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>飛ばない空を見つけろ — AIRLINE MGMT</title><style>
:root{--bg:#071826;--panel:#0d2739;--line:#ffffff18;--ink:#eefaff;--muted:#8ba5b5;--cyan:#71e4ec;--green:#5ee6a8;--amber:#f8ce63;--red:#ff7b8d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70% -15%,#19627b70,transparent 40%),var(--bg);color:var(--ink);font-family:Arial,'Yu Gothic',sans-serif}.top{height:68px;padding:0 4vw;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:#061624ee}.logo{font-weight:900;letter-spacing:.14em}.logo span{color:var(--cyan)}.tag{font-size:10px;color:var(--muted);letter-spacing:.14em}.statbar{display:flex;gap:24px;font-size:12px}.statbar b{display:block;color:#fff;font-size:15px}.shell{max-width:1480px;margin:auto;padding:22px 4vw}.game{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px}.card{background:#0c2638df;border:1px solid var(--line);border-radius:15px;box-shadow:0 16px 35px #0002}.map{height:620px;position:relative;overflow:hidden;background:radial-gradient(ellipse at 51% 46%,#16445b,#082231 65%)}.map:before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0,transparent 48px,#8ce1eb0b 49px),repeating-linear-gradient(0deg,transparent 0,transparent 48px,#8ce1eb0b 49px)}.map-head{position:absolute;z-index:3;top:16px;left:16px;background:#061827d9;border:1px solid var(--line);border-radius:10px;padding:10px 12px}.map-head h1{margin:0;font-size:17px}.map-head p{font-size:10px;color:var(--muted);margin:4px 0 0}.route-line{position:absolute;height:2px;background:linear-gradient(90deg,var(--cyan),#6d7cff);transform-origin:0 50%;opacity:.8;box-shadow:0 0 8px #5ce1ee}.route-line.warn{background:var(--amber)}.plane{position:absolute;color:#fff;font-size:15px;text-shadow:0 0 8px var(--cyan);z-index:2}.airport{position:absolute;z-index:2;transform:translate(-50%,-50%);border:0;background:transparent;color:#d9fbff;cursor:pointer;font-size:11px;font-weight:bold;text-shadow:0 1px 4px #000}.airport i{display:block;margin:auto;width:13px;height:13px;border:3px solid var(--cyan);background:#fff;border-radius:50%;box-shadow:0 0 0 4px #75e5ed28,0 0 14px #75e5ed}.airport:hover i,.airport.active i{background:var(--cyan);transform:scale(1.25)}.airport small{display:block;color:#9bc8d2;margin-top:4px}.map-foot{position:absolute;z-index:3;bottom:13px;left:14px;right:14px;display:flex;justify-content:space-between;border:1px solid var(--line);background:#061827d9;border-radius:8px;padding:8px 10px;color:var(--muted);font-size:10px}.side{padding:15px}.side h2{font-size:16px;margin:0}.side p{font-size:11px;line-height:1.55;color:var(--muted)}.market{padding:10px;border:1px solid var(--line);border-radius:10px;background:#061d2c7a;margin:10px 0}.market b{font-size:13px}.market small{display:block;color:var(--muted);font-size:10px;margin-top:4px}.gap{color:var(--green)}.blocked{color:var(--red)}.field{margin-top:12px}.field label{display:block;font-size:10px;color:#abc6d1;font-weight:bold;margin-bottom:5px}.field select,.field input{width:100%;padding:9px;border-radius:7px;border:1px solid var(--line);background:#061827;color:#fff;font:inherit;font-size:12px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{margin-top:12px;width:100%;border:0;border-radius:8px;padding:10px;background:var(--cyan);color:#05212d;font-weight:bold;cursor:pointer}.btn.secondary{background:#ffffff10;color:#d9f5f8;border:1px solid var(--line)}.routes{border-top:1px solid var(--line);margin-top:13px;padding-top:12px;max-height:195px;overflow:auto}.route{padding:9px 0;border-bottom:1px solid #ffffff0d;font-size:11px}.route b{display:block}.route span{color:var(--muted);font-size:10px}.modal{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:#03101bdd}.modal.hide{display:none}.start{width:min(840px,92vw);padding:30px}.start h1{font-size:30px;margin:0}.start h1 span{color:var(--cyan)}.start>p{color:var(--muted);font-size:13px;line-height:1.65}.bases{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}.base{padding:16px;text-align:left;border-radius:12px;border:1px solid var(--line);background:#ffffff06;color:#fff;cursor:pointer}.base:hover{border-color:var(--cyan);background:#71e4ec13}.base b{font-size:16px}.base small{display:block;color:var(--muted);margin:6px 0;font-size:11px}.base em{font-style:normal;color:var(--green);font-size:11px}.result{margin-top:12px;padding:10px;border-radius:8px;background:#5ee6a810;color:#c7f9df;font-size:11px;line-height:1.5}.turn{font-size:12px;color:var(--muted)}.toast{position:fixed;right:20px;bottom:20px;z-index:12;background:#0d3948;border:1px solid #71e4ec88;border-radius:9px;padding:12px;opacity:0;transform:translateY(10px);transition:.2s;font-size:12px}.toast.show{opacity:1;transform:none}@media(max-width:980px){.game{grid-template-columns:1fr}.map{height:520px}.statbar{gap:10px}.bases{grid-template-columns:1fr}}@media(max-width:600px){.nav{display:none}.statbar{font-size:10px}.shell{padding:15px}.map{height:480px}.start{padding:22px}.start h1{font-size:24px}}
</style></head><body><header class="top"><div><div class="logo">AIRLINE <span>MGMT</span></div><div class="tag">飛ばない空を見つけ、そこに線を引け。</div></div><div class="statbar"><div>第 <b id="week">1週</b></div><div>資金 <b id="cash">¥120,000,000</b></div><div>評判 <b id="rep">50</b></div><div>稼働機 <b id="fleet">0 / 2</b></div></div></header><main class="shell"><section class="game"><div class="card map" id="map"><div class="map-head"><h1>国内運航レーダー</h1><p>自社便を青、空白候補を緑で表示</p></div><div id="mapRoutes"></div><div id="mapAirports"></div><div class="map-foot"><span>● 自社運航　● 空白候補　● 大手本丸</span><span id="baseLabel">本社を選択してください</span></div></div><aside class="card side"><div id="panel"></div></aside></section></main><div class="modal" id="start"><section class="card start"><p class="tag">CEO / STARTING DECISION</p><h1>どの空港から<span>空白</span>を飛ぶ？</h1><p>本社は夜間格納費を決め、最初に見つかる市場を変えます。小型ジェット2機、初期資金1億2,000万円で開始します。</p><div class="bases"><button class="base" onclick="startGame('旭川')"><b>旭川空港</b><small>ニッチ特化 / 新千歳の影</small><em>夜間格納 1　難易度：中</em></button><button class="base" onclick="startGame('仙台')"><b>仙台空港</b><small>地方ハブ / 空白に近い</small><em>夜間格納 1　難易度：低</em></button><button class="base" onclick="startGame('福岡')"><b>福岡空港</b><small>需要大 / 中堅と衝突</small><em>夜間格納 1　難易度：中</em></button></div></section></div><div class="toast" id="toast"></div><script>
const A={旭川:[29,14,0.33,'AKJ',0],新千歳:[39,18,1.4,'CTS',1],仙台:[54,39,2.3,'SDJ',0],羽田:[61,50,14.0,'HND',2],中部:[51,57,7.5,'NGO',1],伊丹:[46,61,8.8,'ITM',2],高知:[41,70,.69,'KCZ',0],福岡:[31,73,5.1,'FUK',1],鹿児島:[27,82,1.58,'KOJ',0],那覇:[15,94,1.46,'OKA',1]};const gaps=new Set(['旭川-仙台','仙台-高知','高知-那覇','鹿児島-仙台','旭川-福岡','仙台-鹿児島']);let S={base:null,cash:120000000,rep:50,week:1,routes:[],selected:'仙台'};const map=document.getElementById('map');
function pos(n){return{x:A[n][0],y:A[n][1]}}function routeKey(a,b){return[a,b].sort().join('-')}function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2600)}function startGame(base){S.base=base;S.selected=base;document.getElementById('start').classList.add('hide');render()}function distance(a,b){const p=pos(a),q=pos(b);return Math.hypot(p.x-q.x,p.y-q.y)*18}function render(){document.getElementById('week').textContent=S.week+'週';document.getElementById('cash').textContent='¥'+Math.round(S.cash).toLocaleString();document.getElementById('rep').textContent=S.rep;document.getElementById('fleet').textContent=S.routes.length+' / 2';document.getElementById('baseLabel').textContent='本社：'+S.base+'空港　夜間格納費 ×1';const ap=document.getElementById('mapAirports');ap.innerHTML=Object.entries(A).map(([n,v])=>`<button class="airport ${S.selected===n?'active':''}" style="left:${v[0]}%;top:${v[1]}%" onclick="selectAirport('${n}')"><i></i>${n}<small>${v[3]} / ${v[2]}百万人</small></button>`).join('');const rl=document.getElementById('mapRoutes');rl.innerHTML=S.routes.map((r,i)=>{const p=pos(r.from),q=pos(r.to),dx=q.x-p.x,dy=q.y-p.y,len=Math.hypot(dx,dy),angle=Math.atan2(dy,dx)*180/Math.PI;return`<span class="route-line" style="left:${p.x}%;top:${p.y}%;width:${len}%;transform:rotate(${angle}deg)"></span><span class="plane" style="left:${p.x+dx*.54}%;top:${p.y+dy*.54}%">✈</span>`}).join('');renderPanel()}function selectAirport(n){S.selected=n;render()}function candidates(){return Object.keys(A).filter(n=>n!==S.base).map(n=>({n,gap:gaps.has(routeKey(S.base,n)),d:Math.round(distance(S.base,n))})).sort((a,b)=>b.gap-a.gap)}function renderPanel(){const c=candidates();const routes=S.routes.map(r=>`<div class="route"><b>${r.type==='loop'?'巡回 ':'往復 '}${r.from} → ${r.to}${r.stop?' → '+r.stop:''}</b><span>${r.frequency}便/週　${r.service}　${r.price}　予想 ¥${r.profit.toLocaleString()}/週</span></div>`).join('')||'<p>まだ路線はありません。地図の空港を選び、試験便を作りましょう。</p>';document.getElementById('panel').innerHTML=`<h2>${S.selected}空港</h2><p>人口 ${A[S.selected][2]}百万人。${S.selected===S.base?'本社拠点：格納費 ×1':'一般空港：夜間格納費 ×5'}</p><div class="market"><b class="${gaps.has(routeKey(S.base,S.selected))?'gap':'blocked'}">${gaps.has(routeKey(S.base,S.selected))?'空白候補：大手が薄い':'競合市場：大手・中堅が運航中'}</b><small>拠点から約${Math.round(distance(S.base,S.selected))}km。遠距離ほど大空港が選ばれやすいが、便数を作れば逆転できます。</small></div><div class="field"><label>運航方式</label><select id="mode"><option value="return">往復便（毎晩、本社へ帰る）</option><option value="loop">巡回便（第2市場を折りたたむ）</option></select></div><div class="field"><label>到着空港</label><select id="dest">${Object.keys(A).filter(n=>n!==S.base).map(n=>`<option ${n===S.selected?'selected':''}>${n}</option>`).join('')}</select></div><div class="field" id="stopField"><label>巡回の第2市場（巡回時のみ）</label><select id="stop">${Object.keys(A).filter(n=>n!==S.base&&n!==S.selected).map(n=>`<option ${n==='高知'?'selected':''}>${n}</option>`).join('')}</select></div><div class="row"><div class="field"><label>便数/週</label><select id="freq"><option value="3">3便</option><option value="7">7便</option></select></div><div class="field"><label>価格帯</label><select id="price"><option>早割</option><option selected>普通</option><option>高単価</option></select></div></div><div class="row"><div class="field"><label>サービス</label><select id="service"><option>ベーシック</option><option selected>スタンダード</option><option>フルサービス</option></select></div><div class="field"><label>戦術</label><select id="tactic"><option>ニッチ</option><option>価格</option><option>サービス</option></select></div></div><button class="btn" onclick="planRoute()">路線を試案に追加</button><button class="btn secondary" onclick="advanceWeek()">今週を運航する</button><div class="routes"><h2>運航中の路線</h2>${routes}</div>`;document.getElementById('mode').onchange=e=>document.getElementById('stopField').style.opacity=e.target.value==='loop'?1:.35}
function planRoute(){if(S.routes.length>=2)return toast('機材2機がすべて使用中です。黒字化して追加機材を購入しましょう。');const type=document.getElementById('mode').value,to=document.getElementById('dest').value,stop=type==='loop'?document.getElementById('stop').value:null,freq=+document.getElementById('freq').value,price=document.getElementById('price').value,service=document.getElementById('service').value,tactic=document.getElementById('tactic').value;let markets=[to];if(stop)markets.push(stop);const demand=markets.reduce((s,n)=>s+A[n][2],0)*1000000;const gapBonus=markets.some(n=>gaps.has(routeKey(S.base,n)))?1.25:.72;const priceFactor=price==='高単価'?1.16:price==='早割'?.87:1;const serviceCost=service==='フルサービス'?1.22:service==='ベーシック'?.87:1;const night=type==='loop'?1:1;const profit=Math.round((demand*.0023*freq*gapBonus*priceFactor)-(demand*.0012*freq*serviceCost)-(night*260000));S.routes.push({from:S.base,to,stop,type,frequency:freq,price,service,tactic,profit});toast(type==='loop'?'巡回ダイヤを作成。外泊を避けて2市場を結びます。':'往復便を作成。本社に帰還する安全な運用です。');render()}function advanceWeek(){if(!S.routes.length)return toast('まずは試験便を作成してください。');let p=S.routes.reduce((s,r)=>s+r.profit,0);S.cash+=p;S.week++;S.rep+=p>0?2:-2;if(S.week%4===1)toast(`月次決算：¥${p.toLocaleString()}。空白市場を伸ばすか、第2拠点を検討しましょう。`);else toast(`週次運航完了：¥${p.toLocaleString()}。`);render()}
</script></body></html>
<script>
/* Gameplay loop expansion: aircraft, daily operations, and aircraft purchases. */
window.startGame = function(base) {
  S.base = base; S.selected = base; S.day = 1;
  S.planes = [
    { id: 'JA01AM', name: '小型ジェット SJ-74', seats: 74, dailyCost: 420000, assigned: null },
    { id: 'JA02AM', name: '小型ジェット SJ-74', seats: 74, dailyCost: 420000, assigned: null },
  ];
  document.getElementById('start').classList.add('hide'); render();
};
window.render = function() {
  document.getElementById('week').textContent = `${S.week}週 ${S.day || 1}日目`;
  document.getElementById('cash').textContent = `¥${Math.round(S.cash).toLocaleString()}`;
  document.getElementById('rep').textContent = S.rep;
  document.getElementById('fleet').textContent = `${S.planes.filter(p => p.assigned).length} / ${S.planes.length}`;
  document.getElementById('baseLabel').textContent = `本社：${S.base}空港　夜間格納費 ×1`;
  document.getElementById('mapAirports').innerHTML = Object.entries(A).map(([n,v]) => `<button class="airport ${S.selected===n?'active':''}" style="left:${v[0]}%;top:${v[1]}%" onclick="selectAirport('${n}')"><i></i>${n}<small>${v[3]} / ${v[2]}百万人</small></button>`).join('');
  document.getElementById('mapRoutes').innerHTML = S.routes.map(r => { const p=pos(r.from),q=pos(r.to),dx=q.x-p.x,dy=q.y-p.y,len=Math.hypot(dx,dy),angle=Math.atan2(dy,dx)*180/Math.PI; return `<span class="route-line" style="left:${p.x}%;top:${p.y}%;width:${len}%;transform:rotate(${angle}deg)"></span><span class="plane" style="left:${p.x+dx*.54}%;top:${p.y+dy*.54}%">✈</span>`; }).join('');
  renderPanel();
};
window.renderPanel = function() {
  const free = S.planes.filter(p => !p.assigned);
  const routeList = S.routes.map(r => `<div class="route"><b>${r.plane}　${r.type==='loop'?'巡回':'往復'} ${r.from} → ${r.to}${r.stop?' → '+r.stop:''}</b><span>${r.frequency}便/週　日次予想 ¥${r.dailyProfit.toLocaleString()}</span></div>`).join('') || '<p>便はまだありません。機材を選び、最初の試験便を作りましょう。</p>';
  const candidates = Object.keys(A).filter(n => n !== S.base).map(n => ({n, gap:gaps.has(routeKey(S.base,n)), d:Math.round(distance(S.base,n))})).sort((a,b)=>b.gap-a.gap);
  const selectedCandidate = candidates.find(c=>c.n===S.selected) || candidates[0];
  document.getElementById('panel').innerHTML = `<h2>${S.selected}空港</h2><p>人口 ${A[S.selected][2]}百万人。${S.selected===S.base?'本社拠点：格納費 ×1':'一般空港：夜間格納費 ×5'}</p><div class="market"><b class="${selectedCandidate.gap?'gap':'blocked'}">${selectedCandidate.gap?'空白候補：大手が薄い':'競合市場：大手・中堅が運航中'}</b><small>拠点から約${selectedCandidate.d}km。便が少ない地域ほど小型機の新規参入余地があります。</small></div><div class="field"><label>使用機材</label><select id="plane">${free.length ? free.map(p=>`<option value="${p.id}">${p.id} / ${p.name}・${p.seats}席</option>`).join('') : '<option>空き機材なし</option>'}</select></div><div class="field"><label>運航方式</label><select id="mode"><option value="return">往復便（毎晩、本社へ帰る）</option><option value="loop">巡回便（第2市場を折りたたむ）</option></select></div><div class="field"><label>到着空港</label><select id="dest">${candidates.map(c=>`<option ${c.n===S.selected?'selected':''}>${c.n}</option>`).join('')}</select></div><div class="row"><div class="field"><label>便数/週</label><select id="freq"><option value="3">3便</option><option value="7">7便</option></select></div><div class="field"><label>価格帯</label><select id="price"><option>早割</option><option selected>普通</option><option>高単価</option></select></div></div><div class="row"><div class="field"><label>サービス</label><select id="service"><option>ベーシック</option><option selected>スタンダード</option><option>フルサービス</option></select></div><div class="field"><label>戦術</label><select id="tactic"><option>ニッチ</option><option>価格</option><option>サービス</option></select></div></div><button class="btn" onclick="planRoute()">② 便を作成する</button><button class="btn secondary" onclick="advanceDay()">④ 1日を運航する</button><div class="routes"><h2>保有機材</h2>${S.planes.map(p=>`<div class="route"><b>${p.id}　${p.name}</b><span>${p.assigned?`運航中：${p.assigned}`:'待機中 / 新規便に使用可能'}</span></div>`).join('')}<button class="btn secondary" onclick="buyPlane()">③ 小型ジェットを購入　¥64,000,000</button><h2>運航中の便</h2>${routeList}</div>`;
  document.querySelector('[onclick="buyPlane()"]').textContent = '③ 小型ジェットを購入　¥150,000,000';
};
window.planRoute = function() {
  const planeId = document.getElementById('plane').value;
  const plane = S.planes.find(p=>p.id===planeId && !p.assigned);
  if (!plane) return toast('空き機材がありません。資金を貯めて機材を購入してください。');
  const to=document.getElementById('dest').value, type=document.getElementById('mode').value, freq=+document.getElementById('freq').value, price=document.getElementById('price').value, service=document.getElementById('service').value, tactic=document.getElementById('tactic').value;
  const demand=(A[to][2]+A[S.base][2])*1000000, gapBonus=gaps.has(routeKey(S.base,to))?1.34:.70, priceFactor=price==='高単価'?1.15:price==='早割'?.88:1, serviceCost=service==='フルサービス'?1.18:service==='ベーシック'?.88:1;
  const nightly = type==='return'?120000:560000;
  // 需要（人）から日次の売上を概算。空白市場は競合の値下げを受けにくい。
  const dailyProfit=Math.round((demand*.10*freq*gapBonus*priceFactor)-(plane.dailyCost*freq/7*serviceCost)-nightly);
  const flight={from:S.base,to,type,frequency:freq,price,service,tactic,plane:plane.id,dailyProfit};
  S.routes.push(flight); plane.assigned=`${S.base}–${to}`;
  toast(`${plane.id} を ${S.base}—${to} 線へ配属。日次予想 ¥${dailyProfit.toLocaleString()}。`); render();
};
window.advanceDay = function() {
  if (!S.routes.length) return toast('先に便を作成してください。');
  const profit=S.routes.reduce((sum,r)=>sum+r.dailyProfit,0); S.cash+=profit; S.day=(S.day||1)+1;
  if (S.day>7) { S.day=1; S.week++; S.rep+=profit>=0?1:-1; }
  toast(`運航完了：本日の収支 ¥${profit.toLocaleString()}。資金は ¥${Math.round(S.cash).toLocaleString()}。`); render();
};
window.buyPlane = function() {
  const cost=150000000; if(S.cash<cost) return toast(`機材購入にはあと ¥${(cost-S.cash).toLocaleString()} 必要です。`);
  S.cash-=cost; const id=`JA${String(S.planes.length+1).padStart(2,'0')}AM`; S.planes.push({id,name:'小型ジェット SJ-74',seats:74,dailyCost:420000,assigned:null}); toast(`${id} を購入。新しい路線を作れます。`); render();
};
</script>
<script>
/* Base selection is a map-first decision: inspect an airport, then confirm it. */
(() => {
  const launchGame = window.startGame;
  const baseTraits = {
    '旭川':'ニッチ特化 / 格納費が安い。新千歳の便の厚さをどう避けるかが鍵。',
    '仙台':'地方ハブ / 東北・四国・九州の空白市場を試しやすい。',
    '福岡':'需要大 / 利益を作りやすいが、中堅航空会社との競合も強い。',
    '新千歳':'観光・季節型 / 冬季の気象リスクと高い需要を併せ持つ。',
    '羽田':'最大需要 / 大手の本丸。拠点としては高難度。',
    '中部':'中部圏 / 東西をつなぐ準幹線への足がかり。',
    '伊丹':'西日本 / 都市需要は大きいが、競合も密集する。',
    '高知':'地域密着 / 小さな市場を巡回便に組み込みやすい。',
    '鹿児島':'南九州 / 離島・観光の需要を取り込める。',
    '那覇':'リゾート / 高単価が狙える一方で天候変動が大きい。'
  };
  const style = document.createElement('style');
  style.textContent = `.base-picker{width:min(980px,94vw);padding:26px}.base-picker h1{font-size:28px;margin:0}.base-picker>p{color:var(--muted);font-size:13px;line-height:1.6}.base-picker-grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(260px,.8fr);gap:16px;margin-top:18px}.base-radar{height:430px;position:relative;overflow:hidden;border:1px solid var(--line);border-radius:12px;background:radial-gradient(ellipse at 51% 46%,#16445b,#082231 65%)}.base-radar:before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0,transparent 48px,#8ce1eb0b 49px),repeating-linear-gradient(0deg,transparent 0,transparent 48px,#8ce1eb0b 49px)}.base-radar-head{position:absolute;top:13px;left:14px;z-index:2;color:#d9fbff;font-size:11px;letter-spacing:.08em}.base-pin{position:absolute;z-index:2;transform:translate(-50%,-50%);border:0;background:transparent;color:#e8fbff;text-shadow:0 1px 4px #000;cursor:pointer;font-size:11px;font-weight:bold}.base-pin:before{content:'';display:block;margin:auto;width:12px;height:12px;border:3px solid var(--cyan);border-radius:50%;background:#fff;box-shadow:0 0 0 4px #75e5ed28,0 0 12px #75e5ed}.base-pin:hover:before,.base-pin.active:before{background:var(--cyan);transform:scale(1.25)}.base-info{padding:18px;border:1px solid var(--line);border-radius:12px;background:#061d2c9e}.base-info .eyebrow{font-size:10px;color:var(--cyan);letter-spacing:.12em}.base-info h2{margin:7px 0 3px;font-size:24px}.base-info p{min-height:96px;color:var(--muted);font-size:12px;line-height:1.7}.base-info dl{margin:16px 0}.base-info dt{font-size:10px;color:#9bc8d2}.base-info dd{margin:3px 0 11px;font-size:13px}.base-info .empty{color:var(--muted);padding-top:50px}.base-picker-note{font-size:11px;color:var(--muted);margin-top:12px}@media(max-width:760px){.base-picker-grid{grid-template-columns:1fr}.base-radar{height:390px}}`;
  document.head.appendChild(style);
  window.chooseBaseAirport = function(name) { S.startSelected = name; window.renderBasePicker(); };
  window.confirmBaseAirport = function() { if (!S.startSelected) return; launchGame(S.startSelected); };
  window.renderBasePicker = function() {
    const selected = S.startSelected;
    const info = selected ? `<div class="eyebrow">AIRPORT PROFILE</div><h2>${selected}空港</h2><div class="tag">${A[selected][3]} / 周辺人口 ${A[selected][2]}百万人</div><p>${baseTraits[selected]}<br>本社にすると、この空港での夜間格納費は最安になります。</p><dl><dt>開始難易度</dt><dd>${selected==='羽田'||selected==='伊丹'?'高':'中'}</dd><dt>最初の行動</dt><dd>周辺の空港を選び、空白候補の試験便を作成</dd></dl><button class="btn" onclick="confirmBaseAirport()">この空港を本社拠点にする</button>` : `<div class="eyebrow">AIRPORT PROFILE</div><h2>空港を選択</h2><p class="empty">地図上の空港をクリックすると、人口・市場特性・開始難易度を確認できます。</p>`;
    document.getElementById('start').innerHTML = `<section class="card base-picker"><p class="tag">CEO / STARTING DECISION</p><h1>地図から、本社空港を<span>選ぶ。</span></h1><p>まず空港をクリックして市場を確認し、納得した場所を本社拠点に決定します。</p><div class="base-picker-grid"><div class="base-radar"><div class="base-radar-head">JAPAN / BASE CANDIDATES</div>${Object.entries(A).map(([name,v])=>`<button class="base-pin ${selected===name?'active':''}" style="left:${v[0]}%;top:${v[1]}%" onclick="chooseBaseAirport('${name}')">${name}</button>`).join('')}</div><aside class="base-info">${info}</aside></div><div class="base-picker-note">本社は夜間格納費が最安です。遠方の空白路線も、機体を本社へ戻す巡回運航にすると有利になります。</div></section>`;
  };
  window.renderBasePicker();
})();
</script>
<script>
/* Explicit event binding keeps the map markers interactive even when inline handlers are unavailable. */
(() => {
  const renderPicker = window.renderBasePicker;
  const confirmPicker = window.confirmBaseAirport;
  const clickStyle = document.createElement('style');
  clickStyle.textContent = '.base-radar:before{pointer-events:none}.base-pin{pointer-events:auto;touch-action:manipulation}.base-pin:focus-visible{outline:2px solid #fff;outline-offset:5px}';
  document.head.appendChild(clickStyle);
  window.renderBasePicker = function() {
    renderPicker();
    document.querySelectorAll('.base-pin').forEach(pin => {
      pin.onclick = null;
      pin.addEventListener('click', () => {
        S.startSelected = pin.textContent.trim();
        window.renderBasePicker();
      });
    });
    const confirm = document.querySelector('[onclick="confirmBaseAirport()"]');
    if (confirm) {
      confirm.onclick = null;
      confirm.addEventListener('click', () => confirmPicker());
    }
  };
  window.renderBasePicker();
})();
</script>
