    .fin-card{display:block;width:100%;text-align:left;padding:11px 12px;border-radius:12px;
      border:2px solid #cfe6f3;background:#f6fbfe;color:#17384a;font-family:inherit;cursor:pointer;min-height:58px}
    .fin-card:hover{background:#eaf6fd;border-color:#9fd3ee}
    .fin-card b{display:block;font-size:14px;line-height:19px}
    .fin-card small{display:block;margin-top:3px;font-size:11px;line-height:15px;color:#496572}
    .fin-card.bank{border-color:#c9ddf7;background:#f2f7ff}
    .fin-card.bank:hover{background:#e9f1ff}
    .fin-card.stock{border-color:#d3e9cd;background:#f5fbf3}
    .fin-card.stock:hover{background:#edf7ea}
    .fin-win{width:min(560px,95vw)}
    /* 証券の窓のタブ。買い物の窓の並べ替えボタンと同じ見た目に揃える */
    .fin-tabs{display:flex;gap:6px;margin:0 0 10px}
    .fin-tab{flex:1;min-height:42px;padding:9px 6px;border-radius:10px;border:2px solid #d8e6ee;background:#fff;
      color:#486a78;font-family:inherit;font-size:13px;font-weight:500;cursor:pointer}
    .fin-tab.on{border-color:#1f9fe0;background:#eaf6fd;color:#12678f}
    .stk-lot{display:flex;align-items:center;gap:6px;margin:0 0 9px}
    .stk-lot>span{font-size:12px;color:#405964;flex:0 0 auto}
    .stk-lot .seg-btn{flex:1;padding:6px 4px;font-size:12px}
    /* ── 2026-10-28：中の<b>と<span>が勝手に改行する件 ──
       .al-info b と .al-info span は「display:block」なので、
       行の中で使った太字（4,200円・燃料費−3%）や業種の札まで
       1行ずつに割れて、1銘柄が6行にも伸びていた。
       直の子だけを行にして、その中の<b><span>は行の中に戻す。 */
    .stk-row .al-info b,.stk-row .al-info span span{display:inline}
    .stk-row .al-info>b,.stk-row .al-info>span{display:block}
    .stk-row .al-b{display:inline-block}
    /* 折り返さない1かたまりにしておく。狭い画面では、行の途中で割れるのではなく
       まるごと次の行へ落ちる（inline-block にしないと、はみ出してボタンの下に潜る） */
    /* 折り返さない1かたまりにしておく。狭い画面では行の途中で割れるのではなく、
       まるごと次の行へ落とす。
       2026-10-28：`.stk-row .al-info span span{display:inline}`（中の<span>を行に戻す規則）に
       負けて効いていなかった。span.stk-hold と書いて、そちらより強くする。 */
    .stk-row .al-info span.stk-hold{white-space:nowrap;display:inline-block}
    /* 値動きの線。横幅いっぱいに伸ばし、上下は30pxに収める */
    .stk-spark{margin:4px 0 2px}
    .stk-spark svg{display:block;width:100%;height:30px;overflow:visible}
    .stk-spark svg.up{color:#1f7a3d}
    .stk-spark svg.down{color:#c0392b}
    .stk-spark i{display:block;font-style:normal;font-size:12px;color:#8697a0;margin-top:1px}
    .stk-spark.none{font-size:12px;color:#8697a0;margin:4px 0 2px}
    /* 他社の株の見出しと、便数の札 */
    .stk-head{font-size:13px;color:#2a4657;margin:16px 0 8px;padding-top:12px;border-top:2px solid #e3edf3}
    .al-b.freq{background:#c2d2da;color:#2a4657}
    .money-line small b{display:inline}
    .stk-row{align-items:flex-start}
    .stk-ic{background:#eef5f9;color:#2a4657;margin-top:2px}
    .stk-sec{background:#8aa5b2;margin-left:6px}
    .stk-px{color:#243f4c}
    .al-info .up{color:#1f7a3d;font-style:normal}.al-info .down{color:#c0392b;font-style:normal}
    .stk-yu i{display:block;font-style:normal;font-size:12px;margin-top:1px}
    .stk-on{color:#1f7a3d}.stk-next{color:#8f650c}.stk-none{color:#7b8f99}
    .stk-tx{color:#8697a0!important}
    .stk-note{font-size:12px;color:var(--muted);margin:9px 2px 0;line-height:1.55}
    /* 大空建設の優待で安くなっているとき、買い物の窓の値段のうしろに出す印 */
    .shop-yutai{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:7px;
      background:#2fa35a;color:#fff;font-size:12px;font-style:normal;font-weight:500}
    .pnl-chart{width:100%;height:96px;background:#f7fbfe;border:1.5px solid #dcecf5;border-radius:12px;}
    .chart-cap{font-size:12px;color:#405964;text-align:right;margin-top:3px;}
    /* 企画（認知度・販促） */
    .aware-box{border:2px solid #dcecf5;border-radius:14px;background:#f7fbfe;padding:10px;margin:8px 0;}
    .aware-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12px;}
    .aware-head b{color:#2a4a5a;}
    .aware-head span{font-size:12px;color:#405964;}
    .aware-bar{height:12px;background:#e4eef5;border-radius:8px;overflow:hidden;margin-top:8px;}
    .aware-bar i{display:block;height:100%;background:linear-gradient(90deg,#38b6ec,#1f9fe0);border-radius:8px;transition:width .2s;}
    /* 図鑑 */
    /* タイトル画面（z:60）より上に出す */
    .pedia-modal{align-items:flex-start;padding:16px 10px;overflow:auto;z-index:70}
    .pd-card{max-width:560px;width:100%;max-height:calc(100vh - 32px);display:flex;flex-direction:column;text-align:left}
    .pd-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
    .pd-top h3{margin:0;font-size:17px}
    .pd-close{border:1.5px solid #d6e4ea;background:#fff;color:#4a6b7c;border-radius:9px;padding:7px 12px;font-weight:500;font-size:12px;cursor:pointer}
    .pd-close:hover{background:#f1f7fa}
    .pd-note{font-size:12px;color:var(--muted);margin:6px 0 8px;line-height:1.5}
    .pd-q{width:100%;border:2px solid #dcecf5;border-radius:10px;padding:9px 11px;font:inherit;font-size:13px;background:#f9fdff}
    .pd-q:focus{outline:none;border-color:var(--cyan)}
    .pd-tabs{display:flex;gap:5px;margin:9px 0 6px}
    .pd-tab{flex:1;border:2px solid #dcecf5;background:#fff;color:#5b7b8c;border-radius:10px;padding:8px 4px;font-weight:500;font-size:12px;cursor:pointer}
    .pd-tab.on{background:var(--cyan);border-color:var(--cyan);color:#05202b}
    .pd-list{overflow:auto;flex:1;min-height:120px;-webkit-overflow-scrolling:touch}
    .pd-cat{font-size:12px;letter-spacing:.08em;color:#496572;margin:12px 0 5px;font-weight:500}
    .pd-item{border:1.5px solid #e4eef5;border-radius:11px;background:#fff;margin-bottom:5px;overflow:hidden}
    .pd-head{width:100%;display:flex;align-items:baseline;justify-content:space-between;gap:8px;
      padding:10px 11px;border:0;background:#fff;cursor:pointer;text-align:left}
    .pd-head:hover{background:#f6fbfd}
    .pd-head.open{background:#eff8fc}
    .pd-head b{font-size:13px;color:#17384a;display:flex;align-items:center;gap:6px}
    .pd-head span{font-size:12px;color:#405964;white-space:nowrap}
    .pd-dot{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none}
    .pd-body{padding:0 11px 11px}
    .pd-body>p{font-size:12px;line-height:1.7;color:#3d5a6b;margin:2px 0 9px}
    .pd-spec{display:grid;grid-template-columns:1fr 1fr;gap:5px}
    .pd-spec>div{background:#f6fafc;border-radius:8px;padding:6px 8px}
    .pd-spec span{display:block;font-size:12px;color:#496572;font-weight:500}
    .pd-spec b{font-size:12px;color:#17384a}
    .pd-tip{font-size:12px;line-height:1.6;color:#5b7b8c;background:#f3f8fb;border-radius:9px;padding:7px 9px;margin:8px 0 0}
    .pd-empty{font-size:12px;color:var(--muted);text-align:center;padding:24px 0}
    @media (max-width:420px){.pd-spec{grid-template-columns:1fr}}
    /* 地域別の知名度リスト */
    .rg-note{font-size:12px;color:#405964;line-height:1.6;margin:4px 0 8px;}
    .rg-note b{color:#2a4a5a;}
    .rg-list{display:flex;flex-direction:column;gap:4px;}
    /* 2026-10-15：説明文は地域名の欄（幅41px）に入れていたため、
       文字を12pxに上げたら2.5字ずつ8行に割れた。説明は行の下に、幅いっぱいで置く。 */
    /* 棒と数値の欄を細くして、地域名が1行に収まるようにする（「♨ 九州」＋「地元」で約80px） */
    .rg-row{display:grid;grid-template-columns:1fr 56px 52px auto;align-items:center;gap:4px 8px;
      border:1.5px solid #e4eef5;border-radius:11px;background:#fff;padding:6px 8px;}
    .rg-sub{grid-column:1/-1;font-size:12px;color:#405964;line-height:1.3}
    .rg-sub b{color:#1373a6}
    .rg-row.home{border-color:#bfe3cb;background:#f6fcf8;}
    .rg-name b{font-size:12px;color:#17384a;}
    .rg-name small{display:block;font-size:12px;color:#405964;margin-top:1px;}
    .rg-name small b{color:#1373a6;}
    .rg-tag{font-style:normal;font-size:12px;color:#2a7a48;background:#e3f4e9;border-radius:5px;padding:1px 4px;margin-left:4px;}
    .rg-bar{position:relative;height:9px;background:#eef3f7;border-radius:6px;overflow:visible;}
    .rg-bar i{display:block;height:100%;background:linear-gradient(90deg,#38b6ec,#1f9fe0);border-radius:6px;transition:width .2s;}
    .rg-bar u{position:absolute;top:-2px;width:2px;height:13px;background:#f0a62e;border-radius:1px;}
    .rg-val{text-align:right;font-size:12px;}
    .rg-val b{color:#17384a;}
    .rg-val em{display:block;font-style:normal;font-size:12px;line-height:1.3;}
    .rg-up{color:#1f7a3d;} .rg-dn{color:#c0392b;} .rg-flat{color:#9aa8b2;}
    @media (max-width:480px){.rg-row{grid-template-columns:1fr 60px auto;}.rg-bar{grid-column:1/-1;order:3}}
    .promo-route{border:1.5px solid #dcecf5;border-radius:12px;background:#fff;padding:8px 10px;margin:6px 0;}
    .pr-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px;}
    .pr-head b{font-size:12px;color:#2a4a5a;}
    .pr-head span{font-size:12px;color:#405964;white-space:nowrap;}
    .pr-ops{display:flex;gap:6px;}
    .pr-ops .promo-btn{flex:1;width:auto;padding:7px 4px;font-size:12px;}
    /* 機体ピッカー（航路タブで機体を選ぶ） */
    .plane-pick{display:flex;flex-direction:column;gap:6px;margin:2px 0 8px;}
    .pick-plane{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:2px solid #cfe6f2;border-radius:12px;background:#fff;padding:8px 10px;cursor:pointer;font-family:inherit;box-shadow:0 3px 0 #eaf4fa;}
    .pick-plane:not(.bad):hover{border-color:#1f9fe0;background:#f2fbff;}
    .pick-plane:not(.bad):active{transform:translateY(2px);box-shadow:0 1px 0 #eaf4fa;}
    .pick-plane.bad{opacity:.6;border-style:dashed;cursor:not-allowed;box-shadow:none;}
    .pick-plane .pp-ic{font-size:20px;color:#1273a2;flex:0 0 auto;}
    .pick-plane .pp-main{flex:1;min-width:0;}
    .pick-plane .pp-main b{display:block;font-size:12px;color:#2a4a5a;}
    .pick-plane .pp-main span{display:block;font-size:12px;color:#405964;}
    .pick-plane .pp-net{flex:0 0 auto;font-size:12px;font-weight:500;text-align:right;}
    .pick-plane .pp-net.ok{color:#1f7a3d;}
    .pick-plane .pp-net.loss{color:#c0392b;}
    .pick-plane .pp-net.ng{color:#b0813a;font-size:12px;font-weight:500;max-width:96px;}
    /* 路線管理（増便・減便・撤退） */
    .route-row .route-ops{display:flex;gap:6px;margin-top:8px;}
    .route-row .route-ops .mini-btn{width:auto;flex:1;margin:0;padding:6px 4px;font-size:12px;}
    .route-row .rt-del{color:#c0392b !important;border-color:#ffc7bd !important;background:#fff3f0 !important;}
    .route-row.lossline{border-color:#ffc0b3 !important;background:#fff4f1 !important;}
    /* 空港ランク・開発 */
    .rank-badge{display:flex;justify-content:space-between;align-items:center;border:2px solid #ccc;border-radius:12px;padding:6px 10px;margin:8px 0 4px;font-size:12px;font-weight:500;background:#fff;}
    .rank-badge b{font-size:15px;}
    .rank-badge .rb-mov{color:#405964;font-weight:500;}
    .dev-list{display:flex;flex-direction:column;gap:6px;}
    .dev-item{display:flex;align-items:center;gap:8px;border:1.5px solid #dcecf5;border-radius:12px;background:#f7fbfe;padding:8px 10px;}
    .dev-info{flex:1;min-width:0;}
    .dev-info b{display:block;font-size:12px;color:#2a4a5a;}
    .dev-info span{display:block;font-size:12px;color:#405964;}
    .dev-btn{flex:0 0 auto;width:auto;padding:8px 10px;font-size:12px;white-space:nowrap;}
    .dev-btn:disabled{opacity:.55;}
    /* ===== 強調は「太さ」ではなく「色」で =====
       日本語は小さい字を太らせると画数がつぶれて読めなくなる。
       11px以下の強調はウエイトを落とし、色で目立たせる。 */
    :root{--em:#1373a6;--em-warm:#8f650c;--em-good:#1f7a3d;--em-bad:#c0392b}
    /* 文章の中のインライン強調 */
    .rl-note b,.rl-sub b,.rl-swing b,.pc-note b,.dp-note b,.dp-head small b,.fc-lead b,
    .tap-hint b,.plane-tip b,.pm-advice b,.pm-head small b,.kind-note b,.fc-ev b,
    .shop-info span b,.market span b,.co-badge small b,.nofit-note b,
    .aware-head span b,.radio-tx b,.tut-tx b,.np-preview small b,
    .ts-tx small b,.setup-head p b,.rl-rest b,.pm-note b,.world-news span b,.dp-card b{
      font-weight:500;color:var(--em)}
    .plane-tip b,.pm-advice b,.fc-ev b{color:var(--em-warm)}
    /* 小さなラベル・数値：800 は重すぎるので 650〜700 に */
    .fc-m,.fc-e,.wxr-c,.sort-lab,.dp-tag,.s-eff,.pm-cnt,.kind-tag,.rs-tag,.co-code,.co-diff,
    .cap-note,.fcd-s,.lease-tag,.al-b,.rb-kind,.pc-h,.rank-val,.rank-name,.pm-req,
    .rl-grid>div span,.rl-total>div span,.pl-cell span,.co-summary span,.airport-fact span,
    .report-total div,.seg-btn small,.ts-tx small,.df-note,.dp-meta,.rl-swing small,
    .np-row>span,.sb-l,.sb-v,.shop-maker,.shop-label,.pm-note,.fc-val{font-weight:500}
    /* いちばん小さい字は、少しだけ大きくして余白をとる */
    .fc-val{font-size:12px;letter-spacing:-.02em}
    .fc-m,.rb-kind,.dp-tag,.kind-tag{letter-spacing:.01em}
    /* ボタンは短い語なので太さを残すが、800 までは要らない */
    .mini-btn,.seg-btn,.shop-tab{font-weight:500}
    /* 数値そのもの（金額・率）は読み取りが主目的。太さより色で差をつける */
    .rl-grid>div b,.rl-total>div b,.pl-cell b,.co-summary b,.airport-fact b,
    .report-total b,.fin-grid b{font-weight:500}
    /* 元の指定のほうが詳細度が高くて残った分。ここは重さを明示的に戻す */
    .wxr-c,.s-eff,.sg-go,.rl-bar span,.fc-peaks .pk b,.rank-more,
    .rank-badge>span,.hl>span{font-weight:500!important}
    .fc-peaks .pk b{font-size:12px}
    /* ===== タイトル画面 ===== */
    /* 上端ぞろえ。中央ぞろえだと、設定を開いた瞬間に全体が再配置されてボタンが動く */
    .title-screen{position:fixed;inset:0;z-index:60;display:grid;justify-items:center;align-content:start;overflow:auto;
      padding:clamp(22px,13vh,120px) 16px 48px;background:linear-gradient(180deg,#8fd4fb 0%,#bfe8ff 46%,#eafaff 100%);}
    .title-screen.hidden{display:none}
    .ts-sky{position:absolute;inset:0;overflow:hidden;pointer-events:none}
    .ts-cloud{position:absolute;display:block;border-radius:999px;background:#fff;opacity:.85;
      box-shadow:38px 10px 0 -6px #fff,78px -4px 0 -12px #fff,-34px 12px 0 -8px #fff;}
    .ts-cloud.a{width:120px;height:40px;top:9%;left:-20%;animation:tsDrift 46s linear infinite}
    .ts-cloud.b{width:86px;height:30px;top:24%;left:-28%;opacity:.7;animation:tsDrift 64s linear infinite 6s}
    .ts-cloud.c{width:150px;height:48px;top:62%;left:-30%;opacity:.6;animation:tsDrift 80s linear infinite 14s}
    .ts-cloud.d{width:70px;height:26px;top:80%;left:-18%;opacity:.75;animation:tsDrift 54s linear infinite 3s}
    @keyframes tsDrift{to{transform:translateX(165vw)}}
    .ts-plane{position:absolute;top:16%;left:-12%;font-size:34px;color:#1373a6;
      filter:drop-shadow(0 4px 6px #5a9dc133);animation:tsFly 22s ease-in-out infinite}
    @keyframes tsFly{0%{transform:translate(0,0) rotate(-4deg)}50%{transform:translate(62vw,-5vh) rotate(3deg)}100%{transform:translate(125vw,2vh) rotate(-4deg)}}
    .ts-inner{position:relative;z-index:1;width:min(460px,100%);text-align:center}
    .ts-logo{margin-bottom:22px}
    .ts-eyebrow{display:block;font-size:12px;font-weight:500;letter-spacing:.3em;color:#4e8fb3;margin-bottom:6px}
    .ts-logo h1{margin:0;font-size:clamp(27px,8.2vw,40px);line-height:1.2;font-weight:800;color:#17384a;
      text-shadow:0 3px 0 #ffffffcc,0 6px 14px #4a90b52e;letter-spacing:.01em}
    .ts-logo h1 b{display:block;color:#1373a6}
    .ts-logo p{margin:10px 0 0;font-size:13px;font-weight:500;color:#4e7f98}
    .ts-menu{display:flex;flex-direction:column;gap:10px}
    .ts-btn{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;cursor:pointer;text-align:left;
      border:2.5px solid #ffffff;border-radius:16px;background:#ffffffe8;color:#17384a;
      box-shadow:0 4px 0 #a9d4ea,0 10px 22px #5a9dc128;transition:transform .1s,box-shadow .1s,background .12s}
    /* 背景は .primary を上書きしないよう、白いボタンだけに限定する
       （以前は青いボタンまで白くなり、白文字が消えていた） */
    .ts-btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 0 #a9d4ea,0 14px 26px #5a9dc133}
    .ts-btn:not(.primary):hover:not(:disabled){background:#fff;border-color:#bfe0f0}
    .ts-btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 #a9d4ea}
    .ts-btn.primary{background:linear-gradient(180deg,#36b6f0,#1a93d6);border-color:#8fd9ff;color:#fff;box-shadow:0 4px 0 #0f6fa5,0 10px 24px #1a93d64d}
    .ts-btn.primary:hover{background:linear-gradient(180deg,#48c0f6,#1e9de2);box-shadow:0 6px 0 #0f6fa5,0 14px 28px #1a93d659}
    .ts-btn.primary:active{box-shadow:0 2px 0 #0f6fa5}
    .ts-btn:disabled{opacity:.52;cursor:not-allowed;box-shadow:0 3px 0 #c3dceb}
    .ts-ic{font-size:24px;line-height:1;flex:0 0 auto}
    .ts-tx{flex:1;min-width:0}
    .ts-tx b{display:block;font-size:16px;font-weight:800}
    .ts-tx small{display:block;font-size:12px;font-weight:500;color:#405964;margin-top:3px;line-height:1.4}
    .ts-btn.primary .ts-tx small{color:#dbf2ff}
    .ts-go{font-size:13px;color:#8fb6c9;flex:0 0 auto}
    .ts-btn.primary .ts-go{color:#eaf8ff}
    .ts-config{margin-top:12px;padding:14px;text-align:left;border:2.5px solid #fff;border-radius:16px;
      background:#ffffffe8;box-shadow:0 4px 0 #a9d4ea,0 10px 22px #5a9dc128}
    .ts-config .field{margin-top:0}
    .ts-config .field+.field{margin-top:14px}
    .ts-config label{color:#4e7f98 !important;font-size:12px}
    .ts-danger{margin-top:14px;padding-top:12px;border-top:1.5px dashed #cfe6f1}
    .ts-danger p{margin:0 0 7px;font-size:12px;color:#405964;line-height:1.5}
    .ts-danger button{width:auto;padding:8px 14px;border:2px solid #ffc0b0;border-radius:10px;background:#fff5f2;
      color:#c0392b;font-weight:500;font-size:12px;cursor:pointer}
    .ts-danger button:disabled{opacity:.45;cursor:not-allowed}
    .ts-foot{margin:18px 0 0;font-size:12px;color:#405964;line-height:1.6}
    .toast{z-index:70 !important}   /* タイトル画面の上にも出す */
    @media(max-height:620px){.ts-logo{margin-bottom:14px}.ts-logo p{margin-top:6px}.ts-foot{display:none}}
    /* ── 2026-10-21：指で押せる大きさに ──
       路線カードの操作列は7つとも高さ27px・すきま0pxで並んでいた（指の目安は44px）。

    .mini-btn{min-height:36px}

    .route-ops .rt-del{margin-left:auto}

    @media(max-width:760px){

      .sg-close,.shop-close,.pa-btn,.dev-btn,.fin-btn,.al-btn,.sort-sel,

      .route-ops{gap:8px}
    }
    /* キーボードで辿ったとき、いまどこにいるかが見えるように。
       スタイルシート全体で :focus の指定は文字入力欄の2つしか無かった */
    :focus-visible{outline:3px solid #1273a2;outline-offset:2px;border-radius:8px}
    .md-item:focus-visible,.apb:focus-visible,.apg:focus-visible,
    .sc-col:focus-visible{outline-offset:1px}
    /* タブの帯は地図の下端に貼ってあるので、下へ送ると消えてしまう。
       消えそうになったら画面の下へ貼り直す（位置と幅は地図の列に合わせる） */
    .map-actions.pinned{position:fixed !important;bottom:0;top:auto;z-index:40;
      box-shadow:0 -6px 18px #0b355014;border-radius:14px 14px 0 0}
    .pin-week{position:fixed;right:12px;bottom:68px;z-index:41;border:0;border-radius:999px;
      padding:13px 20px;min-height:48px;font-family:inherit;font-size:13px;font-weight:700;
      color:#05202b;background:linear-gradient(180deg,#7fe0a8,#2fb06a);
      box-shadow:0 6px 16px #1d7a4e40;cursor:pointer}
    .pin-week[hidden]{display:none}
    /* 文章の途中の <b> は、何も指定がなければブラウザ既定の 700 で出る。
       説明文はほぼ 12px なので、ここがいちばん潰れて見える場所だった
       （「この機体で毎日1往復したとき」「機内サービス・装備」など）。
       クラス付きの規則のほうが詳細度が高いので、数字の 700 は下で生き残る。 */
    b,strong{font-weight:500}
    /* ── 2026-10-20：12pxの漢字に 700/800 を当てると潰れる ──
       400/500/700/800 を並べて実測した。「離」「機」「鹿」のような画数の多い字は、
       12px では 700 で既に線がくっつき、800 はほぼ黒い塊になる。
       読める太さは 500 まで（この字体は 400/500/700/800 の4本しか無く、
       600 や 650 と書いても 700 に丸められるので、中間は存在しない）。
       そこで「言葉は 500、数字は 700」に分けた。
       数字は画数が無いので 700 でも潰れず、太さを残すと値と見出しの差が保てる。
       ここは字が潰れる話の最後に置いた打ち消しなので、既存の規則より後ろにある必要がある。 */
    .rl-grid>div b,.rl-total>div b,.pl-cell b,.co-summary b,.airport-fact b,
    .report-total b,.fin-grid b,.rl-net,.rl-year b,.fd-gain,.mi-right,.mi-net,

    .bs-row.worth span,.ra-row b,.pl-val i,.pl-cell.net b,.tp-row b,
    .sg-row>em,.sat-row>em,.rank-val,.fc-val,.df-axes i b,
    .shop-price,.shop-win .shop-price{font-weight:700}
    /* 言葉が入るものは、数字に見えても 500 のまま
       （.dp-tag「競合なし」／.rl-swing b「読みにくい」／.tt-na「未配属」／.pc-note b） */
    /* 大きい字（14px以上）は 800 のままで潰れない。ここで巻き込まないよう明示的に戻す */
    .apd-kpis b,.fl-total b,.ts-tx b,.mr-head b,.df-cash,.fl-sum b{font-weight:800}
  </style>
</head>

    /* 2本作れたら、空いている曜日を「いま飛んでいる路線の増便」に回す。
       1機が週7日はたらく形にするのは前と同じだが、**行き先は増やさない**。
       理由は TUTORIAL.routes のところに測定値つきで書いた。
       プレイヤーが自分で組んだ曜日は絶対に壊さない——足すだけ。 */
    function tutFillRest(){
      if(state.tutorialFilled||!isTutorial())return;
      /* 案内を早々に閉じられた場合に備えて、拠点が無ければここで決める */
      if(!state.base){state.selectedBase=TUTORIAL.base;startGame();}
      const pl=state.planes[0];if(!pl)return;
      const mine=()=>state.routes.filter(r=>r.aircraftId===pl.id);
      let added=0;
      for(let guard=0;guard<7;guard++){
        const rs=mine();if(!rs.length)break;
        const used={};rs.forEach(r=>routeDays(r).forEach(d=>{used[d]=true;}));
        const free=[0,1,2,3,4,5,6].filter(d=>!used[d]);
        if(!free.length)break;
        /* 空いた1日は、いま便数のいちばん少ない路線へ回す（＝できるだけ均等に割る）。
           2026-10-21：最初は「稼ぐ路線へ」「伸びる路線へ」で選んでいたが、
           どちらも就航直後の数字で比べることになり、育つ前の強い路線が全部取る。
           実測（後半13週の平均・3回ずつ）では均等割りがいちばん良かった：
             対馬2/福江5 −347千　対馬3/福江4 **−100千**　対馬4/福江3 −828千
           「1機を曜日で分けて島を回す」という案内の趣旨とも、均等割りが合う。
           空き曜日なので、同じ機体のほかの路線とかぶることはない */
        /* まず便数の少ない路線へ（均等に）。同数なら、足して伸びるほうへ。
           同数のときを決めずに前から順に取ると 対馬4/福江3（−828千）になった。
           強いほうに1日多く乗るのが正しい（対馬3/福江4＝−100千）。 */
        let best=null;
        free.forEach(d=>rs.forEach(r=>{
          const cur=routeDays(r);if(cur.indexOf(d)>=0)return;
          const days=cur.concat([d]).sort((a,b)=>a-b),trips=tripsPerDay(r);
          const probe=Object.assign({},r,{days,trips,frequency:days.length*trips});
          if(scheduleIssues(probe,pl.type).length)return;
          if(!slotCheck(probe,probe.timeBand,probe.frequency,r.id).ok)return;
          let gain;try{gain=weeklyEstimate(probe,pl).net-weeklyEstimate(r,pl).net;}catch(e){return;}
          if(!best||cur.length<best.len||(cur.length===best.len&&gain>best.gain))
            best={r,days,trips,len:cur.length,gain};
        }));
        if(!best)break;
        best.r.days=best.days;best.r.frequency=best.days.length*best.trips;
        added++;
      }
      /* 曜日を7日とも使い切ったあと、残っている増便の手は「1日の往復」だけ。
         2026-10-25：ここを1往復のままで終わらせていたため、2本とも搭乗97%に張りつき、
         SPILL_LOAD(88%)を超え続けて他社の対抗便（rivalReact）が毎週積み上がっていた。
         「満席が続くなら増便か大型化」と組んだのに、教える側が
         **他社をいちばん呼ぶ形**に置いて1年を終わらせていた。
         見積もりは週+4,079千と言うのに、実際の1年は+6,319千——
         1週ぶんしか残らない。差は全部、対抗便に持っていかれていた。
         実測（52週、のべ98回と44回）：
           1往復のまま            クリア 66%・年平均 +6,319千
           gain>0の路線だけ2往復  **クリア 95%**・年平均 +37,729千（搭乗97%→81%）
         2本とも2往復にすると平均は+53,418千まで伸びるが下振れが戻る（最小−8,762千）。
         足して得になる路線だけに絞ると最小が+15,742千になり、
         はじめての1年としてはこちらが良い——日ぶんを足すときと同じ gain の見方。 */
      let bumped=0;
      mine().forEach(r=>{
        if(tripsPerDay(r)>1)return;
        const days=routeDays(r);
        const probe=Object.assign({},r,{days,trips:2,frequency:days.length*2});
        if(scheduleIssues(probe,pl.type).length)return;
        if(!slotCheck(probe,probe.timeBand,probe.frequency,r.id).ok)return;
        let gain;try{gain=weeklyEstimate(probe,pl).net-weeklyEstimate(r,pl).net;}catch(e){return;}
        if(gain<=0)return;
        r.trips=2;r.frequency=days.length*2;bumped++;
      });
      state.tutorialFilled=true;
      if(added||bumped)notice(
        (added?`空いていた ${added}日 を増便に回し、`:'')
        +(bumped?`満席が続きそうな ${bumped}本 を1日2往復にしました。`:'')
        +'1機が週7日はたらきます。');
      invalidateInf();saveGame();render();
    }

    /* 2026-10-16：吹き出しの「しまう」からは呼ばれなくなった（min にするだけ）。
       案内が終わるのは、手順を最後までやり切ったときだけ（renderTutorial の中）。

    function endTutorial(){

    function renderTutorial(){const host=byId('tutorial');if(!host)return;
      /* 案内は地図の中に置かれていたが、地図は自前の重なり文脈を作るので、
         買い物窓のような後から出るモーダルの下に潜ってしまう。body 直下へ出す。 */
      if(host.parentElement!==document.body)document.body.appendChild(host);
      document.querySelectorAll('.tut-glow').forEach(e=>e.classList.remove('tut-glow'));
      const steps=tutSteps_(),guided=isTutorial();
      /* やり終えたステップは自動で送る。全部終わったらチュートリアル自体をたたむ。
         「はじめての1年」は拠点を選ぶところから案内するので、base が無くても進行させる */
      if(!state.tutorial.done&&(state.base||guided)){
        while(state.tutorial.step<steps.length){
          const st=steps[state.tutorial.step];let ok=false;
          try{ok=st.done?st.done():false;}catch(e){ok=false;}

    function suggestDests(n){

         「空白を見つけて繋ぐ」のがプレイヤーの仕事なのに、1位を押せば正解だった。

         しかも下位は自信たっぷりに外していた。見積もりは matWeeks:0——
         需要が育つ前の一瞬——で出しているのに、maturityFactor は
         w=0で0.6、w=16で1.2、つまり**育つと需要が2倍**になる。
         鹿児島・SF340・毎日便で52週まわした実測（各3回の平均）：

           行き先  見積もり/週   1年の実績      見積り順→実績順
           福江     +3,566千    +73,681千       1 → 1
           伊丹       +198千    +66,598千       7 → **2**
           那覇     +1,066千    +59,875千       5 → 3
           対馬     +3,304千    +41,837千       2 → 4
           広島       +955千    **−14,453千**   6 → 8

         伊丹は初週60%・−712千で、第52週に97%・+4,293千まで育つ。
         逆に福江は初週から97%——そこが天井で、あとは対抗便を呼ぶだけ
         （SPILL_LOAD=88 を超え続けるため。第4週で対抗2便）。
         「いま満席」を上位に出す並べ方は、育つ路線を構造的に見落とす。

         そこで**性格の違う3枚**にした。順位は付けない。
         育ったあとの数字（matWeeks:MAT_MAX_WEEKS）も併記するが、
         これも長距離では外す（仙台は mat16 で +1,006千/週なのに実績 −133,489千）
         ので、並べ替えの鍵には使わない。情報として出すだけ。 */
      const probeOf=(d,mat)=>({from:base,stops:[d],park:base,frequency:7,fare:'普通',
        timeBand:'morning',season:'all',matWeeks:mat});
      const all=[];
      Object.keys(airports).forEach(d=>{
        if(d===base||used.has(d)||!geo[d])return;
        const km=distanceKm(base,d);
        if(km>m.range||parseRunway(d)<need)return;
        const w0=weeklyEstimate(probeOf(d,0),plane);
        const w16=weeklyEstimate(probeOf(d,MAT_MAX_WEEKS),plane);
        const rivalFreq=routeCompetitors(base,d).reduce((s,c)=>s+(c.frequency||0),0);
        all.push({d,km,net:w0.net,load:Math.round(w0.perDay.load||0),
          net16:w16.net,load16:Math.round(w16.perDay.load||0),rivalFreq,

      });
      /* 航続ぎりぎりの行き先は候補から外す。小型機で限界まで飛ばすと

      const pool=all.filter(x=>x.km<=m.range*0.55);

        /* いますぐ満席：競合0で、初週から席が埋まる。実測では福江+73,681千・

        {k:'isle',ic:'🏝',label:'いますぐ満席',note:'満席は他社を呼びます',
         pick:a=>a.filter(x=>x.rivalFreq===0&&x.load>=88&&x.net>0).sort((p,q)=>q.net-p.net)[0]},
        /* あとで育つ：まだ席が空いていて（load<88）、**育ちしろのある大きい市場**。
           ここは条件を2つまちがえた。
           (1) 伸び幅の大きさで並べると中部（いま−2,079千→育つと+910千）が勝つ。
               育つ前の出血で終わるので、育ったあとの高さ（net16）で選ぶ。
           (2) net16 だけで並べると壱岐（すでに搭乗94%）が勝ってしまい、
               「あとで育つ」枠に満席の島が入る。load<88 で満席組を外す。
           さらに市場の大きさで絞らないと広島（実績 −14,453千）が入る。

        {k:'grow',ic:'🏙',label:'あとで育つ',note:'はじめは苦しい',
         pick:a=>a.filter(x=>x.net16>0&&x.net>-600000&&x.load<88
                  &&effectivePopulation(base)+effectivePopulation(x.d)>=3.0)
                  .sort((p,q)=>q.net16-p.net16)[0]},
        /* 小さくて静か：「他社を呼びにくい」と書くのだから、**他社が来ない大きさ**で選ぶ。
           rivalOpenRoute の参入下限は両端人口の合計で、いちばん小さい社でも2.2。
           effectivePopulation は実人口ではなく割引後の値（鹿児島は p=1.58 でも eff=0.91）。
           これで同じ「本土・競合0」のなかで
             広島 0.91+1.65=2.56 → 小さい社が入れる（実測 −14,453千。
                                   第12週に対抗便が来て搭乗51%まで崩れた）
             高知 0.91+0.33=1.24 → 誰も来ない（実測 +20,615千）
           が分かれる。搭乗率だけで「余裕がある」と見ると広島を勧めてしまう。
           島を外すのは、1枚目（いますぐ満席）と性格が重なるため。 */
        {k:'easy',ic:'🛬',label:'小さくて静か',note:'他社が来ない大きさ',
         pick:a=>a.filter(x=>x.net16>0&&isleBoost(base,x.d)===1
                  &&effectivePopulation(base)+effectivePopulation(x.d)<2.2)

      const out=[],taken=new Set();
      const add=(x,kd)=>{taken.add(x.d);out.push(Object.assign({},x,

      KINDS.forEach(kd=>{const x=kd.pick(src.filter(y=>!taken.has(y.d)));if(x)add(x,kd);});

      src.slice().sort((p,q)=>q.net16-p.net16).forEach(x=>{
        if(out.length>=(n||3)||taken.has(x.d))return;
        add(x,{k:'other',ic:'✈',label:'そのほか',note:''});
      });
      /* 2026-10-16：案内中は、カンセが名指しした行き先を必ず一覧の先頭に入れる。
         名指しの行き先が性格の3枚から漏れると、「おすすめの中で光っているボタンを
         押して」と言われてもそのボタンが存在しない、という事故が起きる（実測で確認）。 */
      const tgt=(typeof tutDestTarget==='function')?tutDestTarget():null;
      if(tgt){
        const i=out.findIndex(x=>x.d===tgt);
        const t=i>=0?out.splice(i,1)[0]:all.find(x=>x.d===tgt);

        if(t)out.unshift(Object.assign({},t,

      const top=out.slice(0,n||3);
      /* 2026-10-21：見積もりは「いま遊んでいる機体」で出している。
         そのため本土の路線は「搭乗率100%なのに赤字」と出て、
         行き先が無いように見えていた。足りないのは行き先ではなく機体の大きさ。
         買える範囲でいちばん良い機種も一緒に調べて、カードに添える。

      top.forEach(x=>{

          const e=estimateWithType(probe,t);if(!e)return;
          if(!best||e.net>best.net)best={type:t,name:mm.name,cost:mm.cost,net:e.net,load:e.perDay.load};
        });
        if(best&&best.net>x.net+200000)x.best=best;      /* 意味のある差があるときだけ */
      });
      return top;
    }

    // ── ⑤ 季節予報：この先8週の需要と、3週ぶんの空模様 ──
    /* 自社が飛ばしている路線の平均。まだ無ければ全国平均（出張5：観光5）を出す */
    function demandIndexAt(week){
      const rs=state.routes.filter(r=>r.aircraftId);
      if(!rs.length){const s=seasonOf(week);return (s.biz+s.leisure)/2;}
      let sum=0,n=0;
      rs.forEach(r=>{if(!routeActive(r,week))return;routeLegs(r).forEach(([f,t])=>{sum+=seasonMult(f,t,week);n++;});});
      if(!n){const s=seasonOf(week);return (s.biz+s.leisure)/2;}

    function planeWeeklyOutlook(p){

      const night=nightCost(p,planePark(p))*7,lease=p.leased?p.leaseFee:0;

      /* 下の帯：いま何が変わろうとしていて、合計いくらか。払うのはここだけ */
      const ch=fleetDraftChanges(p,d),cost=fleetDraftCost(p,d),poor=state.cash<cost;
      /* 2026-10-26：帯の高さを先に確保する。
         押すたびに行が増えて窓の縁が伸びていくと、見比べているあいだ落ち着かない
         （1行→5行で窓が 633→725px 動いていた）。
         この機体で**ありえる最大の行数**＝座席＋サービス＋まだ付いていない装備。
         足りないぶんは空の行を敷いておく。行数で確保しているので、
         文字の大きさが変わっても勘定が狂わない。
         1行が折り返すと台無しになるので、行はどれも1行に収める
         （長い名前は途中で切るが、金額は右端に必ず残す）。 */
      const slots=2+Object.keys(CABIN_EQUIP).filter(k=>!equipItemsOf(p).includes(k)).length;
      const rows=ch.map(c=>`<span class="fw-ci"><span class="fw-cl">${c.label}</span>${c.fee?`<i>${yen(c.fee)}</i>`:'<i class="free">費用なし</i>'}</span>`);
      if(!rows.length)rows.push('<span class="fw-ci fw-none"><span class="fw-cl">まだ何も変えていません</span></span>');
      while(rows.length<slots)rows.push('<span class="fw-ci ph"><span class="fw-cl">&nbsp;</span></span>');
      /* 合計は必ず自分の行に置く。ボタンと横並びにすると、
         金額が伸びた拍子に折り返して帯の高さが動く（375pxで 46→98px） */
      const bar=`<div class="fw-bar">
        <div class="fw-chg">${rows.join('')}</div>
        <div class="fw-sum ${ch.length?(poor?'ng':(cost?'pay':'free')):'none'}">${ch.length?(cost?`合計 ${yen(cost)}${poor?`（あと ${yen(cost-state.cash)} 不足）`:''}`:'費用なし'):`合計 ${yen(0)}`}</div>
        <div class="fw-act">
          <button type="button" class="btn secondary" id="fleetCancel">${ch.length?'変更をやめる':'✕ とじる'}</button>
          <button type="button" class="btn" id="fleetCommit" ${ch.length&&!poor?'':'disabled'}>✔ この内容で決定</button>
        </div></div>`;
      const html=`<div class="shop-modal" id="fleetModal"><div class="shop-win fw-win">
        <div class="shop-head"><b>⚙ ${p.id} の設定</b>
          <span class="shop-cash">所持金 ${yen(Math.round(state.cash))}</span>
          <button class="shop-close" id="closeFleetSetup">✕ とじる</button></div>
        <div class="fw-sub">${m.name}｜${m.maker}｜実${cfg.effSeats}席・品質${cfg.quality}｜${held.length?`${held.length}便を担当`:'待機中'}</div>
        <div class="shop-body">${planeSettingHtml(p)}</div>
        ${bar}</div></div>`;
      paintModal('fleetModal',html,()=>{
        byId('closeFleetSetup').addEventListener('click',()=>closeFleetSetup());
        byId('fleetCancel').addEventListener('click',()=>closeFleetSetup());
        byId('fleetCommit').addEventListener('click',commitFleetSetup);
        bindPlaneSetting();
      },()=>{
        byId('fleetModal').addEventListener('click',e=>{if(e.target.id==='fleetModal')closeFleetSetup();});
      });
    }
    /* 座席・サービス・装備のボタン。窓の中だけに付ける。
       2026-10-26：ここでは**下書きだけ**を動かす。支払いは〔決定〕のみ。 */
    function bindPlaneSetting(){
      document.querySelectorAll('#fleetModal .seg-btn[data-cfg]').forEach(b=>b.addEventListener('click',()=>{
        const p=state.planes.find(x=>x.id===b.dataset.plane),d=state.fleetDraft;
        if(!p||!d)return;
        const v=b.dataset.v,k=b.dataset.cfg;
        if(k==='density')d.density=v;
        else if(k==='equip'){
          /* すでに付いている装備は外せない（取り外しは扱っていない）。
             下書きで足したものだけ、もう一度押して取り消せる。 */
          if(equipItemsOf(p).includes(v))return notice(`${CABIN_EQUIP[v].label} はすでに付いています。`);
          d.equip=d.equip.includes(v)?d.equip.filter(x=>x!==v):d.equip.concat(v);
        }
        else if(k==='svc')d.svcItems=d.svcItems.includes(v)?d.svcItems.filter(x=>x!==v):d.svcItems.concat(v);
        /* 下書きを動かしただけなので、窓の外は何も変わらない。
           render() を呼ぶと地図も欄も全部描き直すことになる——窓だけ描き直す */
        sfx.tap();renderFleetModal();}));
    }
    /* 2026-10-26：窓の中は下書き（state.fleetDraft）を映す。
       「いま」＝機体に入っている値、「選択中」＝下書きの値。
       金額は下書きではなく**機体の現在値からの差**で出す（押しても減らない）。 */
    function planeSettingHtml(p){
      const d=state.fleetDraft||fleetDraftOf(p);
      const model=aircraftCatalog[p.type],held=planeRoutes(p);
      const nowCfg=cabinConfig(p),draftCfg=cabinConfig(Object.assign({},p,{density:d.density}));
      return `<div class="plane-card plain"><div class="pc-head"><span class="pc-plane">✈</span><b>${p.id}</b>　${model.name}${held.length>1?`<span class="pc-multi">${held.length}便を掛け持ち</span>`:''}</div><div class="pc-spec">${model.maker}｜${sizeClassLabel[model.sizeClass]}｜実${draftCfg.effSeats}席・品質${draftCfg.quality}${draftCfg.effSeats!==nowCfg.effSeats?`<i class="pc-willbe">（いまは${nowCfg.effSeats}席）</i>`:''}</div>`
        /* 就航状況は上の「保有機材の一覧」が受け持つので、ここでは繰り返さない */
        +`<div class="field"><label>座席配置${(function(){const mx=maxSeatsOf(p.type);return cabinConfig({...p,density:'high'}).effSeats>=mx?`<span class="cap-note">上限 ${mx}席</span>`:'';})()}</label><div class="seg">${Object.entries(densityPresets).map(([k,dp])=>{const n=cabinConfig({...p,density:k}).effSeats,capped=n>=maxSeatsOf(p.type);
          const isNow=(p.density||'std')===k,sel=d.density===k,fee=densityCost(p,k);
          return `<button type="button" class="seg-btn${sel?' on':''}" data-cfg="density" data-plane="${p.id}" data-v="${k}">${dp.label}<small>${n}席${capped&&k!=='comfort'?'・満杯':''}${isNow?'<i class="cfg-now">いま</i>':`<i class="cfg-fee">${yen(fee)}</i>`}</small></button>`;}).join('')}</div>
        <p class="svc-note">🔧 座席を外して付け直す作業です。<b>動かす席数</b>に応じて費用がかかり、装備とちがって<b>資産には残りません</b>（その週の費用になります）。</p></div>${(()=>{const b=planeBlockMin(p),on=d.svcItems,eq=equipItemsOf(p),r=activeRouteOf(p);
        const bl=r?`この機体の最短区間は <b>${durLabel(b)}</b>`:'<b>路線に配属すると</b>、配れるものが決まります';
        return `<div class="field"><label>機内サービス<span class="cap-note">旅客1人ごと・費用なしで変えられます</span></label>
        <div class="seg svc-seg">${Object.entries(SERVICE_ITEMS).map(([k,s])=>{
          const sel=on.includes(k),able=b>=s.minBlock;
          return `<button type="button" class="seg-btn${sel?' on':''}${sel&&!able?' undeliv':''}" data-cfg="svc" data-plane="${p.id}" data-v="${k}" title="${s.note}">${s.ic}${s.label}<small>${!able?`${s.minBlock}分以上`:`${yen(s.perPax)}/人<i>満足+${s.sat}</i>`}</small></button>`;}).join('')}</div>
        <p class="svc-note">🕐 ${bl}。<b>配れない品目は課金も加点もされません</b>（選んでいても飛ばされます）。</p>
        <label style="margin-top:8px;display:block">機内装備<span class="cap-note">機体への投資・取り外しはできません</span></label>
        <div class="seg svc-seg">${Object.entries(CABIN_EQUIP).map(([k,e])=>{
          const has=eq.includes(k),pend=!has&&d.equip.includes(k),c=equipCost(p.type,k),weak=b<e.fullBlock;
          /* 2026-10-26：選んだ印に「つける」の字を足していたが、
             そのぶんボタンが1行伸びて窓の高さが動いていた。
             選んであることは枠（on）と下の帯の行で分かるので、字は足さない。 */
          return `<button type="button" class="seg-btn${has||pend?' on':''}" data-cfg="equip" data-plane="${p.id}" data-v="${k}" ${has?'disabled':''} title="${e.note}">${e.ic}${e.label}<small>${has?(weak?`効果半減（${e.fullBlock}分未満）`:`満足+${e.sat}`):yen(c)}</small></button>`;}).join('')}</div>
        ${eq.length?`<p class="svc-note">🔧 買い切りです。以後の支払いはなく、<b>資産として貸借対照表に載り</b>、機体と同じ率で償却していきます。</p>`:''}
        </div>`;})()}
        </div>`;
    }
    // 買い物はメイン画面いっぱいのウィンドウで。右の細い列に長く並べない。
    function openShop(){state.shopOpen=true;sfx.pop();render();if(!state.planes.length)setTimeout(()=>radio('shopOpen'),500);}
    function closeShop(){state.shopOpen=false;sfx.tap();render();}
    function renderShop(){
      const old=byId('shopModal');
      if(!state.shopOpen){if(old)old.remove();return;}
      const html=`<div class="shop-modal" id="shopModal"><div class="shop-win">
        <div class="shop-head"><b>🛒 お買い物</b><span class="shop-cash">所持金 ${yen(Math.round(state.cash))}</span><button class="shop-close" id="closeShop">✕ とじる</button></div>
        <div class="shop-tabs">${[['air','✈ 飛行機'],['equip','🛠 機材'],['facility','🏢 施設']].map(([k,l])=>`<button class="shop-tab ${state.shopTab===k?'active':''}" data-shop="${k}">${l}</button>`).join('')}</div>
        <div class="shop-body${tutPlaneTarget()?' tut-focus':''}">${shopHtml()}</div></div></div>`;
      const painted=paintModal('shopModal',html,()=>bindShop(),()=>{
        byId('shopModal').addEventListener('click',e=>{if(e.target.id==='shopModal')closeShop();});
      });
      if(!painted)return;   /* 中身が同じなら、貼り直しも案内の貼り替えも要らない */
      const body=byId('shopModal').querySelector('.shop-body');
      if(body&&shopToTop)body.scrollTop=0;   /* 並べ替えたら先頭へ（買い物だけなら paintModal が位置を守る） */
      shopToTop=false;
      /* 案内は render() の中で先に走るので、この時点ではショップがまだ無い。
         買い物窓が出来てから、もう一度だけ案内を貼り直す（ここで初めて「おすすめの機体」を指せる）。 */
      if(typeof renderTutorial==='function')renderTutorial();
    }
    function bindShop(){
      byId('closeShop').addEventListener('click',closeShop);
      document.querySelectorAll('#shopModal .shop-tab').forEach(b=>b.addEventListener('click',()=>{state.shopTab=b.dataset.shop;sfx.tap();render();}));
      /* 案内の最中は、指していない買い方を押せても断る（理由を出す）。
         押せなくしてしまうと、なぜ駄目なのかが伝わらないので、押せるままにしてある */
      document.querySelectorAll('#shopModal .buy-plane').forEach(b=>b.addEventListener('click',()=>{
        const w=tutBlockBuy(b.dataset.id,'cash');if(w)return notice(w);buyPlaneById(b.dataset.id);}));
      document.querySelectorAll('#shopModal .buy-loan').forEach(b=>b.addEventListener('click',()=>{
        const w=tutBlockBuy(b.dataset.id,'loan');if(w)return notice(w);financePlaneById(b.dataset.id);}));
      document.querySelectorAll('#shopModal .buy-lease').forEach(b=>b.addEventListener('click',()=>{
        const w=tutBlockBuy(b.dataset.id,'lease');if(w)return notice(w);leasePlaneById(b.dataset.id);}));
      document.querySelectorAll('#shopModal .buy-item').forEach(b=>b.addEventListener('click',()=>buyUpgrade(b.dataset.kind,b.dataset.id)));
      {const ss=byId('shopSortSel');if(ss)ss.addEventListener('change',()=>setShopSort(ss.value));}
      /* 2026-10-21：「くわしく」の折りたたみは廃止した。
         性能バーはパネルの中に入れ、解説と相場は下の1ブロックに常時出している。
         開くたびに下の機体が流れていく問題ごと無くなった。 */
    }
    let shopToTop=false;
    /* ── 2026-10-25：保有機をえらぶ窓 ──
       「折りたたみ式ではなく、保有飛行機のウインドウが表示されて、その中から選ぶ」
       「現在就航や能力値、推定利益なども表示」というプレイヤーの指示。
       右の欄は333pxしかなく、1機につき就航状況・性能・見込みを並べると
       どれも読めなくなる。買い物窓と同じ作り（.shop-modal/.shop-win）を使って、
       1機ぶんを横長に広げた。開いているかどうかは draft.pick==='plane' で持つ
       （出発空港・到着空港の空きマスと同じ仕掛けを使い回す）。 */
    function closePlanePicker(){if(state.draft)state.draft.pick=null;sfx.tap();render();}
    function renderPlanePicker(){
      const old=byId('planeModal');
      const open=!!(state.draftOpen&&state.draft&&state.draft.pick==='plane'&&state.draft.stops.length);
      if(!open){if(old)old.remove();return;}
      const d=state.draft,park=d.park||state.base;
      const here=state.planes.filter(p=>planePark(p)===park);
      const away=state.planes.length-here.length;
      if(!here.length){if(old)old.remove();return;}
      /* 右の欄の見積もりと同じ下書き路線を組む（7224行と同じ作り） */
      const draftRoute={from:park,stops:d.stops,park,frequency:d.frequency,fare:d.fare,timeBand:d.timeBand,
        season:d.season||'all',days:routeDays(d),trips:Math.max(1,Math.min(2,d.trips||1)),oneWay:!!d.oneWay};
      const pvWeek=previewWeek(draftRoute);   /* 季節便は「次に飛ぶ週」で見積もる */
      const all=Object.values(aircraftCatalog);
      const mx={seats:Math.max(...all.map(m=>m.seats)),range:Math.max(...all.map(m=>m.range)),
                rw:Math.max(...all.map(m=>m.runwayReq)),
                speed:Math.max(...Object.keys(aircraftCatalog).map(cruiseOf))};
      const cards=here.map(p=>{
        const m=aircraftCatalog[p.type],cfg=cabinConfig(p),suit=planeSuitsDraft(p);
        const held=planeRoutes(p),clash=held.filter(r=>routesClash(r,draftRoute));
        const wk=suit.ok?atWeek(pvWeek,()=>weeklyEstimate({...draftRoute,from:state.base},p)):null;
        const on=d.planeId===p.id;
        /* ── 2026-10-25：カードを292px → 150px前後に詰めた ──
           箱3つを縦に積む作りだと、いちばん背の高い箱（見込み5行）に
           ほかの2つが引きずられ、「いまの仕事」の下に空きができていた。
           ・〔この機体にする〕は見出しの行へ（1行まるごと節約）
           ・能力は2列2行 → 4列1行
           ・見込みは5行の表 → 1行の並び
           ・いまの仕事は箇条書き → 1行 */
        const jobs=held.length
          ? held.map(r=>`<span class="pw-job${clash.indexOf(r)>=0?' clash':''}">${daysLabel(r)}　${routeName(r)}${clash.indexOf(r)>=0?'<em>→ この便から外れます</em>':''}</span>`).join('')
          : '<span class="pw-job free">仕事なし（遊休機）</span>';
        return `<div class="pw-card${on?' on':''}${suit.ok?'':' bad'}">
          <div class="pw-top">
            <div class="pw-art">${planeArt(p.type,m)}</div>
            <div class="pw-id"><b>${p.id}　${m.name}</b>
              <span>${cfg.effSeats}席・品質${cfg.quality}・${m.maker}</span></div>
            <div class="pw-net ${wk?(wk.net>=0?'ok':'loss'):'ng'}">
              ${wk?`<b>${wk.net>=0?'+':''}${yen(Math.round(wk.net))}</b><small>週の見込み</small>`
                  :`<b>✕</b><small>${suit.reason}</small>`}</div>
            <button class="btn pw-use" data-plane="${p.id}" ${suit.ok?'':'disabled'}>${on?'✔ 選択中':'この機体にする'}</button>
          </div>
          <div class="specbars sb-4col">
            ${specBar('座席',cfg.effSeats,mx.seats,'席',false)}
            ${specBar('巡航',cruiseOf(p.type),mx.speed,'km/h',false)}
            ${specBar('航続',m.range,mx.range,'km',false)}
            ${specBar('滑走路',m.runwayReq,mx.rw,'m',true,!suit.ok)}
          </div>
          <div class="pw-lines">
            <div class="pw-jobs">🕐 ${jobs}</div>
            ${wk?`<div class="pw-pl">搭乗<b class="${wk.perDay.load>=90?'hot':''}">${wk.perDay.load}%</b><i>/</i><b>${Math.round(wk.passengers).toLocaleString()}人</b><i>/</i>売上<b>${yen(Math.round(wk.revenue))}</b><i>/</i>費用<b class="neg">−${yen(Math.round(wk.revenue-wk.net))}</b></div>`
                :''/* 使えない理由は見出しの ✕ の横に出ているので、ここで繰り返さない */}
          </div>
        </div>`;}).join('');
      const where=`${park} → ${d.stops.join(' → ')}${isOneWay(d)?'（片道）':` → ${park}`}`;
      const html=`<div class="shop-modal" id="planeModal"><div class="shop-win pw-win">
        <div class="shop-head"><b>✈ 使う飛行機をえらぶ</b>
          <span class="pw-where">${where}<small>${slotDef(d.timeBand).name} ${hhmm(slotDef(d.timeBand).dep)}発・${dowLetters(d)} 週${d.frequency}便</small></span>
          <button class="shop-close" id="closePlanePick">✕ とじる</button></div>
        <div class="shop-body pw-body">
          <p class="pw-note">✈ <b>${park}</b> に泊まっている <b>${here.length}機</b> から選びます。${away?`ほかに ${away}機 ありますが、${park} にいないので飛ばせません。`:''}<br>
            <small>金額は、この行き先・時間帯・曜日でその機体を飛ばしたときの見込みです。</small></p>
          ${cards}</div></div></div>`;
      const painted=paintModal('planeModal',html,()=>{
        byId('closePlanePick').addEventListener('click',closePlanePicker);
        document.querySelectorAll('#planeModal .pw-use').forEach(b=>b.addEventListener('click',()=>{
          state.draft.planeId=b.dataset.plane;state.draft.pick=null;sfx.tap();render();}));
      },()=>{
        byId('planeModal').addEventListener('click',e=>{if(e.target.id==='planeModal')closePlanePicker();});
      });
      if(painted&&typeof renderTutorial==='function')renderTutorial();
    }
    // 機体比較の横棒。invert=true は「小さいほど有利」な項目（費用・制約）
    /* warn：この値が自社の条件に合わない（降りられない滑走路など）ときに赤く出す */
    function specBar(label,value,max,unit,invert,warn){
      const pct=Math.max(4,Math.min(100,Math.round(value/max*100)));
      return `<div class="sb${warn?' sb-warn':''}"><span class="sb-l">${label}</span><span class="sb-t"><i class="${invert?'bad':'good'}" style="width:${pct}%"></i></span><span class="sb-v">${value.toLocaleString()}${unit}</span></div>`;
    }
    // 並べ替え：どれも「上にくるほど良い」向きを既定にし、もう一度押すと逆順になる
    const shopSorts=[
      {k:'class',ic:'🗂',label:'分類',  note:'大きさ順',rev:'大きさ順',get:null},
      {k:'cost', ic:'💴',label:'値段',  note:'安い順',  rev:'高い順',  get:m=>m.cost,      dir:1},
      {k:'seats',ic:'💺',label:'座席',  note:'多い順',  rev:'少ない順',get:m=>m.seats,     dir:-1},
      {k:'rw',   ic:'🛬',label:'滑走路',note:'短い順',  rev:'長い順',  get:m=>m.runwayReq, dir:1},
      {k:'speed',ic:'💨',label:'速さ',  note:'速い順',  rev:'遅い順',  get:null,           dir:-1},
      {k:'range',ic:'🧭',label:'航続',  note:'長い順',  rev:'短い順',  get:m=>m.range,     dir:-1},
      {k:'fuel', ic:'⛽',label:'燃費',  note:'良い順',  rev:'悪い順',  get:m=>m.fuelPerKm, dir:1}
    ];
    function shopSortDef(){return shopSorts.find(s=>s.k===(state.shopSort||'class'))||shopSorts[0];}
    /* 選択式の値は "key" か "key:rev"。向きまで選択肢の字に出ているので、
       押すたびに反転する覚えものは要らない（2026-10-21） */
    function setShopSort(v){
      const p=String(v).split(':');
      state.shopSort=p[0];state.shopRev=p[1]==='rev';
      shopToTop=true;sfx.tap();render();
    }
    function sortedAircraft(){
      const s=shopSortDef();
      let list=Object.entries(aircraftCatalog);
      if(s.k==='class')return list;                            /* 分類順はカタログの並び（＝小さい順）のまま */
      const d=s.dir*(state.shopRev?-1:1);
      const val=s.get?(e=>s.get(e[1])):(e=>cruiseOf(e[0]));    /* 速さだけは型式キーから引く */
      return list.sort((a,b)=>(val(a)-val(b))*d);
    }
    /* 2026-10-16：機体の「写真」。
       実写は権利の都合で1枚のHTMLに入れられないので、カタログが持っている
       全長(lengthM)・全幅(wingspanM)・クラスからシルエットを描き起こす。
       同じ絵の使い回しではなく、BN-2は細く短く、B777は太く広い、と機体ごとに形が変わる。
       プロペラ機は直線翼＋プロペラ円盤、ジェットは後退翼＋ナセルで描き分ける。 */
    const PLANE_ART_MAX=(function(){const v=Object.values(aircraftCatalog);
      return {len:Math.max.apply(null,v.map(function(m){return m.lengthM||20;})),
              span:Math.max.apply(null,v.map(function(m){return m.wingspanM||20;}))};})();
    function planeArt(id,m){
      const M=PLANE_ART_MAX,prop=(m.sizeClass==='commuter'||m.sizeClass==='prop');
      /* 実寸をそのまま縮尺に使う。小さい機体が豆粒にならないよう、べき乗で持ち上げる */
      const L=30+62*Math.pow((m.lengthM||20)/M.len,0.7);      /* 全長 30〜92 */
      const S=22+64*Math.pow((m.wingspanM||20)/M.span,0.7);   /* 全幅 22〜86 */
      const cy=32,x0=50-L/2,x1=50+L/2;
      /* 胴体の太さ。席数から出すと大型機が寸詰まりの塊になったので、全長との比で決める。
         実機は BN-2 も 777 も、全長：胴体幅がおよそ 9.5：1 でほぼ変わらない */
      const b=Math.max(1.9,L/19);
      const wr=x0+L*0.40,root=L*0.30,sweep=prop?L*0.03:L*0.17,tip=root*0.42;
      const wing=s=>`M${wr} ${cy-s*b} L${wr+sweep} ${cy-s*S/2} L${wr+sweep+tip} ${cy-s*S/2} L${wr+root} ${cy-s*b} Z`;
      const TS=S*0.38,tr=x1-L*0.16,troot=L*0.15,tsw=prop?L*0.01:L*0.07;
      const tail=s=>`M${tr} ${cy-s*b} L${tr+tsw} ${cy-s*TS/2} L${tr+tsw+troot*0.5} ${cy-s*TS/2} L${tr+troot} ${cy-s*b} Z`;
      const eng=[];
      /* ナセルは胴体の半幅と同じくらいの太さ（実機の比率もおよそそれ） */
      const ey=S*(prop?0.25:0.27),ew=L*(prop?0.17:0.16),eh=Math.max(2.2,b*(prop?0.95:1.05));
      const ex=wr+sweep*0.45-(prop?L*0.10:L*0.07);
      [1,-1].forEach(function(s){
        const ec=cy-s*ey;
        eng.push(`<rect x="${ex.toFixed(1)}" y="${(ec-eh/2).toFixed(1)}" width="${ew.toFixed(1)}" height="${eh.toFixed(1)}" rx="${(eh/2).toFixed(1)}" fill="#8fb3c6"/>`);
        if(prop)eng.push(`<ellipse cx="${(ex-0.8).toFixed(1)}" cy="${ec.toFixed(1)}" rx="1.5" ry="${(S*0.115).toFixed(1)}" fill="#6f98ad" opacity=".75"/>`);
      });
      return `<svg class="pa-svg" viewBox="0 0 100 64" role="img" aria-label="${m.name} のシルエット">
        <path d="${wing(1)}" fill="#b4d2e4"/><path d="${wing(-1)}" fill="#b4d2e4"/>
        <path d="${tail(1)}" fill="#c6dded"/><path d="${tail(-1)}" fill="#c6dded"/>
        ${eng.join('')}
        <rect x="${x0.toFixed(1)}" y="${(cy-b).toFixed(1)}" width="${L.toFixed(1)}" height="${(b*2).toFixed(1)}" rx="${b.toFixed(1)}" fill="#dfeef7" stroke="#8fb3c6" stroke-width="1.1"/>
        <rect x="${(x0+L*0.18).toFixed(1)}" y="${(cy-b*0.26).toFixed(1)}" width="${(L*0.70).toFixed(1)}" height="${(b*0.52).toFixed(1)}" rx="${(b*0.26).toFixed(1)}" fill="#71c7ea" opacity=".85"/>
        <circle cx="${(x0+L*0.085).toFixed(1)}" cy="${cy}" r="${Math.max(1,b*0.34).toFixed(1)}" fill="#5d8aa3"/>
      </svg>`;
    }

          +`全長${m.lengthM}m／全幅${m.wingspanM}m／${m.mtow}t</div>`
      +`</div>`
      /* 2026-10-21：横1行の並びになったので、注意書きは支払い欄のあとに置く。

      +(()=>{const down=Math.round(m.cost*DOWN_RATE),int=Math.round((m.cost-down)*loanRate());
        const roomAfter=Math.round((fleetValue()+m.cost)*0.70)+500000000-state.loan;
        const canLoan=state.cash>=down&&(m.cost-down)<=roomAfter;

        return `<div class="pay-cmp">

          <div class="pc-col lease${tutBlockBuy(id,'lease')?' tut-off':''}"><span class="pc-h">📄 リース</span><b>${yenBr(dep)}<i>＋週 ${yenBr(fee)}</i></b>

      /* 解説・使いどころ・実機の相場・寸法は、たたまずに1ブロックで下に敷く。

      +`<div class="pi-foot"><span class="pf-tip"><b>💡 使いどころ</b>${m.tip||''}</span></div>`

    /* ── 2026-10-21：買収の値段と条件 ──

    // 固定分を大きくしすぎると、1機1路線の開業直後が永久に赤字になって導入が壊れる。
    // 「小さく始めて成立し、広げるほど比率が下がる」水準に置く。

        ${gr?row('設備・施設（取得価額）',grC,'',true)+row('減価償却累計額',-(grC-gr),'minus',true)+row('設備・施設（簿価）',gr,'sub'):''}
        ${row('資産合計',assets,'total')}
        <div class="bs-head">負債</div>
        ${row('借入金',loan)}
        <div class="bs-head">純資産</div>
        ${row('資産 − 負債',worth,'worth')}
        <p class="bs-note">機体や設備を買っても<b>会社の価値は減りません</b>。現金が資産に変わるだけです。<br>
        減るのは<b>毎週の減価償却</b>（いま −${yen(totalDepreciation())}／週）と、<b>赤字</b>のぶん。<br>
        ${nLease?`リース機${nLease}機は借り物なので資産に入りません。`:''}空港の滑走路延長や商業施設は自社の持ち物にならないため、資産ではなく費用として扱っています。</p>
      </div>`;
    }
    function financeHtml(){const wk=state.loan?Math.round(state.loan*loanRate()):0,lease=state.planes.reduce((s,p)=>s+(p.leased?p.leaseFee:0),0);
      return `<div class="fin-box"><div class="money-line"><span class="ml-ic">🏦</span><div><b>あと ${yen(loanRoom())} まで借りられます</b><small>機体が増えると銀行がもっと貸してくれます</small></div></div>
      <div class="fin-grid"><div><span>借りている額</span><b>${yen(state.loan)}</b></div><div><span>毎週の利息</span><b class="loss">−${yen(wk)}</b></div>${lease?`<div><span>毎週のリース料</span><b class="loss">−${yen(Math.round(lease))}</b></div>`:''}
        <div><span>機体の資産価値</span><b>${yen(fleetValue())}</b></div><div><span>毎週の目減り</span><b class="loss">−${yen(state.planes.reduce((s,p)=>s+planeDepreciation(p),0))}</b></div>
        <div><span>資金＋資産</span><b>${yen(Math.round(state.cash)+fleetValue()-state.loan)}</b></div></div>
      <p style="font-size:12px;color:var(--muted);margin:6px 2px 0">機体は<b>持っているだけで値が下がります</b>（生産中の型で年${Math.round(DEPR_NEW*100)}%、生産終了なら年${Math.round(DEPR_OLD*100)}%）。借入枠はこの<b>資産価値の7割</b>なので、古い機体ばかりだと枠も痩せます。</p>
      <div class="fin-ops"><button class="mini-btn fin-btn" data-fin="borrow" ${loanRoom()<loanStep()?'disabled':''}>${yen(loanStep())} 借りる</button><button class="mini-btn fin-btn" data-fin="repay" ${state.loan<=0?'disabled':''}>${yen(Math.min(state.loan,loanStep()))} 返す</button></div>
      <p style="font-size:12px;color:var(--muted);margin:7px 2px 0">利息は毎週 <b>${(loanRate()*100).toFixed(2)}%</b>。機体を買う頭金が足りないときの<b>つなぎ</b>に使いましょう。資金がマイナスになると倒産です。</p></div>`;}
    /* ── 2026-10-27：お金の窓（🏦銀行・📈証券）──
       借入は「会社タブの右サイドバー」、買収は「地図の下の折りたたみ」と、
       お金の話が離れた2か所に分かれていて、どちらも見つけにくかった。
       どちらも**会社をどう大きくするか**という同じ種類の手なので、
       企画タブの入口から窓で開く形に揃える（買い物の窓と同じ作り）。 */
    function openFinWin(k){state.finWin=k;sfx.pop();render();}
    function closeFinWin(){state.finWin=null;sfx.tap();render();}
    function renderFinWin(){
      const old=byId('finModal');
      if(!state.finWin){if(old)old.remove();return;}
      const bank=state.finWin==='bank';
      const html=`<div class="shop-modal" id="finModal"><div class="shop-win fin-win">
        <div class="shop-head"><b>${bank?'🏦 銀行':'📈 証券'}</b><span class="shop-cash">所持金 ${yen(Math.round(state.cash))}</span><button class="shop-close" id="closeFinWin">✕ とじる</button></div>
        <div class="shop-body">${bank?financeHtml():stockHtml()}</div></div></div>`;
      /* 窓の根は作り直さない（作り直すと、押すたびに入場アニメが再生されてチラつく）。
         中の手は貼り替えるたびに結び直し、背景を押して閉じる手は作ったときだけ。 */
      paintModal('finModal',html,()=>{
        byId('closeFinWin').addEventListener('click',closeFinWin);
        document.querySelectorAll('#finModal .fin-btn').forEach(b=>b.addEventListener('click',()=>{
          if(b.dataset.fin==='borrow'){const w=tutBlockMoney('borrow');if(w)return notice(w);return borrowLoan(loanStep());}
          return repayLoan(Math.min(state.loan,loanStep()));}));
        document.querySelectorAll('#finModal .al-btn').forEach(b=>b.addEventListener('click',()=>allianceAction(b.dataset.ally,b.dataset.kind)));
        document.querySelectorAll('#finModal .fin-tab').forEach(b=>b.addEventListener('click',()=>{
          if(finTab()===b.dataset.fintab)return;state.finTab=b.dataset.fintab;sfx.tap();render();}));
        document.querySelectorAll('#finModal .stk-lotb').forEach(b=>b.addEventListener('click',()=>{
          const n=+b.dataset.lot;if(state.stockLot===n)return;state.stockLot=n;sfx.tap();render();}));
        document.querySelectorAll('#finModal .c-lotb').forEach(b=>b.addEventListener('click',()=>{
          const n=+b.dataset.clot;if(state.cLot===n)return;state.cLot=n;sfx.tap();render();}));
        document.querySelectorAll('#finModal .cst-btn').forEach(b=>b.addEventListener('click',()=>{
          const lot=carrierLot();
          if(b.dataset.kind==='buy'){const w=tutBlockMoney('stock');if(w)return notice(w);return buyCarrierStock(b.dataset.car,lot);}
          return sellCarrierStock(b.dataset.car,lot);}));
        document.querySelectorAll('#finModal .stk-btn').forEach(b=>b.addEventListener('click',()=>{
          const lot=[1,5,20].indexOf(state.stockLot)>=0?state.stockLot:1;
          if(b.dataset.kind==='buy'){const w=tutBlockMoney('stock');if(w)return notice(w);return buyStock(b.dataset.stk,lot);}
          return sellStock(b.dataset.stk,lot);}));
      },()=>{
        byId('finModal').addEventListener('click',e=>{if(e.target.id==='finModal')closeFinWin();});
      });
    }
    /* ── 2026-10-28：証券の窓を2枚のタブにした ──
       「他社の株を買うと優待が付く」を足したので、この窓には
       **性格の違う2つの買い物**が同居することになった。
         🏢 株式  … 取引先の株を持つと費用が下がる（効きは飛ばす量に比例する）
         ✈ 航空会社 … 同業を提携・買収する（相手の客と収入がまるごと移る）
       一緒に並べると「どちらを押せばいいのか」が読めなくなるので分けた。
       既定は株式の側。買収は「自社より小さい会社だけ」という前提があり、
       序盤はほぼ全部が灰色になるため、先に見せる意味が薄い。 */
    function finTab(){return state.finTab==='carrier'?'carrier':'shares';}
    function stockHtml(){
      const t=finTab();
      return `<div class="fin-tabs">
        <button type="button" class="fin-tab${t==='shares'?' on':''}" data-fintab="shares">🏢 株式（優待）</button>
        <button type="button" class="fin-tab${t==='carrier'?' on':''}" data-fintab="carrier">✈ 航空会社</button></div>`
        +(t==='shares'?sharesHtml():carrierHtml());
    }
    /* ── 2026-10-28：値動きの線 ──
       数字だけだと「上がっているのか下がっているのか」が読めない。
       preserveAspectRatio="none" で横に伸ばすので、線の太さは
       vector-effect="non-scaling-stroke" で保つ（でないと潰れて細くなる）。
       base を渡すと、初値の高さに点線を引く——いまが高いのか安いのかが一目で分かる。 */
    function sparkHtml(series,base){
      const a=(series||[]).filter(v=>v>0).slice(-STOCK_HIST_MAX);
      if(a.length<2)return '<div class="stk-spark none">値動きはまだありません（1週ごとに記録します）</div>';
      const W=240,H=30,pad=3;
      let mn=Math.min.apply(null,a),mx=Math.max.apply(null,a);
      if(base>0){mn=Math.min(mn,base);mx=Math.max(mx,base);}
      const rng=(mx-mn)||1;
      const xf=i=>pad+i/(a.length-1)*(W-2*pad),yf=v=>H-pad-(v-mn)/rng*(H-2*pad);
      const pts=a.map((v,i)=>xf(i).toFixed(1)+','+yf(v).toFixed(1)).join(' ');
      const up=a[a.length-1]>=a[0];
      return `<div class="stk-spark"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" class="${up?'up':'down'}">`
        +(base>0?`<line x1="0" y1="${yf(base).toFixed(1)}" x2="${W}" y2="${yf(base).toFixed(1)}" stroke="#c6d4dc" stroke-dasharray="3 3" vector-effect="non-scaling-stroke"/>`:'')
        +`<polyline points="${pts}" fill="none" stroke="currentColor" stroke-width="1.6" vector-effect="non-scaling-stroke"/></svg>`
        /* 単位の「円」は上の行で言っているので、ここでは繰り返さない。
           入れると行が折り返して「円」だけが次の行に落ちる */
        +`<i>直近${a.length}週　高 ${mx.toLocaleString()} ／ 安 ${mn.toLocaleString()}${base>0?` ／ 点線＝初値 ${base.toLocaleString()}`:''}</i></div>`;
    }
    /* 株式のタブ。1単元＝1,000株で、1／5／20単元の3段で優待が上がる。
       値段より**段**を見せる——いくら払ったかよりも「次の段まであと何単元か」の方が、
       プレイヤーがいま決めたいことだから。 */
    function sharesHtml(){
      ensureStockPx();
      const lot=[1,5,20].indexOf(state.stockLot)>=0?state.stockLot:1;
      const val=stockValue();
      const prevVal=Object.keys(stockCatalog).reduce((a,id)=>a+stockUnits(id)*STOCK_UNIT*stockPrev(id),0);
      const d=val-prevVal,held=Object.keys(stockCatalog).filter(id=>stockUnits(id)>0).length;
      const rows=Object.keys(stockCatalog).map(id=>{
        const s=stockCatalog[id],px=stockPx(id),pv=stockPrev(id),u=stockUnits(id),t=stockTierOf(id);
        const chg=pv?(px-pv)/pv*100:0,cost=stockLotCost(id,lot),sellN=Math.min(lot,u);
        let yu;
        if(!s.tiers.length)yu='<i class="stk-none">優待はありません（値動きだけで稼ぐ銘柄）</i>';
        else if(t<0)yu=`<i class="stk-next">${STOCK_TIERS[0]}単元で <b>${s.tiers[0].t}</b></i>`;
        else yu=`<i class="stk-on">いま <b>${s.tiers[t].t}</b></i>`
          +(t+1<s.tiers.length?`<i class="stk-next">あと${STOCK_TIERS[t+1]-u}単元で <b>${s.tiers[t+1].t}</b></i>`:'<i class="stk-next">これが最上段です</i>');
        return `<div class="al-row stk-row"><div class="al-ic stk-ic">${s.ic}</div>
          <div class="al-info"><b>${s.n}<span class="al-b cd stk-sec">${s.sec}</span></b>
          <span><b class="stk-px">${px.toLocaleString()}円</b> <i class="${chg>=0?'up':'down'}">前週比 ${chg>=0?'+':'−'}${Math.abs(chg).toFixed(1)}%</i>${u?`<span class="stk-hold">　保有 <b>${u}単元</b></span><span class="stk-hold">（${yen(u*STOCK_UNIT*px)}）</span>`:''}</span>
          ${sparkHtml((state.stockHist||{})[id],s.px)}
          <span class="stk-yu">${yu}</span><span class="stk-tx">${s.tx}</span></div>
          <div class="al-btns"><button class="mini-btn stk-btn" data-stk="${id}" data-kind="buy" ${state.cash>=cost?'':'disabled'} title="${lot}単元＝${(STOCK_UNIT*lot).toLocaleString()}株">買う ${yen(cost)}</button>
          <button class="mini-btn stk-btn" data-stk="${id}" data-kind="sell" ${u?'':'disabled'}>売る ${sellN?yen(stockLotCost(id,sellN)):''}</button></div></div>`;}).join('');
      return `<div class="money-line"><span class="ml-ic">🏢</span><div><b>${held?`持っている株の値打ち ${yen(val)}（前週比 ${d>=0?'+':'−'}${yen(Math.abs(d))}）`:'取引先の株を持つと、その会社が自社を安くしてくれます'}</b><small><b>1,000株＝1単元</b>。<b>1単元</b>から優待が付き、<b>5単元・20単元</b>で効きが上がります</small></div></div>
      <div class="stk-lot"><span>いちどに売買する量</span>${[1,5,20].map(n=>`<button type="button" class="seg-btn stk-lotb${lot===n?' on':''}" data-lot="${n}">${n}単元</button>`).join('')}</div>
      ${rows}
      <p class="stk-note">優待は<b>飛ばした量に比例して</b>効きます（燃料費−6%は、燃料を多く使う会社ほど大きな額になります）。<br>
      だから<b>路線を増やしてから買う</b>方が得です。株価は毎週ゆるく上下し、放っておくと元の値段のほうへ戻っていきます。</p>
      ${carrierSharesHtml()}`;
    }
    /* ── 2026-10-28：同じ画面に他社（航空会社）の株も並べる ──
       取引先の株とは効き方が違うので、見出しと売買の単位を分けて下に置く。
         ・取引先 … 優待（費用の倍率が下がる）・1単元ずつ
         ・航空会社 … 配当と買収の前払い・1社＝1,000単元なので%で売買する */
    const CARRIER_LOTS=[10,50,200];               /* 1%・5%・20% */
    function carrierLot(){return CARRIER_LOTS.indexOf(state.cLot)>=0?state.cLot:CARRIER_LOTS[0];}
    function carrierSharesHtml(){
      const lot=carrierLot(),pct=u=>(u/carrierMaxUnits()*100);
      const list=Object.keys(rivals).filter(c=>!(state.rivalMerged||{})[c])
        .map(c=>({c,f:carrierFreq(c),u:carrierUnits(c),own:isOwned(c)}))
        .sort((a,b)=>(b.u-a.u)||(b.f-a.f));
      const held=list.filter(x=>x.u>0).length,div=dividendWeekly(),val=carrierStockValue();
      const rows=list.map(({c,f,u,own})=>{
        const px=carrierPx(c),pv=carrierPrevPx(c),chg=pv?(px-pv)/pv*100:0;
        const cost=px*STOCK_UNIT*lot,sellN=Math.min(lot,u),al=allianceOf(c);
        const badge=own?'<span class="al-b own">仲間</span>':al==='ally'?'<span class="al-b cd">提携中</span>':'';
        const info=own
          ? '<i class="stk-on">仲間になったので、株は自社のものになっています</i>'
          /* 持っていないときに「配当 ¥0」と出しても何も分からない。
             1%持ったらいくらになるかを出して、買うかどうかを決められるようにする */
          : `<i class="${u?'stk-on':'stk-none'}">${u?`配当 毎週 +${yen(carrierDividend(c))}`
              :`1%持つと 配当 毎週 +${yen(Math.round(carrierWeeklyProfit(c)*0.01))}`}</i>`
            +`<i class="stk-next">仲間にする値段 ${yen(memberCost(c))}${u?`（持株ぶん −${pct(u).toFixed(1)}%）`:''}</i>`;
        return `<div class="al-row stk-row"><div class="al-ic stk-ic" style="background:${rivals[c].color}22;color:${rivals[c].color}">✈</div>
          <div class="al-info"><b>${c}${badge}<span class="al-b freq">${f}往復/日</span></b>
          <span><b class="stk-px">${px.toLocaleString()}円</b> <i class="${chg>=0?'up':'down'}">前週比 ${chg>=0?'+':'−'}${Math.abs(chg).toFixed(1)}%</i>${u?`<span class="stk-hold">　持株 <b>${pct(u).toFixed(1)}%</b></span><span class="stk-hold">（${yen(u*STOCK_UNIT*px)}）</span>`:''}</span>
          ${own?'':sparkHtml((state.carrierHist||{})[c],0)}
          <span class="stk-yu">${info}</span></div>
          <div class="al-btns">${own?'<span class="al-done">仲間です</span>'
            :`<button class="mini-btn cst-btn" data-car="${c}" data-kind="buy" ${state.cash>=cost&&u<carrierMaxUnits()?'':'disabled'}>買う ${yen(cost)}</button>
              <button class="mini-btn cst-btn" data-car="${c}" data-kind="sell" ${u?'':'disabled'}>売る ${sellN?yen(px*STOCK_UNIT*sellN):''}</button>`}</div></div>`;}).join('');
      return `<h4 class="stk-head">✈ 航空会社の株</h4>
      <div class="money-line"><span class="ml-ic">✈</span><div><b>${held?`${held}社ぶん ${yen(val)}・配当 毎週 +${yen(div)}`:'同業の株は、配当と「買収の前払い」になります'}</b><small>値段は<b>その会社の便数</b>で決まります。伸びる会社を早く買うほど得。<b>1社＝1,000単元</b></small></div></div>
      <div class="stk-lot"><span>いちどに売買する量</span>${CARRIER_LOTS.map(n=>`<button type="button" class="seg-btn c-lotb${lot===n?' on':''}" data-clot="${n}">${(n/carrierMaxUnits()*100).toFixed(0)}%</button>`).join('')}</div>
      ${rows}
      <p class="stk-note">持っている株は<b>買収の前払い</b>です。〔✈ 航空会社〕のタブで仲間にするとき、<b>持株のぶんだけ値段が引かれます</b>（仲間にすると株は自社のものになります）。<br>
      ほかの会社に買われてしまったときは、<b>2割増しで買い取られます</b>。</p>`;
    }
    /* 航空会社のタブ。買える相手は「自社より小さい会社」だけなので、
       まず自社の大きさを出してから一覧を並べる（押せない理由が先に分かる） */
    function carrierHtml(){
      const mine=Math.round(ownWeight()),live=livingCarriers().length;
      const own=Object.keys(state.alliances||{}).filter(c=>state.alliances[c]==='member');
      const wk=own.reduce((s,c)=>s+carrierWeeklyProfit(c),0);
      return `<div class="money-line"><span class="ml-ic">📈</span><div><b>自社の規模 ${mine.toLocaleString()} 旅客/週</b><small>買えるのは<b>これより小さい会社</b>だけです（残り${live}社）</small></div></div>`
        +(own.length?`<div class="fin-grid"><div><span>傘下の会社</span><b>${own.length}社</b></div><div><span>傘下からの収入</span><b class="pos">+${yen(wk)}</b></div><div><span>次に買えるまで</span><b>${Math.max(0,MERGE_COOLDOWN-(state.week-(state.lastMergeWeek||-999)))}週</b></div></div>`:'')
        +allianceHtml();
    }
    function allianceHtml(){
      const al=state.alliances||{},rank={member:0,ally:1};
      const rows=Object.keys(rivals).filter(c=>!(state.rivalMerged||{})[c]).map(c=>({c,v:carrierValue(c),f:carrierFreq(c),a:al[c]}))
        .sort((x,y)=>{const rx=x.a?rank[x.a]:9,ry=y.a?rank[y.a]:9;return rx-ry||x.v-y.v;});
      const badge=a=>a==='member'?'<span class="al-b own">仲間</span>':a==='ally'?'<span class="al-b cd">提携中</span>':'';
      return `<p style="font-size:12px;color:var(--muted);margin:2px 2px 8px">🤝 <b>提携</b>すると乗継のお客さんが増え、その会社は攻めてこなくなります。<br>💰 <b>仲間にする</b>と、その会社の毎週の収入とお客さんがまるごと自社のものに。</p>`
      +rows.map(({c,v,f,a})=>{
        const ac=allyCost(c),mc=memberCost(c),why=memberBlockedWhy(c);
        let btns='';
        if(a==='member')btns='<span class="al-done">仲間です</span>';
        else{
          if(!a)btns+=`<button class="mini-btn al-btn" data-ally="${c}" data-kind="ally" ${state.cash>=ac?'':'disabled'}>提携 ${yen(ac)}</button>`;
          btns+=`<button class="mini-btn al-btn" data-ally="${c}" data-kind="member" ${(!why&&state.cash<mc)||why?'disabled':''}>仲間 ${yen(mc)}</button>`;
        }
        /* 2026-10-21：押せない理由を黙っていると、ただ壊れたボタンに見える */

    /* その路線が1年のうち何週飛ぶか。季節便の年間利益はこの週数で決まる */
    function activeWeeksOf(r){const win=routeWindow(r);if(!win)return 52;let n=0;for(let w=1;w<=52;w++)if(inWindow(w,win))n++;return n;}
    const routeSorts=[

    /* 時刻表ビュー：区間ごとに1行。出発空港・出発時刻・着陸空港・着陸時刻・機材・座席・搭乗率・利益 */
    function timetableHtml(){

          rows.push({r,pl,rest,i,n,t,seats,
            load:lr?lr.load:null,net,
            name:pl?aircraftCatalog[pl.type].name:'未配属'});

    /* 就航路線の一覧。ro=true なら読むだけ（会社タブ用に操作ボタンを出さない） */
    /* 2026-10-17：路線のIDは `R` ＋ Date.now() の下6桁だった。
       同じミリ秒に2本作ると同じIDになり、片方を触るともう片方も反応する
       （機材えらびのパネルが2枚同時に開くので気づいた）。連番を足して必ず別物にする。 */
    let _routeSeq=0;
    function newRouteId(){
      let id;do{id='R'+Date.now().toString().slice(-6)+(_routeSeq++).toString(36);}
      while(state.routes.some(r=>r.id===id));
      return id;
    }
    /* 2026-10-17：路線に積む機材は、路線のカードで選ぶ。
       それまでは「機材」タブの運航ボードで行先ブロックを機体へドラッグする形だったが、
       路線を作るときにも機体を選ぶので、同じことを2か所でやる形になっていた。
       機材タブは「買う・席を決める・装備を積む」だけにして、配属はここへ寄せる。 */
    function routePlanePickHtml(r){
      if(!state.planes.length)return `<div class="rp-pick"><p class="rp-empty">まだ飛行機がありません。「機材」タブの<b>お買い物</b>で1機買いましょう。</p></div>`;
      const cur=state.planes.find(p=>p.id===r.aircraftId);
      const pw=previewWeek(r);
      const rows=state.planes.map(p=>{
        const suit=planeSuitsRoute(p,r);
        const held=planeRoutes(p).filter(x=>x.id!==r.id),clash=held.filter(x=>routesClash(x,r));
        const wk=suit.ok?atWeek(pw,()=>weeklyEstimate(r,p)):null;
        const cfg=cabinConfig(p),on=cur&&cur.id===p.id;
        const note=on?'いま積んでいます'

          :held.length?`${held.map(x=>daysLabel(x)).join('/')}便と掛け持ち`:'空いています';
        return `<button type="button" class="pick-plane${suit.ok?'':' bad'}${on?' on':''}" data-rp="${r.id}" data-plane="${p.id}" ${suit.ok||on?'':'disabled'}>
          <span class="pp-ic">${on?'✅':'✈'}</span>
          <span class="pp-main"><b>${p.id}　${aircraftCatalog[p.type].name}</b><span>${cfg.effSeats}席・品質${cfg.quality}・${note}</span></span>
          <span class="pp-net ${wk?(wk.net>=0?'ok':'loss'):'ng'}">${wk?`${wk.net>=0?'+':''}${yen(Math.round(wk.net))}/週`:suit.reason}</span></button>`;}).join('');
      return `<div class="rp-pick"><div class="rp-lab">この路線に積む機材をえらぶ<small>右の金額は、その機体で飛ばしたときの週の見込み</small></div>
        ${rows}

    /* すでにある路線に、その機体を積めるか（航続・滑走路）。下書き用の planeSuitsDraft と同じ判定 */
    function planeSuitsRoute(p,r){
      const m=aircraftCatalog[p.type];
      const maxLeg=Math.max(0,...routeLegs(r).map(([f,t])=>distanceKm(f,t)));
      if(maxLeg>m.range)return {ok:false,reason:`航続不足 ${m.range}km`};
      const need=reqRunway(p.type),short=[...new Set(routePath(r))].find(ap=>parseRunway(ap)<need);
      if(short)return {ok:false,reason:`${short}の滑走路が短い`};
      return {ok:true};
    }

            <small>${pl?`${aircraftCatalog[pl.type].name}・${daysLabel(r)} 週${r.frequency}便`:'機体を載せていません'}</small></span>
          <span class="rm-num">${rest?'<small>運休中</small>'
            :wk?`<b class="${wk.net>=0?'pos':'neg'}">${wk.net>=0?'+':'−'}${yen(Math.abs(Math.round(wk.net)))}</b><small>搭乗 ${wk.perDay.load}%</small>`

    /* ── 2026-10-26：週の合計は会社タブへ移した ──
       「航路タブは、航路を作るの他、現在就航している便と並べ替え、時間だけでいいですね」

       （週の決算を会社タブへ移した10-25と同じ理屈）。

    function routeRows(){
      return state.routes.map(r=>{
        const plane=state.planes.find(p=>p.id===r.aircraftId),pw=previewWeek(r),rest=!routeActive(r);
        const wk=plane?atWeek(pw,()=>weeklyEstimate(r,plane)):null;

          ${wk?`<div class="rl-bar"><i style="width:${Math.min(100,load)}%;background:${loadColor(load)}"></i><span>搭乗率 ${load}%</span></div>
          <div class="rl-grid"><div><span>売上</span><b>${yen(Math.round(wk.revenue))}</b></div><div><span>運航費</span><b class="loss">−${yen(Math.round(wk.opcost))}</b></div><div><span>夜間格納</span><b class="loss">−${yen(Math.round(wk.night))}</b></div><div><span>旅客</span><b>${Math.round(wk.passengers).toLocaleString()}人</b></div><div class="${year>=0?'pos':'loss'}"><span>年間（${weeks}週運航）</span><b>${money(year)}</b></div><div><span>需要育成</span><b style="color:#1373a6">${mat}%${maturityFactor(r)<1.2?' ↑':''}</b></div></div>
          ${(()=>{
            /* 2026-10-16：運航費を1つの数字で出すだけでは、何が重いのか分からない。

            const op=Math.max(1,wk.opcost);

          ${(()=>{const sg=routeSigma(r),sw=Math.round(wk.revenue*sg);
            return `<div class="rl-swing"><span class="rls-ic">🎲</span>読みやすさ <b class="${sg<0.07?'calm':sg<0.12?'mid':'wild'}">${sg<0.07?'安定':sg<0.12?'ふつう':'読みにくい'}</b>　週ごとに <b>±${yen(sw)}</b> ほど上下します<small>${r.frequency}便／就航${r.matWeeks||0}週。便数を増やし、長く続けるほど読みやすくなります</small></div>`;})()}
          ${(()=>{const u=upgradeHint(r),risk=invasionRisk(r);
            if(!u&&!risk)return '';
            return `<div class="rl-up${risk?' warn':''}"><span class="rlu-ic">${risk?'⚠':'⬆'}</span><div>
              ${risk?`<b>満席で運びきれていません。このままだと <u class="rlu-who">${risk.carrier}</u> が ${risk.leg} に入ってきます</b>
                <small>搭乗${risk.load}%。<b>増便</b>するか、<b>大きい機体</b>に替えれば、取りこぼしが無くなって入ってこられなくなります。</small>`

              ${u.owned?'待機中の同じ機体があります。':`機体の値段 ${yen(u.cost)}・${payLabel(u.pay)}`}</small>`:''}

          ${rest?`<div class="rl-rest">💤 いまは運休中。<b>${calendarOf(pw).month}（${pw-state.week}週後）</b>に運航再開します${wk?`：再開時 <b>${money(wk.net)}/週</b>`:''}</div>`:''}
          ${/* 2026-10-18：くわしく／機材をえらぶ／ダイヤ変更 は、別々に開く3つの折りたたみだった。
                押すたびにカードが伸び、下の路線がその分だけ流れていく。
                3つを同じ1段のボタン列にまとめ、開く場所もこの直下の1か所だけにした。
                どれか1つしか開かない＝ボタンの段は動かないので、押した先を見失わない。
                2026-10-17：操作列は「機材あり」の分岐の中にあったため、
                未配属の路線には操作が1つも出ていなかった。 */''}
          <div class="route-ops"><button class="mini-btn rl-more${detailOpen?' on':''}" data-more="${r.id}">${detailOpen?'閉じる▲':'くわしく▼'}</button>${ro?'':`<button class="mini-btn rt-plane${state.pickFor===r.id?' on':''}" data-r="${r.id}">${plane?'機材を変える▼':'✈ 機材をえらぶ▼'}</button><button class="mini-btn rt-tune${state.editRoute===r.id?' on':''}" data-r="${r.id}">${state.editRoute===r.id?'閉じる▲':'🕐 ダイヤ変更▼'}</button>${plane?`<button class="mini-btn rt-freq" data-r="${r.id}" data-d="1">増便▲</button><button class="mini-btn rt-freq" data-r="${r.id}" data-d="-1">減便▼</button><button class="mini-btn rt-season" data-r="${r.id}">${sd.ic}${sd.label}</button>`:''}<button class="mini-btn rt-del" data-r="${r.id}">撤退✕</button>`}</div>
        ${detailOpen?`
          ${(()=>{if(!wk)return '';const lr=wk.perDay.legRows[0];if(!lr||!lr.mix)return '';
            const seg=['biz','leis','price'].map(k=>({k,d:PAX_SEGMENTS[k],mkt:lr.mix[k],got:lr.segShare[k]}));
            return `<div class="seg-box"><div class="sg-head">👥 この区間の客層<small>市場の構成 ／ 自社が運んだ内訳</small></div>
            ${seg.map(s=>`<div class="sg-row"><span>${s.d.ic}${s.d.label}</span><i><b style="width:${Math.round(s.mkt*100)}%"></b></i><em>${Math.round(s.mkt*100)}%</em><i class="got"><b style="width:${Math.round(s.got*100)}%"></b></i><em>${Math.round(s.got*100)}%</em></div>`).join('')}
            ${lr.lounge>0?`<small class="sg-note">🛋 ラウンジが効いています（×${lr.lounge.toFixed(1)}）。出張客のシェアが上がります</small>`:''}
            </div>`;})()}
          ${(()=>{const sat=routeSatisfaction(r);if(!sat)return '';
            const bar=(lab,v,note)=>`<div class="sat-row"><span>${lab}</span><i><b style="width:${v}%;background:${v>=70?'#2fa35a':v>=45?'#e0b020':'#e06040'}"></b></i><em>${v}</em><small>${note}</small></div>`;
            const d=densityPresets[plane.density||'std'];
            const km=routeMainKm(r),ratio=fareOf(r)/standardFare(km);
            return `<div class="sat-box ${sat.total>=70?'ok':sat.total>=45?'mid':'bad'}">
              <div class="sat-head"><span>😊 顧客満足度</span><b>${sat.total}</b></div>
              ${bar('座席',sat.seat,d.label)}
              ${bar('運賃',sat.fare,`標準の${Math.round(ratio*100)}%`)}
              ${bar('サービス',sat.svc,svcLabelOf(plane))}
            </div>`;})()}
          ${(()=>{const ts=routeLegTimes(r,plane?plane.type:'ATR42');if(!ts.length)return '';
            const day=ts[ts.length-1].arr-ts[0].dep,air=ts.reduce((s,t)=>s+t.block,0);
            return `<div class="rl-time">🕐 ${ts.filter(t=>t.trip===1).map(t=>`<span>${t.from} ${hhmm(t.dep)} → ${t.to} ${hhmm(t.arr)}<i>${durLabel(t.block)}</i></span>`).join('')}<small>${plane?aircraftCatalog[plane.type].name:'ATR42-600'}（巡航 ${cruiseOf(plane?plane.type:'ATR42')}km/h）で 飛行 ${durLabel(air/tripsPerDay(r))}／1日の拘束 ${durLabel(day)}</small></div>`;})()}
        `:``}
          ${(!ro&&state.pickFor===r.id)?routePlanePickHtml(r):''}
          ${(!ro&&state.editRoute===r.id)?routeEditHtml(r):''}
        </div>`;}).join('')+'</div>';
    }
    /* ── 2026-10-21：満席の路線に、大きい機体を勧める ──
       通しで遊ばせて分かった、このゲームのいちばん大事な一手。
       搭乗率95%の鹿児島—福江は、DHC-6だと週¥1,030千だが、ATR72なら週¥7,905千になる。
       8倍。これが成長の本体なのに、画面のどこにも書いていなかったので、
       素朴に遊ぶと1年で頭打ちになり、資金を抱えたまま横ばいのままだった。

       estimateOperation は route.aircraftId から state.planes を引くので、
       持っていない機種で試算するには、その機体を一時的に置く必要がある。
       必ず元に戻す（finally）。 */
    function estimateWithType(route,type){
      const id='__try__';
      const probe={id,type,density:'std',service:'std',equip:[],bought:state.week,assigned:null};
      state.planes.push(probe);
      try{return weeklyEstimate({...route,aircraftId:id},probe);}
      catch(e){return null;}
      finally{const i=state.planes.findIndex(p=>p.id===id);if(i>=0)state.planes.splice(i,1);}
    }
    /* その路線にいま最も効く機種の入れ替え。無ければ null */
    /* 機体代を、その路線の伸びだけで回収するのに掛かる時間。
       2026-10-21：測ってみると 8年〜190年で、1年以内に収まる機体は1つも無かった。
       「高い買い物だ」ということ自体が判断材料なので、週のままにせず年で見せる。 */
    function payLabel(w){return w<=52?`${w}週で元が取れます`:`機体代の回収には ${Math.round(w/52)}年`;}
    function upgradeHint(r){
      if(!r.aircraftId)return null;
      const cur=state.planes.find(p=>p.id===r.aircraftId);if(!cur)return null;
      const now=weeklyEstimate(r,cur);
      if(now.perDay.load<88)return null;                 /* 満席に近いときだけ勧める */
      const path=routePath(r),rw=Math.min.apply(null,path.map(parseRunway));
      const km=routeMainKm(r);
      let best=null;
      Object.entries(aircraftCatalog).forEach(([t,m])=>{
        if(m.seats<=cabinConfig(cur).effSeats)return;
        if(m.runwayReq>rw||m.range<km*1.08)return;
        const e=estimateWithType(r,t);if(!e)return;
        const gain=e.net-now.net;
        if(gain<=0)return;
        /* 同じ効果なら安い機体を選ぶ。1円あたりの伸びで比べる
           （＝元が取れるまでの週数がいちばん短い機体。2026-10-21 に測って確かめた：
             この順位づけは、滑走路と航続で実際に飛べる候補だけに絞ったあとなら
             「いちばん伸びる機体」とほぼ一致する。天草（1,000m）のように
             大型機が降りられない空港では、そもそも候補がDHC-6しか残らない） */
        const eff=gain/m.cost;
        if(!best||eff>best.eff)best={type:t,name:m.name,cost:m.cost,gain,eff,load:e.perDay.load,pay:Math.ceil(m.cost/gain)};
      });
      if(!best)return null;
      return {...best,nowNet:now.net,nowLoad:now.perDay.load,owned:state.planes.some(p=>p.type===best.type&&!planeRoutes(p).length)};
    }
    /* 満席を放っておくと、どの社が入ってくるか。rivalReact と同じ条件で先に見せる。
       「運びきれていない客がいるから取られる」という因果を、取られる前に読めるように。 */
    function invasionRisk(r){
      if(!r.aircraftId)return null;
      const pl=state.planes.find(p=>p.id===r.aircraftId);if(!pl)return null;
      if((r.matWeeks||0)<6)return null;
      const wk=weeklyEstimate(r,pl);
      let worst=null;
      wk.perDay.legRows.forEach(function(lr){
        if(lr.load<88)return;
        const cur=(state.rivalAdds||[]).filter(a=>key(a.from,a.to)===key(lr.from,lr.to))
          .reduce((s,a)=>s+a.frequency,0);
        if(cur>=3)return;
        const def=defendingCarrier(lr.from,lr.to);
        if(allianceOf(def.carrier))return;                /* 提携先は攻めてこない */
        const e=rivalRouteNet(def.carrier,lr.from,lr.to,1);
        if(!e||e.net<rivalNetFloor(def.carrier))return;
        if(!worst||e.net>worst.net)worst={carrier:def.carrier,net:e.net,leg:`${lr.from}—${lr.to}`,load:lr.load};
      });
      return worst;
    }
    /* 路線カードの引き出しは1本だけ。くわしく／機材／ダイヤ のどれかを開くと他は閉じる。
       同じものをもう一度押せば閉じる。カードが二重三重に伸びないので、下の路線が流れにくい */
    function openRouteDrawer(id,which){
      if(!state.openRoute)state.openRoute={};
      const was={detail:!!state.openRoute[id],plane:state.pickFor===id,tune:state.editRoute===id};
      state.openRoute[id]=false;state.pickFor=null;state.editRoute=null;
      if(!was[which]){
        if(which==='detail')state.openRoute[id]=true;
        else if(which==='plane')state.pickFor=id;
        else state.editRoute=id;
      }
      sfx.tap();render();
    }
    /* ── 右の「運用を組む」まで画面を送る（2026-10-21）──
       使うのは2か所：下のタブを押したときと、一覧の「＋ 航路をつくる」を押したとき。
       ・狭い画面ではパネルが地図の下に積まれるので、タブを押しても地図のまま
       ・一覧を見ているときはパネルが画面の「上」に外れている
       どちらも「いま見えている所に無い」ので、上下どちらに外れていても送る。
       window.scrollTo({behavior:'smooth'}) はこの環境で何も起きなかった
       （即時指定と scrollIntoView は効く）ので、scrollIntoView を使う。
       送ったあとに地図や帯の高さが変わって頭が外れることがあるため
       （実測：scrollY 808 まで送ったのに上端が −130px）、落ち着いたころにそろえ直す。 */
    function goToPanel(){
      if(isTutorial()&&state.tutorial&&!state.tutorial.done)return;   /* 案内は自前で送っている */
      /* 2026-10-23：右の欄が空のとき（＝航路をつくっていないとき）は、
         そこへ送っても何も無い。航路タブで見せたいのは
         「いま就航している航路」そのものなので、一覧の頭へ送る。
         #wide の頭だと、決算ボタンと決算レポートの下に一覧が隠れて
         見出しが1,602px下になっていた（実測）。 */
      const pn=byId('panel');
      const p=(pn&&pn.innerHTML.trim())?pn:(byId('currentRoutes')||byId('wide')||pn);
      if(!p)return;
      const out=()=>{const r=p.getBoundingClientRect();return r.top<-4||r.top>innerHeight*0.6;};
      if(!out())return;
      setTimeout(()=>{p.scrollIntoView({block:'start'});},0);
      setTimeout(()=>{if(out())p.scrollIntoView({block:'start'});},280);
    }
    function bindRouteDrawers(){
      /* 一覧の先頭の「＋ 航路をつくる」。作成を開いて、右の「運用を組む」まで送る */
      {const mb=byId('makeRouteTop');
       if(mb)mb.addEventListener('click',()=>{
         state.panelView='routes';state.draftOpen=true;sfx.tap();render();
         goToPanel();});}
      /* 要約の行を押したら、下の詳しいカードを開いて、そこまで運ぶ */
      document.querySelectorAll('[data-rmgo]').forEach(b=>b.addEventListener('click',()=>{
        const id=b.dataset.rmgo;
        if(!state.openRoute)state.openRoute={};
        state.openRoute[id]=true;state.pickFor=null;state.editRoute=null;
        sfx.tap();render();
        const card=document.querySelector(`[data-more="${id}"]`);
        if(card)card.closest('.route-card,.rl-card,div')?.scrollIntoView({behavior:'smooth',block:'center'});
      }));

    function forecastLoad(r,fare){

    /* 目標搭乗率に乗る運賃を解く。需要の価格弾力性で当たりをつけ、2回だけ補正する */
    function rmSolveFare(r,target){
      const km=routeMainKm(r);if(!km)return null;
      const std=standardFare(km),lo=round100(std*0.5),hi=round100(std*2.2);
      let f=fareOf(r),load=forecastLoad(r,f);
      if(load==null)return null;
      const E=1.8;   /* 運賃を1%上げると需要が約1.8%減る（fareStim と シェアの合計） */
      for(let i=0;i<2;i++){
        if(load<=0){f=lo;break;}
        if(Math.abs(load-target)<1.5)break;
        f=Math.max(lo,Math.min(hi,round100(f*Math.pow(load/target,1/E))));

    function suggestFareMult(){
      const rs=state.routes.filter(r=>flying(r));
      if(!rs.length)return null;
      const saved=rs.map(r=>r.fare),savedBrand=state.brand;
      let best=null;
      try{

           （実測で7%〜100%を行き来する）、1週ぶんの予測が当てにならなくなる。
           予測は「上げるほど得」と答えてしまうが、実際に3年回すと赤字になる。
           低めに助言して外す側に倒しておく。 */
        [1.0,1.1,1.2,1.3].forEach(m=>{
          rs.forEach(r=>{const km=routeMainKm(r);if(km)r.fare=round100(standardFare(km)*m);});

             運賃を固定する前提なので、安定度は最良（1.0）とみなす。 */
          state.brand=Math.max(15,Math.min(92,12+companySatisfaction()*0.62+6));
          let rev=0,oc=0;
          rs.forEach(r=>{
            const pl=state.planes.find(p=>p.id===r.aircraftId);if(!pl)return;
            const w=weeklyEstimate(r,pl);rev+=w.revenue;oc+=w.opcost+w.night;
          });
          const net=rev-oc-overheadWeekly(rev)-Math.round(state.loan*loanRate());
          if(!best||net>best.net)best={mult:m,net};
        });
      }finally{ rs.forEach((r,i)=>{r.fare=saved[i];}); state.brand=savedBrand; }
      return best;
    }
    function farePolicy(){

       原価が薄まりすぎて、空席が出た瞬間に赤字になる値段がついてしまう。 */
    const COST_BASE_LOAD=0.65;

        <p class="tut-tip">${res.ok
          ?'1機を曜日で分けて島を回す——これが地方航空の基本形です。<br>ニューゲームでは<b>拠点も行き先も自由に選べます</b>。空白の空を見つけてください。'
          :'赤字で終わりました。<b>1日の往復をふやす</b>、大きい機体に替える、座席を詰める——<br>打ち手はいくつもあります。このまま続けても、やり直してもかまいません。'}</p>
        ${/* 2026-10-25：ここは「運賃を距離基準130%まで上げて」と言っていたが、
              新規路線の既定運賃はすでに110%で、NEW_ROUTE_FARE_MULT のところに
              「110%なら搭乗率90%台を保ち、値上げの弊害は出ない」と測って書いてある。
              さらに値上げを勧めるのは、測った裏づけのない助言だった。
              効く手は増便——搭乗率が88%(SPILL_LOAD)を超えたままだと他社の対抗便が
              積み上がる。1日2往復にして搭乗率を80%前後に落とすと、
              52週の合計は +6,319千 → +36,167千、クリア率 66% → 92% になった。 */''}
        <div class="tut-goal"><b>${res.ok?'次は':'ヒント'}</b><span>${res.ok?'ニューゲームで、本社にする空港から選びましょう':'満席が続く路線は、航路の「1日の往復」を2回にしてみてください。運びきれない客がいると他社が入ってきます'}</span></div>
        <button class="btn" id="tutToTitle">タイトルへ</button>
        <button class="btn secondary" id="tutKeep">このまま続ける</button></div>`;
      document.body.appendChild(w);
      byId('tutToTitle').addEventListener('click',()=>{sfx.tap();w.remove();saveGame();showTitle();});
      byId('tutKeep').addEventListener('click',()=>{sfx.tap();w.remove();state.tutorialRun=null;saveGame();render();});
    }
    function titleContinue(){
      if(!readSave())return;
      if(loadGame()){sfx.launch();hideTitle();invalidateInf();render();}
      else notice('記録を読み込めませんでした。');
    }
    /* 「本当にはじめる？」の確認状態は、ほかのボタンを触ったら戻す */
    function resetNewBtn(){const b=document.querySelector('.ts-btn[data-t="new"]');if(!b||b.dataset.c!=='1')return;
      b.dataset.c='';b.querySelector('b').textContent='ニューゲーム';b.querySelector('small').textContent='本社にする空港を選ぶところから';}
    byId('tsMenu').querySelectorAll('.ts-btn').forEach(b=>b.addEventListener('click',()=>{
      const t=b.dataset.t;
      if(t!=='new')resetNewBtn();
      if(t==='tutorial')return startTutorial();
      if(t==='new')return titleNewGame(b);
      if(t==='continue')return titleContinue();
      const box=byId('tsConfig');
      if(box.hidden){box.hidden=false;renderTitleConfig();}else{box.hidden=true;}
      sfx.tap();
    }));
    showTitle();
    render();
  </script>
</body>
</html>
