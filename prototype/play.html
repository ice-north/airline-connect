<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>エアラインコネクト</title>
  <style>
    :root{--bg:#061827;--panel:#0c2739;--line:#ffffff20;--ink:#ecfbff;--muted:#9fc0cb;--cyan:#71e4ec;--green:#64e6a6;--amber:#ffd268;--red:#ff8191}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 75% -15%,#1f708d80,transparent 40%),var(--bg);font-family:Arial,'Yu Gothic',sans-serif;color:var(--ink)}button,select{font:inherit}.top{height:68px;padding:0 4vw;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:#04131fee}.logo{font-weight:900;letter-spacing:.16em}.logo b{color:var(--cyan-ink)}.tag{font-size:12px;color:var(--muted);letter-spacing:.12em}.stats{display:flex;gap:22px;font-size:12px;color:var(--muted)}.stats strong{display:block;color:#fff;font-size:15px}.layout{max-width:1480px;margin:auto;padding:22px 4vw;display:grid;grid-template-columns:minmax(0,1fr) clamp(340px,30vw,470px);gap:16px}.card{border:1px solid var(--line);border-radius:15px;background:#0b2638df;box-shadow:0 18px 40px #0003}.map{height:650px;position:relative;overflow:hidden;background:#19394a}.gsi-tiles{position:absolute;inset:0;overflow:hidden;filter:saturate(.8) contrast(1.06) brightness(.78)}.gsi-tiles img{position:absolute;width:256px;height:256px;pointer-events:none;user-select:none}.gsi-tiles .photo-tile{z-index:1}.map:before,.picker-map:before{content:'';position:absolute;z-index:1;inset:0;background:repeating-linear-gradient(90deg,transparent 0 48px,#95dfe810 49px),repeating-linear-gradient(0deg,transparent 0 48px,#95dfe810 49px);pointer-events:none}.map-title{position:absolute;z-index:4;top:15px;left:15px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#061827d9}.map-title h1{font-size:16px;margin:0}.map-title p{font-size:12px;color:var(--muted);margin:4px 0 0}.airport,.picker-airport{position:absolute;z-index:5;transform:translate(-50%,-50%);border:0;background:transparent;color:#effcff;font-weight:bold;font-size:12px;text-shadow:0 1px 4px #000;cursor:pointer;touch-action:manipulation}.airport:before,.picker-airport:before{content:'';display:block;width:12px;height:12px;margin:auto;border:3px solid var(--cyan);border-radius:50%;background:#fff;box-shadow:0 0 0 4px #72e4ed28,0 0 13px #72e4ed}.airport.active:before,.airport:hover:before,.picker-airport.active:before,.picker-airport:hover:before{background:var(--cyan);transform:scale(1.2)}.airport small{display:block;font-size:12px;color:#9fc7d0;margin-top:4px}.airport.compact{font-size:0}.airport.compact:before{width:8px;height:8px;border-width:2px}.airport.compact small{display:none}.route{position:absolute;height:2px;transform-origin:0 50%;background:linear-gradient(90deg,var(--cyan),#7286ff);box-shadow:0 0 8px var(--cyan);z-index:3}.plane{position:absolute;z-index:4;font-size:16px;text-shadow:0 0 10px var(--cyan)}.side{padding:16px}.side h2{font-size:18px;margin:0}.side p{color:var(--muted);font-size:12px;line-height:1.6}.market,.fleet-row,.route-row{padding:10px;border:1px solid var(--line);border-radius:10px;background:#061b2a9a;margin:11px 0;font-size:12px}.market b{color:var(--green)}.field{margin-top:12px}.field label{display:block;font-size:12px;font-weight:500;color:#b4d3dc;margin-bottom:5px}.field select{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:#061827;color:#fff}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{width:100%;margin-top:12px;padding:11px;border:0;border-radius:8px;cursor:pointer;background:var(--cyan);color:#05202b;font-weight:bold}.btn.secondary{color:#e8faff;background:#ffffff0d;border:1px solid var(--line)}.btn:disabled{opacity:.4;cursor:not-allowed}.route-row b,.fleet-row b{display:block}.route-row span,.fleet-row span{display:block;margin-top:4px;color:var(--muted);font-size:12px}.modal{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:20px;background:#020d16e8}.modal.hidden{display:none}.picker{width:min(980px,96vw);padding:26px}.picker h1{margin:0;font-size:28px}.picker h1 b{color:var(--cyan-ink)}.picker>p{color:var(--muted);font-size:13px}.picker-grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(270px,.8fr);gap:16px;margin-top:18px}.picker-map{height:440px;position:relative;overflow:hidden;border:1px solid var(--line);border-radius:12px;background:#19394a}.picker-map-title{position:absolute;z-index:4;top:14px;left:14px;font-size:12px;color:#b7edf2;letter-spacing:.12em}.picker-info{padding:18px;border:1px solid var(--line);border-radius:12px;background:#061d2d}.picker-info .eyebrow{font-size:12px;color:var(--cyan-ink);letter-spacing:.12em}.picker-info h2{margin:8px 0 3px;font-size:24px}.picker-info p{min-height:98px;color:var(--muted);font-size:12px;line-height:1.7}.picker-info dl{font-size:12px}.picker-info dt{color:#9fc4cf;margin-top:12px}.picker-info dd{margin:4px 0;color:#fff}.empty{padding-top:42px}.toast{position:fixed;right:18px;bottom:18px;z-index:20;opacity:0;transition:.2s;transform:translateY(8px);padding:11px;border:1px solid #71e4ecaa;border-radius:9px;background:#0d3c4d;font-size:12px}.toast.show{opacity:1;transform:none}@media(max-width:900px){.layout{grid-template-columns:1fr}.map{height:520px}.picker-grid{grid-template-columns:1fr}.picker-map{height:370px}.stats{gap:10px}}@media(max-width:600px){.top{padding:0 16px}.stats{font-size:12px}.layout{padding:15px}.picker{padding:20px}.picker h1{font-size:23px}}
  </style>
  <style>
    .rival-route{position:absolute;height:1px;transform-origin:0 50%;opacity:.48;z-index:2;border-top:1px dashed currentColor;pointer-events:none}.rival-route[data-carrier="JAL"]{color:#ec5a68}.rival-route[data-carrier="ANA"]{color:#5aa6ff}.rival-route[data-carrier="スカイマーク"]{color:#ffd268}.rival-route[data-carrier="AIRDO"]{color:#77d6c8}.route-legend{position:absolute;right:14px;bottom:14px;z-index:6;display:flex;gap:8px;flex-wrap:wrap;max-width:280px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:#061827dc;font-size:12px;color:#d7edf2}.route-legend i{display:inline-block;width:12px;border-top:2px dashed currentColor;vertical-align:middle;margin-right:3px}.route-legend .jal{color:#ec5a68}.route-legend .ana{color:#5aa6ff}.route-legend .sky{color:#ffd268}.route-legend .ado{color:#77d6c8}
    .rival-list{margin-top:13px;padding-top:11px;border-top:1px solid var(--line);max-height:190px;overflow:auto}.rival-list h3{font-size:12px;margin:0 0 7px;color:#dff7fa}.rival-item{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid #ffffff0d;font-size:12px}.rival-item b{color:var(--cyan-ink)}.rival-item span{color:var(--muted);white-space:nowrap}
    .airport-facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.airport-fact{padding:9px;border:1px solid var(--line);border-radius:8px;background:#061b2a9a}.airport-fact span{display:block;color:var(--muted);font-size:12px}.airport-fact b{display:block;margin-top:3px;font-size:13px}
    /* 2026-10-26：作成欄の縦を詰めるため、見出しの前後を 20/8 → 12/5 にした */
    .step-title{margin:12px 0 5px;font-size:12px;color:var(--cyan-ink);letter-spacing:.08em}.fleet-row select,.side>select{width:100%;margin-top:8px;padding:7px;border:1px solid var(--line);border-radius:7px;background:#061827;color:#fff;font-size:12px}.fleet-row .mini-btn{width:100%;margin-top:7px;padding:7px;border:1px solid var(--line);border-radius:7px;background:#ffffff10;color:#e8faff;font-size:12px;cursor:pointer}.route-row.unassigned{border-color:#ffd26888}.route-row .status{color:var(--amber)}.report{margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}.report-total{display:grid;grid-template-columns:1fr 1fr;gap:7px}.report-total div{padding:8px;border-radius:8px;background:#061b2a9a;font-size:12px;color:var(--muted)}.report-total b{display:block;margin-top:3px;color:#fff;font-size:13px}.report-total .profit b{color:var(--green)}.report-total .loss b{color:var(--red)}.report-row{padding:8px 0;border-bottom:1px solid #ffffff12;font-size:12px}.report-row b{display:block;font-size:12px}.report-row span{color:var(--muted)}.plane.flying{animation:flightPulse 1.6s ease-in-out infinite;transition:left 1.7s linear,top 1.7s linear}.flight-status{position:absolute;z-index:6;left:15px;bottom:66px;padding:8px 10px;border:1px solid #71e4ec88;border-radius:8px;background:#061827dc;color:#dffcff;font-size:12px}.flight-status b{color:var(--cyan-ink)}@keyframes flightPulse{50%{transform:translate(5px,-4px) scale(1.16);filter:drop-shadow(0 0 7px #71e4ec)}}.map-actions{position:absolute;z-index:7;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(3,1fr);gap:1px;padding:8px;background:#04131ff2;border-top:1px solid var(--line)}.map-actions button{min-height:36px;border:1px solid var(--line);border-radius:7px;background:#0b2a3bd8;color:#dff8fc;font-weight:500;cursor:pointer}.map-actions button.active,.map-actions button:hover{background:var(--cyan);color:#05202b}.map .route-legend{bottom:62px}
  </style>
  <style>
    .chips{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:10px 0}
    .chip{display:inline-flex;align-items:center;gap:4px;padding:5px 9px;border:1px solid var(--line);border-radius:20px;background:#0b2a3b;font-size:12px}
    .chip.base{border-color:var(--cyan);color:var(--cyan-ink)}
    .chip.park{border-color:var(--amber);color:var(--amber)}
    .chip.park small{opacity:.75;font-size:12px;margin-left:2px}
    /* 2026-10-22：12×14pxしかなく指で押せなかった。②到着空港を外す操作なので大きくする */
    .chip-x{border:0;background:transparent;color:var(--red);cursor:pointer;font-size:14px;line-height:1;
      min-width:32px;min-height:32px;padding:0 6px;margin:-6px -4px -6px 2px}
    .chip-arrow{color:var(--muted);font-size:12px}
    .route-row .kind{display:inline-block;padding:1px 7px;border-radius:10px;font-size:12px;margin-right:6px;background:#ffffff1c;color:#dff8fc;vertical-align:middle}
    .multi-leg{position:absolute;height:2px;transform-origin:0 50%;background:linear-gradient(90deg,var(--cyan),#7286ff);box-shadow:0 0 8px var(--cyan);z-index:3}
    #mainTiles{overflow:visible;will-change:transform;backface-visibility:hidden}
    /* タイル整備範囲外（外洋）を海色で埋めてシームレスに見せる */
    #mainMap{background:#0d2b38}
    #mainMap .sea{position:absolute;inset:0;z-index:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 30%,#123a49,#0c2733 78%)}
    .gameover{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:#020d16f2;text-align:center;padding:20px}
    .gameover .card{padding:34px;max-width:420px}
    .gameover h1{color:var(--red);margin:0 0 10px;font-size:34px;letter-spacing:.1em}
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    /* ===== ポップ・テーマ（A列車で行こうDS風・明るく親しみやすい） ===== */
    :root{
      --bg:#bfe8ff;--panel:#ffffff;--line:#123a5522;--ink:#20323c;--muted:#405964;
      --cyan:#22a6e6;--cyan-ink:#1273a2;--green:#1e7c37;--amber:#ffb02e;--red:#d61818;--coral:#ff7a59;--sun:#ffd23d;
    }
    body{font-family:'M PLUS Rounded 1c','Yu Gothic',sans-serif !important;color:var(--ink);
      background:linear-gradient(180deg,#a9ddff 0%,#d3efff 42%,#ecfbff 100%) !important;min-height:100vh;}
    body:before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
      background:
        radial-gradient(70px 26px at 16% 14%,#ffffffdd,transparent 70%),
        radial-gradient(110px 40px at 23% 17%,#ffffffbb,transparent 72%),
        radial-gradient(60px 24px at 74% 10%,#ffffffdd,transparent 70%),
        radial-gradient(120px 44px at 83% 14%,#ffffffaa,transparent 72%),
        radial-gradient(80px 30px at 55% 8%,#ffffffcc,transparent 72%);}
    header.top,main.layout{position:relative;z-index:1;}
    .top{background:#ffffffec !important;border-bottom:2px solid #d4ebf7 !important;box-shadow:0 4px 0 #d7edfa,0 8px 18px #7bb6d21f !important;
      height:auto !important;min-height:62px;flex-wrap:wrap !important;gap:6px 14px;padding:9px 4vw !important;}
    .logo{color:#2a4a5a !important;letter-spacing:.1em;}
    .logo b{color:var(--cyan-ink) !important;}
    .tag,.stats{color:var(--muted) !important;}
    .stats strong{color:#2a4a5a !important;}
    /* 数字が縦に潰れないように。狭い画面では折り返して並ぶ */
    .stats{flex-wrap:wrap !important;gap:6px 16px !important;}
    .stats>div{white-space:nowrap;}
    /* 経営ゲームでいちばん大事な数字。常に見えるようにする（以前は4.5画面下にしか無かった） */
    #netStat.pos strong{color:#1f7a3d !important;}
    #netStat.neg strong{color:#c0392b !important;}
    #netStat.neg::after{content:'▼';margin-left:3px;color:#c0392b;font-size:12px;}
    #netStat.pos::after{content:'▲';margin-left:3px;color:#1f7a3d;font-size:12px;}
    .stats strong{white-space:nowrap;font-size:14px !important;font-variant-numeric:tabular-nums;}
    /* 日付は進行がひと目で分かるよう強調する */
    #date{color:#1373a6 !important;font-size:15px !important;}
    #date small{display:inline;font-size:12px;color:#7da3b4;font-weight:500;margin-left:4px;}
    @media(max-width:760px){
      .top .tag{display:none;}
      .stats{font-size:12px !important;gap:4px 12px !important;}
      .stats strong{font-size:13px !important;}
      #date{font-size:13px !important;}
      #date small{display:none;}
    }
    .card{background:#ffffff !important;border:2px solid #dcecf5 !important;border-radius:22px !important;
      box-shadow:0 8px 0 #dbeef9,0 16px 30px #6aa8c422 !important;}
    /* 地図：明るい淡色地図 */
    .gsi-tiles{filter:saturate(1.1) brightness(1.03) !important;}
    .map{background:#e3f3fa !important;}
    #mainMap{background:#dbeef8 !important;}
    #mainMap .sea{background:radial-gradient(130% 100% at 50% 18%,#e2f5ff,#c6e8f7 88%) !important;}
    .map:before{background:
      repeating-linear-gradient(90deg,transparent 0 60px,#79c3e614 61px),
      repeating-linear-gradient(0deg,transparent 0 60px,#79c3e614 61px) !important;}
    .map-title{background:#ffffffe6 !important;border:2px solid #d4ebf7 !important;border-radius:14px !important;box-shadow:0 4px 0 #e0f1fb;}
    .map-title h1{color:#2a4a5a !important;}
    .map-title p{color:var(--muted) !important;}
    /* 空港ピン：コーラル→選択で太陽色 */
    /* 地図のラベルも12pxの漢字。白いふちどりが強いので 500 でも沈まない
       （700 だと「鹿児島」「伊丹中部」の線がくっついて読みにくかった） */
    .airport{color:#173241 !important;font-weight:500 !important;
      text-shadow:0 1px 2px #fff,0 0 4px #fff,1px 0 3px #fff,-1px 0 3px #fff !important;}
    .airport:before{border:3px solid var(--coral) !important;background:#fff !important;
      box-shadow:0 0 0 4px #ff7a5930,0 2px 6px #0002 !important;}
    .airport.active:before,.airport:hover:before{
      background:var(--sun) !important;border-color:#ff9f1c !important;transform:scale(1.25);}
    .airport small{color:#355a6c !important;text-shadow:0 1px 2px #fff,-1px 0 2px #fff !important;}
    /* 当たり判定は丸い点だけ（ラベルは非干渉）。実サイズは下の .airport で34pxに広げている */
    .airport{padding:0 !important;overflow:visible !important;}
    .airport:before{margin:0 !important;}
    .airport .lbl{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:2px;pointer-events:none;white-space:nowrap;text-align:center;}
    /* 小空港は点だけ小さくし、押せる範囲は通常と同じに保つ（地方空港ほど触る機会が多いため） */
    .airport.compact{z-index:4 !important;}
    .airport.compact:before{width:8px !important;height:8px !important;border-width:2px !important;}
    /* 広域表示では空港が密集するので、当たり判定を絞って誤タップを防ぐ */
    #airports.dense .airport{width:20px !important;height:20px !important;}
    .airport.compact .lbl{display:none;}
    /* ドラッグ中にブラウザのスクロール・文字選択・画像ドラッグに横取りされないようにする */
    .map{touch-action:none;user-select:none;-webkit-user-select:none;}
    .map img{-webkit-user-drag:none;user-drag:none;pointer-events:none;}
    .airport.active{z-index:7 !important;}
    .airport:hover{z-index:6 !important;}
    /* タップしやすさ：見た目の点は小さいまま、当たり判定だけ34pxに広げる（ラベルは判定に含めない） */
    .airport{width:34px !important;height:34px !important;display:grid !important;place-items:center !important;}
    .airport .lbl{position:absolute !important;top:24px;left:50%;transform:translateX(-50%);white-space:nowrap;pointer-events:none;}
    .airport.hide-pop .lbl small{display:none !important;}
    .airport.compact .lbl{display:none !important;}
    /* 自社路線：オレンジで元気に */
    .route,.multi-leg{background:linear-gradient(90deg,#ffa63d,#ff6f61) !important;height:3px !important;
      border-radius:3px !important;box-shadow:0 0 6px #ff8a3a80 !important;}
    .plane{filter:drop-shadow(0 1px 2px #0003);}
    /* ── ぼく管制官風：動く機体・無線・効果音 ── */
    #flights{position:absolute;inset:0;z-index:5;pointer-events:none}
    .flight-sprite{position:absolute;z-index:5;transform:translate(-50%,-50%);pointer-events:auto;cursor:pointer;will-change:left,top,transform;font-size:20px;line-height:1;color:#1273a2;filter:drop-shadow(0 2px 3px #0004)}
    .flight-sprite .body{display:inline-block}/* ✈ は右向きなので補正不要。機体の回転はスプライト側で行う */
    .flight-sprite:hover{filter:drop-shadow(0 0 9px var(--cyan))}
    .flight-sprite .tail{position:absolute;left:50%;top:50%;width:7px;height:7px;border-radius:50%;background:#ff9a3c;opacity:.5;transform:translate(-50%,-50%);animation:tailPuff 1.05s ease-out infinite;pointer-events:none}
    .flight-sprite.parked .tail{animation:none;opacity:0}
    .flight-sprite.parked{opacity:.75}
    @keyframes tailPuff{0%{transform:translate(-40%,-50%) scale(.5);opacity:.5}100%{transform:translate(-190%,-50%) scale(1.6);opacity:0}}
    .flight-bubble{position:absolute;z-index:9;transform:translate(-50%,-125%);background:#fff;border:2px solid #ffce6b;border-radius:12px;padding:7px 10px;font-size:12px;color:#2a4657;box-shadow:0 8px 20px #0003;white-space:nowrap;pointer-events:none;font-weight:500}
    .flight-bubble:after{content:'';position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);border:7px solid transparent;border-top-color:#ffce6b}
    .flight-bubble small{display:block;font-weight:400;color:#405964;margin-top:2px}
    #radio{position:absolute;left:14px;bottom:70px;z-index:8;display:flex;flex-direction:column;gap:6px;pointer-events:none;max-width:min(72%,330px)}
    .radio-bubble{display:flex;align-items:flex-start;gap:7px;background:#ffffffee;border:2px solid #cfe6f2;border-radius:14px;padding:6px 11px 6px 7px;box-shadow:0 6px 16px #0002;transition:opacity .4s,transform .4s}
    .radio-bubble.out{opacity:0;transform:translateX(-16px)}
    .radio-ic{flex:0 0 auto;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:15px;background:#eef7fb}
    .radio-tx{font-size:12px;line-height:1.32;color:#26414f;font-weight:500}
    .radio-tx small{display:block;font-weight:500;font-size:12px;letter-spacing:.06em;color:#496572;margin-bottom:1px}
    @keyframes radioIn{from{opacity:0;transform:translateY(10px) scale(.9)}to{opacity:1;transform:none}}
    .radio-bubble{animation:radioIn .28s cubic-bezier(.2,1.4,.4,1)}
    /* 地図上の日付。いつでも「いま何年目の何月か」が見える */
    /* 無線ふきだし（#radio, z:8）より上。狭い画面では無線が重なって
       日付と資金が読めなくなる。掛け合いは流れていくが、この2つは常に見えていたい */
    #dateChip{position:absolute;z-index:9;top:14px;right:60px;pointer-events:none;
      display:flex;flex-direction:column;align-items:flex-end}
    .date-chip{display:flex;align-items:center;gap:7px;padding:6px 11px 6px 9px;border-radius:14px;
      background:#ffffffe8;border:2px solid #cfe6f2;box-shadow:0 4px 12px #0002;white-space:nowrap}
    .date-chip .dc-ic{font-size:18px;line-height:1}
    .date-chip b{display:block;font-size:13px;color:#1373a6;line-height:1.2}
    .date-chip small{display:block;font-size:12px;color:#7da3b4;font-weight:500;margin-top:1px}
    .date-chip em,#date em{font-style:normal;color:#a0450a;font-weight:500}
    #date em{margin-left:5px;padding:1px 6px;border-radius:7px;background:#fff1e4;font-size:12px}
    /* 2026-10-14：日付の下に資金。週を送ると、この数字がスロットのように回る（animateCash）
       ・tabular-nums … 桁ごとの幅を揃える。回っている間に文字送りがガタつくと安っぽい
       ・.reel の上下グラデ … リールの窓。数字が筒の上で回っているように見せる
       ・.rolling … 回転中。上下に1pxだけ震わせ、残像を薄く置く */
    .cash-chip{position:relative;display:flex;align-items:baseline;gap:6px;margin-top:6px;
      padding:5px 12px 6px;border-radius:14px;background:#0e3b55f0;border:2px solid #2d7fa8;
      box-shadow:0 4px 12px #0003, inset 0 1px 0 #ffffff26;white-space:nowrap;
      transition:border-color .2s, box-shadow .2s}
    .cash-chip .cc-lab{font-size:12px;font-weight:500;letter-spacing:.1em;color:#8ec6e2}
    .cash-chip b{font-size:16px;font-weight:800;color:#fff;letter-spacing:.01em;
      font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;
      text-shadow:0 1px 0 #0006}
    .cash-chip.rolling{border-color:#ffd76a;box-shadow:0 4px 18px #f0b02955, inset 0 1px 0 #ffffff33}
    .cash-chip.rolling b{animation:reelShake .07s steps(2,end) infinite;
      text-shadow:0 -2px 3px #ffe9a880,0 2px 3px #ffe9a880}
    .cash-chip.rolling.up b{color:#ffe9a8}
    .cash-chip.rolling.down b{color:#ffc2b4;text-shadow:0 -2px 3px #ff9a8080,0 2px 3px #ff9a8080}
    .cash-chip.settle b{animation:reelStop .4s cubic-bezier(.2,1.6,.4,1)}
    @keyframes reelShake{from{transform:translateY(-1px)}to{transform:translateY(1px)}}
    @keyframes reelStop{0%{transform:scale(1.18)}60%{transform:scale(.97)}100%{transform:none}}
    /* 増えた額そのもの。資金チップの左どなりから浮かび上がって消える。
       上に出すと日付チップの「第○週」に重なって読めなくなったため、横へ逃がしている */
    .cash-chip .cc-delta{position:absolute;right:calc(100% + 8px);top:3px;opacity:0;pointer-events:none;
      white-space:nowrap;font-size:13px;font-weight:500;font-variant-numeric:tabular-nums;
      padding:2px 8px;border-radius:9px;background:#fff;box-shadow:0 3px 9px #0003}
    .cash-chip .cc-delta.up{color:#0b7a3e}
    .cash-chip .cc-delta.down{color:#c0392b}
    .cash-chip .cc-delta.fly{animation:deltaFly 2s ease-out forwards}
    @keyframes deltaFly{0%{opacity:0;transform:translate(10px,4px) scale(.8)}
      14%{opacity:1;transform:translate(0,-4px) scale(1.1)}
      30%{transform:translate(0,-7px) scale(1)}
      75%{opacity:1;transform:translate(0,-11px)}
      100%{opacity:0;transform:translate(-6px,-20px)}}
    /* 幅の狭い画面では、地図の下は凡例と運航状況で埋まっている。
       右上のままにして、章バーの下へ回り込ませる（実際の高さは render で入れる） */
    @media(max-width:560px){#dateChip{right:10px}
      .cash-chip{padding:4px 10px 5px}.cash-chip b{font-size:14px}}
    @media(prefers-reduced-motion:reduce){.cash-chip.rolling b,.cash-chip.settle b{animation:none}}
    #muteBtn{position:absolute;z-index:8;top:14px;right:14px;width:38px;height:38px;border-radius:50%;border:2px solid #cfe6f2;background:#ffffffe6;font-size:16px;cursor:pointer;box-shadow:0 4px 12px #0002}
    #muteBtn.off{filter:grayscale(1);opacity:.55}
    /* ④ 管制塔マスコットのチュートリアル */
    /* 2026-10-12：案内は画面に貼り付ける（fixed）。
       地図の中に置いていたため、スクロールすると案内だけ流れていってしまい、
       指している相手と重なることもあった。位置は placeTutCard() が決める。 */
    /* 買い物窓（z:28）の上に出す。ショップの中で「これを買おう」と案内するため */
    #tutorial{position:fixed;inset:0;z-index:29;pointer-events:none}
    /* 案内が出ている間は、無線ふきだしのぶんカードを持ち上げて場所を譲る */
    #mainMap.tut-on .tut-card{bottom:200px}
    @media(max-height:760px){#mainMap.tut-on .tut-card{bottom:176px}}
    /* 入場アニメは最初の1回だけ。ステップが変わるたびに再生すると、
       吹き出しが200msほど透明になり「操作中に消える」ように見える */
    .tut-card{position:absolute;left:50%;bottom:82px;transform:translateX(-50%);width:min(90%,430px);display:flex;gap:12px;align-items:flex-start;background:#fff;border:3px solid #ffce6b;border-radius:18px;padding:14px 16px;box-shadow:0 16px 40px #0004;pointer-events:auto;animation:radioIn .3s cubic-bezier(.2,1.4,.4,1)}
    /* つかんで動かせる。文字の上でも持てるよう、選択は切っておく */
    .tut-card{cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none;}
    .tut-card button{cursor:pointer;user-select:auto;}
    .tut-card.tut-dragging{cursor:grabbing;transition:none !important;animation:none !important;
      box-shadow:0 22px 50px #0005,0 0 0 3px #ffce6b99 !important;}
    .tut-grip{color:#d9b25e;margin-right:5px;letter-spacing:-1px;font-size:12px;vertical-align:-1px;}
    .tut-reset{background:transparent;color:#a8812a;border:1.5px solid #f0dcae;border-radius:10px;
      padding:7px 10px;font-weight:500;font-size:12px;cursor:pointer;}
    .tut-reset:hover{background:#fff7e6;}
    /* 中身が変わったことは、消さずに枠の明滅で知らせる */
    .tut-card.tut-bump{animation:tutBump .45s ease-out}
    @keyframes tutBump{0%{border-color:#ff9f1c;box-shadow:0 0 0 7px #ff9f1c44,0 16px 40px #0004}
      100%{border-color:#ffce6b;box-shadow:0 0 0 0 #ff9f1c00,0 16px 40px #0004}}
    .tut-ic{flex:0 0 auto;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:26px;background:#eef7fb}
    .tut-who{font-size:12px;font-weight:500;color:#8f650c;letter-spacing:.06em;margin-bottom:3px}
    .tut-tx{font-size:13px;color:#2a4657;line-height:1.5;font-weight:500}.tut-tx b{color:#1373a6}
    .tut-actions{display:flex;gap:8px;margin-top:11px;align-items:center}
    .tut-next{background:var(--cyan);color:#05202b;border:0;border-radius:10px;padding:8px 16px;font-weight:500;cursor:pointer}
    .tut-skip{background:#eef2f4;color:#405964;border:0;border-radius:10px;padding:8px 12px;font-weight:500;cursor:pointer}
    /* 2026-10-16：しまってあるときのつまみ。これがある限り案内は取り戻せる。
       画面の左下は、日付・資金チップ（右上）とも通知（右下）とも当たらない */
    .tut-restore{position:fixed;left:14px;bottom:14px;z-index:29;pointer-events:auto;
      display:flex;align-items:center;gap:6px;padding:10px 14px;border-radius:999px;
      border:3px solid #ffce6b;background:#fff;color:#8a5a00;font-weight:500;font-size:12px;
      font-family:inherit;cursor:pointer;box-shadow:0 10px 24px #0003;animation:radioIn .28s cubic-bezier(.2,1.4,.4,1)}
    .tut-restore:hover{background:#fff8e8}
    @media(max-width:560px){.tut-restore{left:10px;bottom:10px;padding:9px 12px}}
    .tut-dots{display:flex;gap:5px;margin-top:9px}
    .tut-dots span{width:7px;height:7px;border-radius:50%;background:#d6e4ea}.tut-dots span.on{background:var(--cyan);transform:scale(1.25)}
    .tut-dots span.did{background:var(--green)}
    .tut-step{float:right;font-size:12px;font-weight:500;color:#496572}
    /* 案内が勧めている行き先。おすすめ一覧の中の1枚だけを目立たせる */
    .dp-card.tut-target{border-color:#ff9f1c!important;background:#fffaf0!important;
      box-shadow:0 3px 0 #e08a1a,0 0 0 3px #ff9f1c44!important}
    /* 案内が勧めている機体。23機種の中から、ここだけは必ず見つかるようにする */
    .shop-body.tut-focus .shop-item:not(.tut-target){opacity:.34;filter:saturate(.4)}
    .shop-item.tut-target{border-color:#ff9f1c!important;background:#fffaf0!important;
      box-shadow:0 0 0 3px #ff9f1c55,0 6px 18px #0002!important;position:relative}
    .shop-item.tut-target:before{content:'おすすめ';position:absolute;top:-10px;left:12px;
      background:#ff9f1c;color:#fff;font-size:12px;font-weight:500;padding:2px 8px;border-radius:7px;letter-spacing:.06em}
    /* 案内が指している空港。94個の点の中から、ここだけは必ず見つかるようにする */
    #airports.tut-focus .airport:not(.tut-target){opacity:.28;filter:saturate(.4)}
    .airport.tut-target{z-index:12!important;}
    .airport.tut-target:before{border-color:#ff9f1c!important;background:var(--sun)!important;
      transform:scale(1.5);animation:tutPin 1.1s ease-in-out infinite;}
    .airport.tut-target .lbl{display:block!important;font-size:12px;font-weight:500;}
    .airport.tut-target .lbl small{display:none!important;}
    @keyframes tutPin{0%,100%{box-shadow:0 0 0 4px #ff9f1c55,0 2px 6px #0003}
      50%{box-shadow:0 0 0 13px #ff9f1c00,0 2px 6px #0003}}
    .tut-glow{outline:3px solid #ffce6b!important;outline-offset:2px;animation:tutPulse 1.2s ease-in-out infinite;z-index:9!important}
    @keyframes tutPulse{50%{outline-color:#ff9a3c;box-shadow:0 0 0 6px #ffce6b44}}
    /* ⑤ ランダムイベントのカード */
    .event-modal{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:#0a1a2688;animation:radioIn .2s;padding:18px}
    .event-card{width:min(340px,90vw);background:#fff;border-radius:20px;padding:22px 20px;text-align:center;box-shadow:0 22px 54px #0005;border-top:8px solid var(--cyan)}
    .event-card.good{border-top-color:#43c265}.event-card.bad{border-top-color:#ff8a5c}
    .event-ic{font-size:46px;line-height:1;animation:radioIn .4s cubic-bezier(.2,1.6,.4,1)}
    .event-card h3{margin:8px 0 6px;color:#26414f;font-size:18px}
    .event-card p{color:#405964;font-size:13px;line-height:1.6;margin:0 0 16px}

    .event-btns button.alt{background:#eef2f4;color:#48606c}
    /* ⑥ 今週の見どころ（アイコンで語る） */
    .highlights{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin:12px 0 4px}
    .hl{padding:9px 7px;border-radius:12px;background:#f3f8fb;border:1.5px solid #e2edf2;text-align:center}
    .hl span{display:block;font-size:12px;color:#496572;font-weight:500;letter-spacing:.03em}
    .hl b{display:block;font-size:12px;color:#2a4657;margin:3px 0;line-height:1.25}
    .hl small{font-size:12px;color:#405964}
    .hl.good{background:#eefaf0;border-color:#bfe8c8}.hl.bad{background:#fff2ee;border-color:#ffd3c2}.hl.rank{background:#fff8e6;border-color:#ffe2a8}
    /* セグメント式（ドロップダウン廃止） */
    .seg{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
    .seg-btn{flex:1 1 auto;min-width:60px;padding:8px 6px;border:2px solid #d6e4ea;border-radius:10px;background:#fff;color:#3a5563;font-weight:500;font-size:12px;cursor:pointer;line-height:1.2;transition:.12s;text-align:center}
    .seg-btn small{display:block;font-weight:500;font-size:12px;color:#496572;margin-top:2px}
    .seg-btn:hover:not(:disabled){border-color:var(--cyan)}
    .seg-btn.on{background:var(--cyan);border-color:var(--cyan);color:#05202b}
    .seg-btn.on small{color:#05202b}
    .seg-btn:disabled{opacity:.4;cursor:not-allowed}
    /* ── 2026-10-25：出発時刻は1列8行 ──
       2列4行だと時刻が左右に飛ぶので、早い順に目で追えなかった。
       1列にすると上から下へ時間が流れ、1行が横に長くなるぶん
       「06:30 早朝便／需要×1.08・空2」を折り返さず1行に置ける。
       ── 2026-10-26：2列4行に戻した（最初から出すことにしたため） ──
       1列8行は437pxあって〔OK〕を画面の外へ押し出す。
       10-25に2列を捨てた理由（時刻が左右に飛ぶ）は**行優先**で並べたからで、
       `grid-auto-flow:column` にすれば左の列が午前・右の列が午後と、
       どちらの列も上から下へ時間が流れる。
       1行に収まらなくなるので、時刻と中身を2段に積む。 */
    .slot-seg{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(4,auto);
      grid-auto-flow:column;gap:4px}
    .slot-seg .seg-btn{display:block;min-width:0;padding:5px 8px;
      font-size:13px;font-variant-numeric:tabular-nums;text-align:left;line-height:1.25}
    .slot-seg .seg-btn em{font-style:normal;font-size:12px;font-weight:500;margin-left:4px;opacity:.75}
    .slot-seg .seg-btn small{display:block;font-size:11px;margin-top:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .slot-seg .seg-btn small b{font-weight:500;color:#405964}
    .slot-seg .seg-btn small b.hi{color:#1f7a3d}.slot-seg .seg-btn small b.lo{color:#a0450a}
    .slot-seg .seg-btn.on small b,.slot-seg .seg-btn.on small{color:#05202b}
    .tap-hint{font-size:12px;color:#5b7886;background:#eef7fb;border:1.5px dashed #bcdcea;border-radius:10px;padding:8px 10px;margin:8px 0 2px}.tap-hint b{color:#1373a6}

    .pw-where{margin-left:auto;text-align:right;font-size:13px;font-weight:500;color:#1373a6;line-height:1.3}

    @media(max-width:760px){

      #planeModal .shop-head{flex-wrap:wrap}

      /* 絵・識別・金額・ボタンを1行に押し込むと、識別欄が44pxまで潰れて
         「JA02TS 737-8（MAX 8）」が省略記号に消えていた。
         狭い画面では 絵＋識別 ／ 金額＋ボタン の2行に割る */
      .pw-art{width:40px}

      .specbars.sb-4col{grid-template-columns:repeat(2,minmax(0,1fr));gap:3px 8px}
    }
    /* ── 2026-10-21：横長のパネルを縦に1列で積む ──
       それまでは 250px幅の縦長カードを auto-fill で横に3枚ならべていた。
       1枚が縦に伸びるので、同じ行の3枚で高さがそろわず、
       「座席」「航続」「滑走路」「値段」が機体ごとに違う高さに来て、
       横に見比べられなかった（買い物窓は機体を比べる場所なのに）。
       1行＝1機にすると、同じ項目が必ず同じ横位置に来るので目で追える。 */
    .shop-win .shop-body{display:block}
    .shop-win .shop-item{display:grid;
      /* 性能バー2列は1本あたり ラベル46＋バー40＋値62＋すきま12＝160px、2列で332px。
         支払欄は「¥21,300,000千」が1行に収まる幅（1枠100px）が要る——
         狭いと yenBr の <wbr> で折れて、高い機体だけ行が高くなっていた（94/110/124px）。 */
      grid-template-columns:minmax(0,0.85fr) minmax(0,1.40fr) minmax(0,1.35fr);
      align-items:center;gap:6px 13px;
      margin:0 0 6px;padding:8px 11px;border:2px solid #e2edf2;border-radius:14px;background:#fff}
    .shop-win .shop-item>.pi-top{grid-column:1}
    .shop-win .shop-item>.specbars{grid-column:2;margin:0}

    /* 全幅で下に敷くもの。並び順は HTML の順そのまま */
    .shop-win .shop-item>.nofit-note,
    .shop-win .shop-item>.pi-foot{grid-column:1/-1}
    /* 性能バーは2列×3行。縦1列だと6本で116px になり、支払欄より高くなる */
    .specbars.sb-2col{display:grid;grid-template-columns:1fr 1fr;gap:3px 8px;margin:0}
    .specbars.sb-2col .sb{gap:5px}
    .sb-extra{grid-column:1/-1;margin-top:3px;font-size:12px;color:#547482}

    .sb-warn .sb-l,.sb-warn .sb-v{color:#c0392b}
    .sb-warn .sb-t{background:#ffe4da}
    /* 解説・使いどころ・相場・寸法を1ブロックに。たたまない */
    .pi-foot{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 12px;margin-top:1px;padding-top:5px;
      border-top:1.5px dashed #e9f1f6;font-size:12px;line-height:1.4;color:#44667a}
    /* 使いどころは平均47字。1行に収まる幅があるので、縮めずに置く */
    .pf-tip{flex:1 1 320px;min-width:0;color:#7a5a16}
    .pf-tip b{color:#8f650c;margin-right:3px}
    .pf-real{flex:0 0 auto;color:#8a6a1a}

    /* 窓が狭いときは3つの区画を縦に積む（スマホ・分割表示） */
    @media (max-width:760px){

      /* 狭い幅でもバーは2列のまま。1列にすると6本で149pxになり、

      .specbars.sb-2col{grid-template-columns:1fr 1fr;gap:3px 6px}

      /* 値（1,150円/km など）は数字なので縮めない。足りないぶんは帯を細くして渡す */

    /* 社名の設定 */
    /* ===== 3領域レイアウト：地図の下を一覧に使う =====
       右の細い列は「操作」、地図の下の広い列は「一覧」。

    .layout{align-items:start!important}

       中身が無いときは殻も消す——場所は空けたまま、表示だけ消える。 */

    .pm-advice{margin:8px 0 0;padding:7px 9px;border-radius:9px;background:#fff8e6;border:1.3px solid #ffe2a8;font-size:12px;color:#7a5a16;line-height:1.5}
    .pm-advice b{color:#8f650c}
    .pm-btn{width:100%!important;margin-top:9px!important;padding:10px!important;font-size:13px!important}
    /* 空港・飛行場の区分 */
    .kind-tag{font-size:12px;font-weight:500;color:#1b6b8c;background:#e7f5fc;border:1.5px solid #bfe0f0;border-radius:999px;padding:2px 9px;white-space:nowrap}
    .kind-tag.field{color:#7a5a16;background:#fff8e6;border-color:#ffe2a8}
    .kind-tag.shared{color:#4a5a7a;background:#eef0fb;border-color:#c9d2ef}
    .kind-note{margin:6px 0 0;padding:7px 10px;font-size:12px;line-height:1.55;color:#405964;background:#f7fbfd;border:1.3px solid #dcecf5;border-radius:10px}
    .kind-note b{color:#2a4657}
    /* 購入とリースの比較 */
    /* 2026-10-15：支払い方法は「見出し・値段・説明・ボタン」で1枚のカード。
       以前は〈3つの欄〉〈まとめの説明〉〈3つのボタン〉と離れていて、
       どのボタンがどの欄のものか位置で数えないと分からなかった。
       3列のまま並べるのは、現金・ローン・リースを見くらべるための配置だから。
       ボタンの文言は「買う／借りる」だけでよい（方法はカードの見出しが言っている）。
       カードの高さが揃うよう、ボタンは margin-top:auto で下端に置く。 */
    .pay-cmp{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:2px 0 0;align-items:stretch}
    /* 2026-10-20：3列のうち「現金」は ¥2,450,000千 のように長い。
       数字には折り返せる場所が無いので、左右の余白を詰めて1行に収める（実測 73px / 枠 74px） */
    .pc-col{display:flex;flex-direction:column;padding:7px 4px;border-radius:11px;background:#f7fbfd;border:1.5px solid #dcecf5;min-width:0}
    .pc-col.loan{background:#f2f7ff;border-color:#c9ddf7}
    .pc-col.lease{background:#fffaf0;border-color:#ffe2a8}
    .pc-h{display:block;font-size:12px;font-weight:500;color:#405964}
    /* 金額は <wbr> で「単位の前」を優先的に折り、それでも入らなければどこでも折る。
       「円そのまま」表示だと ¥3,470,000,000 のように14桁になり、
       82pxの枠にはどう詰めても入らないため、最後の逃げ道を用意しておく */
    .pc-col b{display:block;margin-top:3px;font-size:13px;font-weight:500;color:#17384a;line-height:1.3;
      overflow-wrap:anywhere}
    .pc-col b i{display:block;font-style:normal;font-size:12px;color:#8f650c;margin-top:1px}
    .pc-col small{display:block;margin-top:3px;margin-bottom:7px;font-size:12px;color:#496572;line-height:1.35}
    .pc-col b{margin-bottom:7px}
    .pc-col .mini-btn{margin-top:auto;width:100%;min-width:0;padding:8px 2px;white-space:normal;line-height:1.25}
    .pc-col.loan .mini-btn:not(:disabled){background:#1f7ad0;border-color:#1f7ad0}
    .pc-col.lease .mini-btn:not(:disabled){background:#d08a0f;border-color:#d08a0f}
    .pc-note{margin-top:5px;font-size:12px;color:#405964;line-height:1.45}
    .pc-note b{color:#1373a6;font-weight:500}
    /* 難易度えらび */
    .diff-cards{display:flex;flex-direction:column;gap:11px}
    .diff-card{display:flex;gap:15px;align-items:flex-start;text-align:left;width:100%;padding:17px 18px;cursor:pointer;
      border:3px solid #d6e4ea;border-radius:16px;background:#fff;transition:.12s}
    .diff-card:hover{border-color:var(--cyan);background:#f5fcff;transform:translateY(-2px);box-shadow:0 7px 16px #5a9dc12e}
    .diff-card:active{transform:translateY(1px)}
    .diff-card.rec{border-color:#8fd9ff;background:#f7fcff}
    .diff-card .df-ic{font-size:36px;line-height:1.05}
    .df-main{flex:1;min-width:0}
    .df-main b{display:block;font-size:20px;color:#17384a;line-height:1.3}
    .df-main b i{font-style:normal;font-size:12px;font-weight:500;color:#fff;background:var(--cyan);border-radius:999px;padding:3px 11px;margin-left:10px;vertical-align:3px}
    .df-cash{display:block;font-size:18px;font-weight:800;color:#8f650c;margin-top:6px}
    /* 難易度の3軸を、資金の下に並べる */
    .df-axes{display:flex;flex-wrap:wrap;gap:4px 6px;margin-top:7px}
    .df-axes i{font-style:normal;font-size:12px;font-weight:500;color:#5b7886;
      background:#f2f8fb;border:1.5px solid #dcecf5;border-radius:999px;padding:3px 9px;white-space:nowrap}
    .df-axes i b{font-weight:500;color:#17384a;margin-left:3px}
    .df-tag{display:block;font-size:14px;font-weight:700;color:#1373a6;margin-top:5px;line-height:1.5}
    .df-note{display:block;font-size:12px;color:#405964;line-height:1.6;margin-top:4px}
    @media(max-width:560px){.diff-card{padding:13px 13px;gap:11px}.diff-card .df-ic{font-size:29px}
      .df-main b{font-size:17px}.df-cash{font-size:16px}.df-tag{font-size:12px}.df-note{font-size:12px}}
    .co-diff{margin-left:6px;font-size:12px;font-weight:500;color:#7a5a16;background:#fff8e6;border:1.5px solid #ffe2a8;border-radius:999px;padding:2px 9px;vertical-align:3px}
    .co-code{margin-left:8px;font-size:12px;font-weight:500;color:#1b6b8c;background:#e7f5fc;border:1.5px solid #bfe0f0;border-radius:999px;padding:2px 9px;vertical-align:3px}
    /* 曜日えらび */
    .dow-sum{margin-left:8px;font-size:12px;font-weight:500;color:#1373a6}
    .dow-row{display:flex;gap:4px;margin-top:6px}
    .dow-btn{flex:1 1 0;min-width:0;padding:7px 2px 5px;border:2px solid #d6e4ea;border-radius:10px;background:#fff;
      color:#496572;font-family:inherit;font-weight:500;font-size:13px;cursor:pointer;line-height:1.1;transition:.1s}
    .dow-btn i{display:block;font-style:normal;font-size:12px;font-weight:500;color:#b6cad6;margin-top:2px}
    .dow-btn:hover{border-color:var(--cyan)}
    .dow-btn.we{color:#c08aa0}
    .dow-btn.on{background:var(--cyan);border-color:var(--cyan);color:#05202b}
    .dow-btn.on i{color:#05202b}
    .dow-btn.we.on{background:#ffb3c6;border-color:#ffb3c6;color:#5c2436}
    .dow-btn.we.on i{color:#7d3348}
    /* 2026-10-26：曜日の下にあった帯（毎日・平日・週末／✔決定）は、
       7マスを最初から出すようにしたので丸ごと無くなった */
    /* 表示切替（カード／時刻表） */
    .view-sw{display:flex;gap:6px;margin:9px 0 0}
    .vw-btn{flex:1;padding:8px 6px;border:2px solid #d6e4ea;border-radius:11px;background:#fff;
      color:#3a5563;font-family:inherit;font-weight:500;font-size:12px;cursor:pointer;transition:.12s}
    .vw-btn:hover{border-color:var(--cyan)}
    .vw-btn.on{background:var(--cyan);border-color:var(--cyan);color:#05202b}
    /* 時刻表 */
    .tt-wrap{position:relative;margin-top:9px;max-width:100%;overflow-x:auto;border:1.5px solid #dcecf5;border-radius:12px;background:#fff;
      -webkit-overflow-scrolling:touch}
    table.tt{border-collapse:collapse;width:100%;min-width:640px;font-size:12px}
    /* 入りきらない画面では、横に送れることを右端の影で知らせる */
    @media(max-width:700px){
      .tt-wrap{background:linear-gradient(90deg,#fff 70%,#fff),linear-gradient(90deg,rgba(0,0,0,.06),transparent 14px) right/18px 100% no-repeat #fff}
      table.tt td,table.tt th{padding:7px 7px}
      .tt-plane small,.tt-dur small{display:none}
    }
    /* 2026-10-18：右側の板に入れると幅が 560 ほどになる。
       min-width:640 のままだと必ず横スクロールが出るので、中では詰めて組む */
    .md-body table.tt{min-width:0}
    .md-body table.tt td,.md-body table.tt th{padding:7px 4px}
    .md-body .tt-ap .tt-tag{margin-left:3px;padding:1px 4px}
    table.tt th{position:sticky;top:0;background:#eef7fb;color:#1f6a8e;font-weight:500;font-size:12px;
      text-align:left;padding:8px 9px;border-bottom:2px solid #cfe6f1;white-space:nowrap}
    table.tt td{padding:9px;border-bottom:1px solid #eef3f6;vertical-align:middle;color:#2a4657}
    table.tt tbody tr:last-child td{border-bottom:0}
    table.tt tbody tr:hover td{background:#f7fcff}
    table.tt tr.rest td{background:repeating-linear-gradient(135deg,#fafdff,#fafdff 7px,#f1f7fa 7px,#f1f7fa 14px);color:#496572}
    table.tt tr.noplane td{background:#fffdf6}
    .tt-ap{font-weight:500;white-space:nowrap}
    .tt-ap .tt-tag{font-style:normal;font-size:12px;font-weight:500;color:#1b6b8c;background:#e7f5fc;
      border:1.2px solid #bfe0f0;border-radius:999px;padding:1px 6px;margin-left:5px;vertical-align:1px}
    .tt-time{font-weight:500;color:#17384a;font-variant-numeric:tabular-nums;white-space:nowrap}
    .tt-plane{white-space:nowrap;font-weight:500;font-size:12px}
    .tt-plane small{display:block;font-size:12px;font-weight:500;color:#496572}
    .tt-dur{white-space:nowrap;font-weight:500;color:#1b6b8c;font-variant-numeric:tabular-nums}
    .tt-dur small{display:block;font-size:12px;font-weight:500;color:#496572}
    .tt-na{color:#8f650c;font-weight:500}
    .tt-warn{font-style:normal;margin-left:3px;color:#c0392b}
    table.tt tr:has(.tt-warn) td{background:#fff3ef}
    .tt-num{text-align:right;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
    .tt-num .pos{color:var(--green)}.tt-num .neg{color:var(--red)}
    .tt-note{margin:7px 2px 0;font-size:12px;color:var(--muted);line-height:1.55}
    /* 就航路線一覧 */
    /* 会社タブ「📊 路線の合計」の前置き（2026-10-26） */
    .rt-sub{margin:2px 2px 0;font-size:12px;color:#496572}
    .rt-sub b{color:#17384a}
    .rl-total{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:6px 0 0}
    .rl-total>div{padding:8px;border-radius:10px;background:#f3fafd;border:1.5px solid #cfe6f1;font-size:12px;color:#405964}
    .rl-total>div span{display:block;font-weight:500}
    .rl-total>div b{display:block;margin-top:2px;font-size:13px;font-weight:500;color:#17384a}
    .rl-total>div b.loss,.rl-total>div.loss b{color:var(--red)}
    .rl-total>div.pos b{color:var(--green)}
    .rl-total .rl-year{background:linear-gradient(90deg,#fff8e6,#f3fafd);border-color:#ffe2a8;display:flex;align-items:center;gap:8px}
    .rl-total .rl-year span{flex:1;font-size:12px}
    .rl-total .rl-year b{margin-top:0;font-size:15px}
    .rl-note{margin:7px 2px 0;font-size:12px;color:var(--muted);line-height:1.5}
    .rl-sort{margin-top:9px}
    .rl-row{margin:8px 0;padding:10px 11px;border:2px solid #e2edf2;border-radius:14px;background:#fff}
    /* ── 2026-10-23：就航中の航路は2行の横長パネルにする ──
       1行目＝顔と行き先と週の収支、2行目＝機材・曜日・便数・運賃・時刻・競合・駐機。
       売上の内訳・費用の内訳・読みやすさ・大型化の勧めは「くわしく」を開いたときだけ。
       閉じているときの高さを 691px → 2行ぶんに落とす。
       参入の警告（.rl-up.warn）だけは、取られる前に気づけないと意味がないので残す。 */
    .rl-row:not(.open) .rl-grid,
    .rl-row:not(.open) .rl-cost,
    .rl-row:not(.open) .rl-swing,
    .rl-row:not(.open) .rl-up:not(.warn){display:none}
    /* 要約のときは帯も細く、2行目は1行に収める */
    .rl-row:not(.open) .rl-bar{margin:5px 0 0}
    .rl-row:not(.open) .rl-sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    /* 狭い画面では1行に入らない（283pxの枠に560px要る）。
       数字を省略記号で隠すくらいなら、折り返して3行にする */
    @media(max-width:760px){.rl-row:not(.open) .rl-sub{white-space:normal;overflow:visible}}
    /* 操作は7つあって2段に折れる（88px）。閉じているときは「くわしく」だけ。
       残りは開いてから出す */
    .rl-row:not(.open) .route-ops{margin-top:6px}
    .rl-row:not(.open) .route-ops>*:not(.rl-more){display:none}
    /* 参入の警告は見出しだけ残す。理由と打ち手は開いたときに読めばよい */
    .rl-row:not(.open) .rl-up.warn{margin-top:6px;padding:6px 9px}
    .rl-row:not(.open) .rl-up.warn small{display:none}
    .rl-row.lossline{border-color:#ffc9b4;background:#fffaf8}
    .rl-row.unassigned{border-color:#ffe2a8;background:#fffdf6}
    .rl-row.resting{opacity:.9;background:repeating-linear-gradient(135deg,#fafdff,#fafdff 8px,#f1f7fa 8px,#f1f7fa 16px)}
    .rl-head{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
    .rl-head b{font-size:13px;color:#17384a}
    .rl-net{margin-left:auto;font-size:13px;font-weight:500;white-space:nowrap}
    .rl-net.ok{color:var(--green)}.rl-net.bad{color:var(--red)}.rl-net.na{color:#8f650c;font-size:12px}
    .rl-sub{margin-top:4px;font-size:12px;color:#405964;line-height:1.5}
    /* 2026-10-13：1枚550pxで1画面に1.8本しか入らなかった。
       客層・満足度・時刻表・操作ボタンは「くわしく」に畳み、一覧では数字だけを並べる。 */
    .rl-more{margin-left:auto;border:1.5px solid #d6e4ea;background:#f7fbfd;color:#4a6b7c;
      border-radius:9px;padding:4px 9px;font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap}
    .rl-more:hover{background:#eaf5fa;border-color:var(--cyan)}
    /* 時刻の帯：出発→到着と飛行時間 */
    .rl-time{margin-top:5px;padding:6px 8px;border-radius:9px;background:#f3fafd;border:1.5px solid #dcecf5;
      font-size:12px;color:#4a6c7d;display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px}
    .rl-time span{font-weight:500;color:#17384a;font-variant-numeric:tabular-nums;white-space:nowrap}
    .rl-time span i{font-style:normal;margin-left:5px;font-weight:500;color:#1b6b8c}
    .rl-time small{flex:1 0 100%;font-size:12px;color:#496572;font-weight:500}
    .rl-bar{position:relative;height:16px;margin:7px 0 6px;border-radius:8px;background:#eef3f6;overflow:hidden}
    .rl-bar i{display:block;height:100%;border-radius:8px;transition:width .25s}
    .rl-bar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;color:#2a4657}
    .rl-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
    .rl-grid>div{padding:6px 7px;border-radius:9px;background:#f7fbfd;font-size:12px;color:#405964}
    .rl-grid>div span{display:block;font-weight:500}
    .rl-grid>div b{display:block;margin-top:1px;font-size:12px;font-weight:500;color:#2a4657}
    .rl-grid>div b.loss{color:var(--red)}
    .rl-grid>div.pos{background:#eefaf0}.rl-grid>div.pos b{color:var(--green)}
    .rl-grid>div.loss{background:#fff2ee}.rl-grid>div.loss b{color:var(--red)}
    .rl-swing{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;margin-top:6px;padding:6px 9px;border-radius:9px;background:#f7fbfd;border:1.3px solid #dcecf5;font-size:12px;color:#405964}
    .rl-swing .rls-ic{font-size:12px}
    .rl-swing b{font-weight:500;color:#2a4657}
    .rl-swing b.calm{color:var(--green)}.rl-swing b.mid{color:#8f650c}.rl-swing b.wild{color:var(--red)}
    .rl-swing small{flex:1 1 100%;font-size:12px;color:#496572;margin-top:2px}
    /* 予想と実績の差 */
    .fc-diff{display:flex;align-items:center;gap:9px;margin:8px 0 2px;padding:8px 11px;border-radius:12px;border:2px solid}
    .fc-diff.up{background:#eefaf0;border-color:#bfe8c8}
    .fc-diff.down{background:#fff3ef;border-color:#ffc9b8}
    .fc-diff .fcd-ic{font-size:20px;line-height:1}
    .fc-diff b{display:block;font-size:12px;color:#17384a}
    .fc-diff small{display:block;font-size:12px;color:#405964;margin-top:2px;line-height:1.4}
    .fcd-s{margin-left:5px;font-size:12px;font-weight:500;color:#496572}
    .fcd-s.up{color:#1f7a3d}.fcd-s.down{color:#b4472a}
    .rl-rest{margin-top:7px;padding:6px 9px;border-radius:9px;background:#fff6e9;border:1.5px solid #ffd89a;font-size:12px;color:#7a5a16;line-height:1.5}
    .rl-row .route-ops{margin-top:8px}
    @media(max-width:360px){.rl-total,.rl-grid{grid-template-columns:repeat(2,1fr)}}
    /* 2026-10-16：四半期の収支レポート。週次カードと同じ読み口にする */
    /* 決算は項目が多いので、ふつうのイベントカード（340px）より広く取る */
    .event-card.month-report{width:min(520px,94vw);max-height:88vh;overflow:auto;text-align:left}
    .event-card.month-report h3{text-align:center}
    .mr-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;justify-content:center;
      margin:2px 0 8px;padding-bottom:7px;border-bottom:2px solid #e4eef5}
    .mr-head span{font-size:12px;font-weight:500;color:#496572}
    .mr-head b{font-size:19px;font-weight:800;color:#17384a}
    .mr-head em{font-style:normal;font-size:12px;color:#496572}
    /* 期の中の3か月。伸びているのか落ちているのかを、開いた瞬間に見せる */
    .mr-months{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:0 0 9px}
    .mr-months>div{padding:6px 7px;border-radius:10px;text-align:center;border:1.5px solid #e4eef5;background:#f7fbfd}
    .mr-months>div.pos{background:#f3fbf5;border-color:#cfe9d6}
    .mr-months>div.neg{background:#fff6f3;border-color:#ffd6c9}
    .mr-months span{display:block;font-size:12px;font-weight:500;color:#496572}
    .mr-months b{display:block;margin-top:1px;font-size:12px;font-weight:500;
      font-variant-numeric:tabular-nums;color:#3a5563}
    .mr-months>div.pos b{color:#1f7a3d}.mr-months>div.neg b{color:#c0392b}
    .mr-sheet{display:flex;flex-direction:column;gap:2px}
    .mr-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
      padding:4px 8px;border-radius:8px;font-size:12px}
    .mr-row span{color:#405964}
    .mr-row b{font-weight:500;color:#3a5563;font-variant-numeric:tabular-nums;white-space:nowrap}
    .mr-row.rev{background:#f2fafd}.mr-row.rev b{color:#1373a6}
    .mr-row.sum{margin-top:4px;padding:7px 8px;border-top:2px solid #e4eef5;font-size:13px}
    .mr-row.sum span{font-weight:500;color:#2a4657}
    .mr-row.sum b{font-size:16px}
    .mr-row.pos b{color:#1f7a3d}.mr-row.neg b{color:#c0392b}
    .mr-row.ind span{padding-left:10px;color:#547482}
    .mr-row.ind b{color:#405964}
    .mr-kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:9px 0 0}
    .mr-kpi>div{padding:6px 7px;border-radius:10px;background:#f7fbfd;border:1.5px solid #e4eef5;text-align:center}
    .mr-kpi span{display:block;font-size:12px;color:#496572;font-weight:500}
    .mr-kpi b{display:block;margin-top:1px;font-size:12px;font-weight:500;color:#17384a;
      font-variant-numeric:tabular-nums}
    .mr-vs{margin-top:8px;padding:6px 10px;border-radius:10px;font-size:12px;font-weight:500;text-align:center}
    .mr-vs.up{background:#eefaf0;color:#1e7a46}
    .mr-vs.down{background:#fff2ee;color:#c0392b}
    .mr-vs b{font-weight:500}
    .mr-routes{margin-top:10px}
    .mr-lab{display:block;font-size:12px;font-weight:500;color:#496572;margin-bottom:3px}
    .mr-rt{display:flex;align-items:center;gap:7px;padding:5px 8px;border-radius:9px;

    .mk-sum{font-size:12px;font-weight:500;color:#17384a;line-height:1.4}
    .mk-sum small{display:block;margin-top:2px;font-size:12px;font-weight:500;color:#496572}
    .mk-net{margin:7px 0 2px;font-size:12px;color:#496572}
    .mk-net b{font-size:13px;font-weight:700}
    .mk-net.ok b{color:#1e7c37}.mk-net.loss b{color:#c0392b}
    .mk-ok .btn{margin-top:8px}
    .pick-plane.on{border-color:#1683bd;background:#eaf6fd;box-shadow:0 0 0 2px #1683bd33}
    /* 「🆕 新たに航路をつくる」の見出しと「やめる」を1段に並べる */
    .rt-mk{display:flex;align-items:center;gap:10px;margin:6px 0 2px}
    .rt-mk .step-title{flex:1 1 auto;margin:0}
    .rt-mk .mini-btn{flex:0 0 auto;width:auto;padding:6px 12px}
    /* 航路タブの「就航中の便」要約（2026-10-21） */
    .rm-list{display:flex;flex-direction:column;gap:5px;margin:4px 0 2px}
    .rm-row{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;
      padding:7px 10px;border:1.5px solid #dcecf5;border-radius:11px;background:#fff;
      text-align:left;cursor:pointer;font:inherit}
    .rm-row:hover{border-color:#9fcbe2;background:#f6fbfe}
    .rm-row.idle{border-style:dashed;background:#fcfdfe}
    .rm-row.rest{opacity:.72}
    .rm-main{flex:1 1 auto;min-width:0}
    .rm-main b{display:block;font-size:12px;font-weight:500;color:#17384a;line-height:1.3}
    .rm-main small{display:block;margin-top:1px;font-size:12px;color:#496572;line-height:1.3}
    .rm-num{flex:0 0 auto;text-align:right}
    .rm-num b{display:block;font-size:12px;font-weight:700;line-height:1.3}
    .rm-num b.pos{color:#1e7c37}.rm-num b.neg{color:#c0392b}
    .rm-num small{display:block;margin-top:1px;font-size:12px;color:#547482;line-height:1.3}
    .rm-empty{margin:6px 0 2px;font-size:12px;color:#496572;line-height:1.5}
    /* 保有機材の設定（座席・サービス・装備）。
       2026-10-17：行先ブロックのドラッグ＆ドロップは廃止したので、
       .unassigned-blocks / .route-block / .drop-slot / .pick-bar は削除した。
       路線への配属は、航路タブの路線カードの .rp-pick で行う。 */
    .ub-empty{font-size:12px;color:#496572;padding:6px 2px;}
    .plane-cards{display:flex;flex-direction:column;gap:10px;}
    .plane-card{border:2px solid #dcecf5;border-radius:16px;background:#fff;padding:10px;box-shadow:0 4px 0 #eaf4fa;}
    .pc-head{font-size:13px;color:#2a4a5a;font-weight:500;}
    .pc-head .pc-plane{color:#1273a2;margin-right:2px;}
    .pc-spec{font-size:12px;color:#405964;margin:2px 0 2px;}
    /* ── 2026-10-17：左に項目、右に中身（マスター/ディテール） ──
       折りたたみだと、開いた瞬間に下の項目がぜんぶ下へずれて場所を見失う。
       項目の列は動かさず、右側だけ差し替える。 */
    .md{display:grid;grid-template-columns:232px minmax(0,1fr);gap:10px;align-items:start}
    .md.wide{grid-template-columns:272px minmax(0,1fr)}
    /* 表を右に出す板は、見出し列を詰めて中身に幅を回す */
    .md.slim{grid-template-columns:196px minmax(0,1fr)}
    .md-list{display:flex;flex-direction:column;gap:4px;position:sticky;top:8px}
    .md-item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;
      padding:7px 9px;border:1.5px solid #dcecf5;border-radius:11px;background:#fff;
      font-family:inherit;cursor:pointer;transition:.1s}
    .md-item:hover{border-color:#9fcbe2;background:#f7fcff}
    .md-item.on{border-color:#1f9fe0;background:#eaf6fd;box-shadow:0 0 0 2px #1f9fe029}
    .md-item .mi-ic{flex:0 0 auto;font-size:16px;line-height:1}
    .md-item .mi-art{display:block;width:46px;height:30px;border-radius:7px;overflow:hidden;
      background:linear-gradient(180deg,#f4fbff,#e7f4fb);border:1.5px solid #d8eaf4}
    .md-item .mi-art .pa-svg{width:100%;height:100%}
    .md-item .mi-tx{flex:1 1 auto;min-width:0}
    /* 名前と数字は同じ行に。数字を別の列にすると名前の幅が足りず「JA02AO DHC…」になる */
    .md-item .mi-top{display:flex;align-items:baseline;gap:6px}
    .md-item .mi-tx b{flex:1 1 auto;min-width:0;font-size:12px;font-weight:500;color:#2a4657;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .md-item .mi-tx small{display:block;font-size:12px;color:#496572;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .md-item .mi-right{flex:0 0 auto;font-size:12px;font-weight:500;
      font-variant-numeric:tabular-nums;white-space:nowrap}
    .mi-net.ok{color:#1f7a3d}.mi-net.bad{color:#c0392b}
    .md-body{min-width:0}
    /* ── 2026-10-19：空港データの図解 ──
       数字を並べるだけでは「長いのか短いのか／高いのか安いのか／空いているのか」が読めない。
       物差し・ゲージ・棒にして、見比べる相手を画面の中に置く。 */
    .apd{display:flex;flex-direction:column;gap:10px}
    .apd-head{border:1.5px solid #dcecf5;border-radius:14px;background:linear-gradient(180deg,#f7fcff,#eef7fb);padding:11px 13px}
    .apd-name{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .apd-name>b{font-size:15px;font-weight:800;color:#1b3a4a}
    .apd-code{font-size:12px;font-weight:500;color:#1f6a8e;background:#fff;border:1.5px solid #bfe0f0;
      border-radius:7px;padding:1px 7px;letter-spacing:.08em}
    .apd-rank{font-size:12px;font-weight:500;color:#fff;border-radius:7px;padding:1px 8px;line-height:1.5}
    .apd-rklab{font-size:12px;color:#405964}
    .apd-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px;margin-top:9px}
    .apd-kpis>div{background:#fff;border:1.5px solid #e2eef5;border-radius:11px;padding:7px 9px}
    .apd-kpis span{display:block;font-size:12px;color:#405964}
    .apd-kpis span em{font-style:normal;font-size:12px;color:#547482;margin-left:3px}
    .apd-kpis b{font-size:21px;font-weight:800;color:#17384a;font-variant-numeric:tabular-nums;line-height:1.2}
    .apd-kpis b.sm{font-size:14px}
    .apd-kpis i{font-style:normal;font-size:12px;color:#405964;margin-left:3px}
    /* 数字の下に全国順位。上位ほど濃い色で、94空港のどのあたりかが色でも分かる */
    .kpi-rank{display:block;margin-top:4px;font-size:12px;text-decoration:none;border-radius:999px;
      padding:1px 7px;font-weight:500;width:max-content;max-width:100%;white-space:nowrap;
      overflow:hidden;text-overflow:ellipsis}
    .kpi-rank b{font-size:12px;font-weight:500}
    .kpi-rank i{font-style:normal;font-size:12px;opacity:.7;margin-left:1px}
    .kpi-rank.rk-top{background:#ffe9ef;color:#a82f53;border:1.2px solid #f6c6d5}
    .kpi-rank.rk-high{background:#e9f3fd;color:#215b96;border:1.2px solid #c6dcf4}
    .kpi-rank.rk-mid{background:#eef5f8;color:#405964;border:1.2px solid #d8e7ee}
    .kpi-rank.rk-low{background:#f4f7f9;color:#496572;border:1.2px solid #e2eaef}
    .kpi-rank.rk-note{background:transparent;border:0;padding:1px 0;color:#496572;font-weight:500;white-space:normal}
    .apd-two{display:grid;grid-template-columns:repeat(auto-fit,minmax(252px,1fr));gap:10px}
    .apd-card{border:1.5px solid #dcecf5;border-radius:14px;background:#fff;padding:10px 12px}
    .apd-card h4{margin:0 0 9px;font-size:12px;font-weight:500;color:#2a4a5a;display:flex;
      align-items:baseline;gap:7px;flex-wrap:wrap}
    .apd-card h4 small{font-weight:500;color:#496572;font-size:12px}
    /* 滑走路：4kmの物差しの上に置く */
    .rw-viz{position:relative;padding-bottom:16px}
    .rw-bar{height:13px;border-radius:4px;background:#eef4f7;border:1px solid #e0eaf0;margin-bottom:4px;overflow:hidden}
    .rw-bar i{display:block;height:100%;background:linear-gradient(90deg,#4fb3e8,#1f7fb8)}
    .rw-ticks{position:absolute;left:0;right:0;bottom:0;height:14px}
    .rw-ticks span{position:absolute;top:0;transform:translateX(-50%);font-size:12px;color:#547482;
      padding-top:2px;border-left:1px solid #dde8ee;line-height:1}
    /* 右端の目盛りは、半分だけ外へはみ出してしまうので内側へ寄せる */
    .rw-ticks span:last-child{transform:translateX(-100%);border-left:0;border-right:1px solid #dde8ee}
    .rw-num{display:flex;align-items:baseline;gap:7px;margin-top:4px}
    .rw-num b{font-size:18px;font-weight:800;color:#17384a;font-variant-numeric:tabular-nums}
    .rw-num span{font-size:12px;color:#405964}
    .rw-fit{margin-top:8px;font-size:12px;color:#4a6b7c}
    .rw-fit b{color:#17384a}
    .rw-fit i{display:block;height:6px;border-radius:3px;background:#eef4f7;margin-top:4px;overflow:hidden}
    .rw-fit i u{display:block;height:100%;background:#2fa35a;text-decoration:none}
    /* 着陸料：全国の幅のどこか */
    .fee-gauge{position:relative;height:10px;border-radius:5px;margin:22px 0 18px;
      background:linear-gradient(90deg,#9fd8b4,#ffe08a,#f3a08c)}
    .fee-gauge i{position:absolute;top:-4px;width:4px;height:18px;border-radius:2px;background:#17384a;transform:translateX(-50%)}
    .fee-gauge b{position:absolute;top:-21px;transform:translateX(-50%);font-size:12px;font-weight:500;
      color:#17384a;white-space:nowrap;font-variant-numeric:tabular-nums}
    .fee-gauge .fg-lo,.fee-gauge .fg-hi{position:absolute;top:13px;font-size:12px;color:#496572;white-space:nowrap}
    .fee-gauge .fg-lo{left:0}.fee-gauge .fg-hi{right:0}
    .fee-mix{display:flex;gap:6px;flex-wrap:wrap}
    .fee-mix span{flex:1 1 68px;background:#f6fafc;border:1.5px solid #e4eef4;border-radius:10px;
      padding:5px 7px;font-size:12px;color:#405964;text-align:center}
    .fee-mix b{display:block;font-size:14px;font-weight:800;color:#17384a;font-variant-numeric:tabular-nums}
    .fee-mix b.hot{color:#c0392b}
    .fee-mix .tot{background:#eef7fb;border-color:#cfe6f1}
    .fee-eg{margin-top:8px;font-size:12px;color:#405964}
    .fee-eg b{color:#17384a}
    /* 発着枠の棒グラフ */
    .apd-card.wide{grid-column:1/-1}
    /* 9枠を1行に並べたいが、板が狭いと1枠29pxになり「06〜08」(42px)が切れる。
       入る幅があるときだけ1行、足りなければ折り返す（2026-10-22） */
    .slotchart{display:grid;grid-template-columns:repeat(auto-fit,minmax(42px,1fr));gap:5px;align-items:end}
    .sc-col{min-width:0;border:0;background:transparent;padding:0;font-family:inherit;cursor:pointer;
      border-radius:8px;transition:.1s}
    .sc-col:hover .sc-stack{background:#f3f9fc}
    .sc-col.picked .sc-stack{background:#eaf4fa}
    .sc-col.picked .sc-lab{color:#1273a2;font-weight:700}
    /* 棒を押したときに出る内訳。吹き出しが使えない端末でも読める */
    .sc-pick{margin-top:9px;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;
      font-size:12px;color:#405964;background:#f6fafc;border:1.5px solid #e2eef5;border-radius:10px;padding:7px 10px}
    .sc-pick>b{color:#17384a}
    .sc-pick span b{color:#17384a;font-weight:700}
    .sc-pick .free b{color:#1e7c37}
    .sc-pick .none b{color:#c0392b}
    .sc-pick.hint{color:#496572;background:#fff;border-style:dashed}
    /* グラフ本体と凡例を横に並べる。棒で板の幅を埋めずに、余りは凡例と空気に回す */
    /* 棒は細くし、グラフ自体にも上限を置く。板いっぱいに引き伸ばさない。
       目盛り「06〜08」は42px要るので、帯はそれより狭くしない（切れるくらいなら上限を広げる） */
    .sc-wrap{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:flex-start}
    /* min-width:0 が無いと、格子の最小幅（9帯ぶん418px）で突っぱねて狭い画面からはみ出す */
    .sc-wrap .slotchart{flex:1 1 300px;max-width:430px;min-width:0}
    .sc-stack{position:relative;height:118px;display:block;
      border-bottom:1px solid #d8e6ee}   /* 基線は実線のヘアライン1本 */
    /* さばける回数は「箱」ではなく基準線。実線の細い線1本で足りる */
    .sc-capline{position:absolute;left:0;right:0;height:1px;background:#b9d0dd}
    .sc-capline::after{content:'';position:absolute;right:0;top:-2px;width:5px;height:5px;
      border-radius:50%;background:#b9d0dd}
    /* 棒は20px固定（上限24px）。帯の余りは空気として残す */
    .sc-used{position:absolute;left:50%;transform:translateX(-50%);bottom:0;width:20px;
      border-radius:4px 4px 0 0;display:flex;align-items:flex-start;justify-content:center}
    /* 自社ぶんは同じ色の濃い段。地色の2pxの隙間で他社ぶんと分ける（枠線は引かない） */
    .sc-used u{display:block;width:100%;min-height:3px;border-radius:4px 4px 0 0;text-decoration:none;
      border-bottom:2px solid #fff}
    .sc-col.ok .sc-used{background:#43b06e}
    .sc-col.tight .sc-used{background:#e0ab20}
    .sc-col.full .sc-used{background:#d4573c}
    .sc-col.ok .sc-used u{background:#1f7a46}
    .sc-col.tight .sc-used u{background:#9c7310}
    .sc-col.full .sc-used u{background:#93341f}
    /* 数字は全部には付けない（いちばん混む枠・いちばん空く枠・選んだ枠だけ） */
    .sc-val{position:absolute;left:0;right:0;margin-bottom:3px;text-align:center;font-size:12px;
      font-weight:700;color:#405964;font-variant-numeric:tabular-nums;line-height:1}
    .sc-shut{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-size:12px;color:#547482}
    .sc-col.shut .sc-stack{background:repeating-linear-gradient(135deg,#f7fafb,#f7fafb 5px,#eef3f6 5px,#eef3f6 10px)}
    .sc-lab{display:block;margin-top:6px;text-align:center;font-size:12px;color:#547482;
      font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .sc-legend{flex:1 1 100%;min-width:0;display:flex;align-items:center;gap:5px 12px;
      flex-wrap:wrap;font-size:12px;color:#496572}
    .sc-legend .k{display:inline-flex;align-items:center;gap:5px;color:#405964;white-space:nowrap}
    .sc-legend .k::before{content:'';width:9px;height:9px;border-radius:2px;background:#43b06e;flex:0 0 auto}
    .sc-legend .tight::before{background:#e0ab20}
    .sc-legend .full::before{background:#d4573c}
    .sc-legend .mine::before{background:#1f7a46}
    .sc-legend .capk::before{width:14px;height:1px;border-radius:0;background:#b9d0dd}
    .sc-legend em{font-style:normal;flex:1 1 100%;min-width:0;color:#496572}
    /* グラフを読まなくても動けるように、結論を1行で */
    .sc-advice{margin:-2px 0 9px;font-size:12px;color:#2a6b45;background:#f1fbf5;
      border:1.5px solid #cbe9d8;border-radius:10px;padding:6px 9px}
    .sc-advice b{color:#17384a}
    .sc-advice .bad{color:#c0392b}
    .sc-advice.none{color:#9a3326;background:#fff4f1;border-color:#f3cfc6}
    /* 空白の行き先。押すとその空港へ移る */
    .apg-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(248px,1fr));gap:5px}
    .apg{display:grid;grid-template-columns:96px minmax(0,1fr) auto;grid-template-rows:auto auto;
      gap:2px 8px;align-items:center;width:100%;text-align:left;font-family:inherit;cursor:pointer;
      border:1.5px solid #dcecf5;border-radius:11px;background:#fff;padding:7px 10px;transition:.1s}
    .apg:hover{border-color:#9fcbe2;background:#f7fcff}
    .apg.mine{border-color:#cbe9d8;background:#f6fcf8}
    .apg-n{grid-column:1;grid-row:1;font-size:12px;font-weight:500;color:#2a4657;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .apg-bar{grid-column:2;grid-row:1;height:9px;border-radius:5px;background:#eef4f7;overflow:hidden}
    .apg-bar u{display:block;height:100%;background:#43b06e;text-decoration:none}
    .apg.loss .apg-bar u{background:#e08a7a}
    .apg-net{grid-column:3;grid-row:1;font-size:12px;font-weight:700;color:#1f7a3d;
      font-variant-numeric:tabular-nums;white-space:nowrap}
    .apg.loss .apg-net{color:#c0392b}
    .apg-net em{font-style:normal;font-weight:500;color:#496572;margin-left:1px}
    .apg-sub{grid-column:1/-1;grid-row:2;font-size:12px;color:#496572}
    /* 行先の行もボタンになったので、見た目を素の行に戻しておく */
    button.apb{width:100%;text-align:left;font-family:inherit;border:0;background:transparent;
      cursor:pointer;border-radius:8px}
    button.apb:hover{background:#f2f9fd}
    /* 乗り入れ航空会社・行先の横棒 */
    .apr h4{margin:2px 0 8px;font-size:12px;font-weight:500;color:#2a4a5a;display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
    .apr h4 small{font-weight:500;color:#496572;font-size:12px}
    .apr-bars{display:grid;grid-template-columns:repeat(auto-fit,minmax(266px,1fr));gap:3px 16px;margin-bottom:12px}
    .apb{display:flex;align-items:center;gap:7px;padding:3px 0;min-width:0}
    .apb-n{flex:0 0 112px;font-size:12px;font-weight:500;color:#2a4657;white-space:nowrap;
      overflow:hidden;text-overflow:ellipsis}
    .apb-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:0}
    /* 行先の名前は短い（羽田・福岡）。会社名ぶんの幅は要らないので、そのぶん棒に回す */
    .apr-bars.dest .apb-n{flex:0 0 80px}
    .apb>b{min-width:22px;text-align:right}
    .apb-me{font-style:normal;font-size:12px;font-weight:500;color:#1f7a3d;background:#e6f7ed;
      border:1.2px solid #b8e5cb;border-radius:999px;padding:0 5px;margin-left:4px}
    .apb>i{flex:1 1 56px;min-width:0;height:9px;border-radius:5px;background:#eef4f7;overflow:hidden}
    .apb>i u{display:block;height:100%;background:#8fbed8;text-decoration:none}
    .apb.mine>i u{background:#43b06e}
    .apb>b{flex:0 0 auto;font-size:12px;font-weight:500;color:#17384a;font-variant-numeric:tabular-nums}
    .apb>b em{font-style:normal;font-weight:500;color:#496572;margin-left:2px}
    .apb-p{flex:0 0 auto;font-size:12px;color:#496572;white-space:nowrap}
    /* 行先に入っている会社名は長い（JAL・ANA・スカイマーク・ソラシドエア）。
       横棒の幅を食いつぶさないよう、ここだけ縮んで三点リーダで切れるようにする */
    .apb-c{flex:0 0 auto;display:flex;gap:0;white-space:nowrap}
    .apb-c .apb-dot{margin-right:0;margin-left:3px}
    .apb-more{font-style:normal;font-size:12px;color:#496572;margin-left:3px}
    .al-why{display:block;font-size:12px;color:#8f650c;margin-top:2px}
    /* 満席の路線に、大きい機体を勧める帯。このゲームの成長はここで起きる */
    .rl-up{display:flex;gap:8px;align-items:flex-start;margin-top:7px;padding:8px 10px;
      background:#f3fbf6;border:1.5px solid #cbe9d8;border-radius:11px}
    .rl-up .rlu-ic{flex:0 0 auto;font-size:14px;color:#1e7c37}
    .rl-up b{display:block;font-size:12px;color:#17384a;font-weight:700}
    .rl-up b u{text-decoration:none;color:#1e7c37}
    .rl-up small{display:block;margin-top:3px;font-size:12px;color:#496572;line-height:1.5}
    .rl-up .rlu-who{text-decoration:none;color:#1e7c37;font-weight:700}
    /* 取られる前に知らせる側は、色を変えて区別する */
    .rl-up.warn{background:#fff8e6;border-color:#f0dcae}
    .rl-up.warn .rlu-ic{color:#8f650c}
